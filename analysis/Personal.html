<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個人成績概況</title>
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="analysis-common.css?v=20261112">
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a href="Dashboard.html">全班概況</a>
      <a class="on" href="Personal.html">個人概況</a>
      <a href="Gradebook.html">成績總表</a>
      <a href="Progress.html">成績歷程</a>
      <a href="Report.html">家長報告</a>
      <a href="Attention.html">關注名單</a>
      <a href="Awards.html">獎狀名單</a>
      <a href="Missing.html">缺分紀錄</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span class="lbl">科目</span><span id="subjectBtns" class="grp"></span></span>
      <span class="grp">
        <span class="lbl">學生</span>
        <button id="prevBtn" title="上一位">◀</button>
        <select id="stuSel"></select>
        <button id="nextBtn" title="下一位">▶</button>
      </span>
      <span class="grp"><span class="lbl">學期</span><span id="termBtns" class="grp"></span></span>
      <span class="grp" id="catWrap"><span class="lbl">測驗類別</span><span id="catBtns" class="grp"></span></span>
    </div>
    <div id="main"></div>
  </div>
</div>

<script src="analysis-stats.js?v=20261112"></script>
<script src="analysis-demo.js?v=20261112"></script>
<script src="analysis-art.js?v=20261112"></script>
<script src="analysis-common.js?v=20261112"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt, sg = S.signed, ALL = '*';
  var st = { raw: null, model: null, subject: null, key: null, term: null, cats: null };

  AX.shell();
  AX.onResize(function () { if (st.model) renderMain(); });

  AX.load().then(function (r) {
    st.raw = r.raw; st.model = r.model;
    var q = AX.qs(), names = st.model.subjects.map(function (s) { return s.name; });
    st.subject = names.indexOf(q.subject) > -1 ? q.subject : names[0];
    if (!st.subject) { AX.$('main').appendChild(el('div', { 'class': 'card empty' }, '試算表還沒有任何科目，請先到「登記分數」面板建立。')); return; }
    var s = sm();
    st.key = q.key && s.index[q.key] !== undefined ? q.key : (s.keys[0] || null);
    if (q.term !== undefined && (q.term === ALL || s.terms.indexOf(q.term) > -1)) st.term = q.term;
    else st.term = S.defaultTerm(st.model, s);
    renderBar(); renderMain();
  }).catch(AX.showError);

  function sm() { return S.subjectOf(st.model, st.subject); }
  function scope() {
    var s = sm();
    if (st.term === ALL) return { A: s.all, T: null, isAll: true };
    var bt = s.byTerm[st.term];
    return bt ? { A: bt.A, T: bt.T, isAll: false } : null;
  }

  // ---------- 列 ----------
  function renderBar() {
    var s = sm();
    AX.btnGroup(AX.$('subjectBtns'), st.model.subjects.map(function (x) { return { label: x.name, value: x.name }; }), st.subject, function (v) {
      st.subject = v; var n = sm();
      if (n.index[st.key] === undefined) st.key = n.keys[0] || null;
      if (st.term !== ALL && n.terms.indexOf(st.term) === -1) st.term = S.defaultTerm(st.model, n);
      st.cats = null; renderBar(); renderMain();
    });
    var sel = AX.$('stuSel'); AX.clear(sel);
    s.data.students.forEach(function (stu, i) {
      var o = el('option', { value: s.keys[i] }, AX.seatLabel(stu));
      if (s.keys[i] === st.key) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { st.key = sel.value; renderMain(); };
    AX.$('prevBtn').onclick = function () { step(-1); };
    AX.$('nextBtn').onclick = function () { step(1); };
    var items = s.terms.map(function (t) { return { label: S.termLabel(t), value: t }; });
    if (s.terms.length > 1) items.push({ label: '全部學期', value: ALL });
    AX.btnGroup(AX.$('termBtns'), items, st.term, function (v) { st.term = v; st.cats = null; renderBar(); renderMain(); });
    renderCatBtns();
  }
  function step(d) {
    var s = sm(), n = s.keys.length; if (!n) return;
    st.key = s.keys[(s.keys.indexOf(st.key) + d + n) % n];
    AX.$('stuSel').value = st.key;
    renderMain();
  }
  function renderCatBtns() {
    var sc = scope(), box = AX.$('catBtns'); AX.clear(box);
    var cats = [];
    if (sc) sc.A.quiz.forEach(function (q) { if (cats.indexOf(q.category) === -1) cats.push(q.category); });
    AX.$('catWrap').hidden = cats.length < 2;
    if (st.cats) st.cats = st.cats.filter(function (c) { return cats.indexOf(c) > -1; });
    if (st.cats && !st.cats.length) st.cats = null;
    [{ label: '全部', value: ALL }].concat(cats.map(function (c) { return { label: c || '（未分類）', value: c }; })).forEach(function (it) {
      var on = it.value === ALL ? !st.cats : (st.cats && st.cats.indexOf(it.value) > -1);
      var b = el('button', { 'class': on ? 'on' : '' }, it.label);
      b.onclick = function () {
        if (it.value === ALL) st.cats = null;
        else { var cur = st.cats ? st.cats.slice() : [], i = cur.indexOf(it.value); if (i > -1) cur.splice(i, 1); else cur.push(it.value); st.cats = cur.length ? cur : null; }
        renderCatBtns(); renderMain();
      };
      box.appendChild(b);
    });
  }

  // ---------- 主畫面 ----------
  // 個人頁只回答一件事：這個孩子現在狀況好不好？哪裡需要幫忙？
  // 由上往下：結論 → 重點數字（最多 4 張）→ 證據（與班平均差距圖）→ 明細（預設摺疊）
  function fold(title, small, open) {
    var d = el('details', { 'class': 'fold' }); if (open) d.setAttribute('open', '');
    var sm = el('summary', null, title); if (small) sm.appendChild(el('small', null, small));
    d.appendChild(sm); return d;
  }
  function hwList(sc) {
    var s = sm(), list = [];
    if (sc.isAll) s.terms.forEach(function (t) { s.byTerm[t].A.homework.forEach(function (h) { list.push({ h: h, term: t }); }); });
    else sc.A.homework.forEach(function (h) { list.push({ h: h, term: null }); });
    return list;
  }
  function hwMissing(sc, i) {
    var parts = [], total = 0;
    hwList(sc).forEach(function (x) {
      var m = x.h.missing[i]; total += m;
      if (m > 0) parts.push((x.term ? S.termLabel(x.term) : '') + (x.h.category || '作業') + ' ' + m + ' 次');
    });
    return { total: total, parts: parts };
  }
  // 明顯低於「自己平常水準」的測驗：和班平均的差距，比自己的平均差距低 10 分以上（至少 3 次測驗才判斷）
  function weakOf(series) {
    if (series.length < 3) return [];
    var mu = S.mean(series.map(function (x) { return x.diff; }));
    return series.filter(function (x) { return x.diff <= mu - 10; });
  }

  function renderMain() {
    var main = AX.$('main'); AX.clear(main);
    var s = sm(), sc = scope(), A = sc && sc.A;
    var N = s.data.students.length;
    if (!N || st.key == null) { main.appendChild(el('div', { 'class': 'card empty' }, '這個科目還沒有學生名單。')); return; }
    var i = s.index[st.key], stu = s.data.students[i];
    try { history.replaceState(null, '', AX.pageUrl('Personal.html', { subject: st.subject, key: st.key, term: st.term })); } catch (e) { /* 本機檔案可能不允許，忽略 */ }
    if (!sc) { main.appendChild(el('div', { 'class': 'card empty' }, '這個科目在所選學期還沒有登記任何成績。')); return; }

    var qs = A.quiz.filter(function (q) { return !st.cats || st.cats.indexOf(q.category) > -1; });
    var series = S.studentSeries(A, i, st.cats);
    var agg = S.studentAgg(A, st.cats), me = agg.rows[i];
    var tr = !sc.isAll ? S.termRow(s, st.term, i) : null;
    if (!qs.length && !A.homework.length) { main.appendChild(el('div', { 'class': 'card empty' }, '這個學期還沒有登記任何成績。')); return; }
    var prevRow = null;
    if (tr) { var ti = s.terms.indexOf(st.term); prevRow = ti > 0 ? S.termRow(s, s.terms[ti - 1], i) : null; }
    var hw = hwMissing(sc, i), weak = weakOf(series), tj = S.trendJudge(series);
    var absent = qs.filter(function (q) { return q.scores[i] == null; });

    var head = AX.card(AX.seatLabel(stu) + '・' + st.subject + '・' + (sc.isAll ? '全部學期' : S.termLabel(st.term)),
      '共 ' + qs.length + ' 次測驗，實際參加 ' + series.length + ' 次' + (absent.length ? '（缺考：' + absent.map(function (q) { return q.name; }).join('、') + '）' : '') + '。排名只與全班（' + N + ' 人）比較。');
    head.style.marginBottom = '12px';
    main.appendChild(head);

    // ---- 1. 結論
    var cc = conclusion({ tr: tr, me: me, agg: agg, series: series, tj: tj, weak: weak, hw: hw, absent: absent, prevRow: prevRow, passPct: A.passPct });
    var box = el('div', { 'class': 'concl' + (cc.flags ? ' warn' : '') });
    box.appendChild(el('span', { 'class': 'tag' }, cc.flags ? '需要留意' : '整體狀況'));
    box.appendChild(document.createTextNode(cc.text));
    main.appendChild(box);

    // ---- 2. 重點數字（3～4 張）：成績（含與班平均差距）、名次、近期趨勢、作業缺交
    var tiles = el('div', { 'class': 'tiles' });
    if (tr) {
      tiles.appendChild(AX.tile('學期成績', fmt(tr.score), '分', '全班平均 ' + fmt(tr.classMean) + '（' + sg(tr.diff) + '）' + (prevRow ? '・較上學期相對班平均 ' + sg(tr.diff - prevRow.diff) : '') + (tr.partial ? '・缺部分成分' : ''), AX.cls(tr.diff)));
      tiles.appendChild(AX.tile('學期名次', String(tr.rank), '/ ' + tr.n + ' 人', '前 ' + S.topPercent(tr.rank, tr.n) + '%・' + tr.tier));
    } else if (qs.length) {
      tiles.appendChild(AX.tile('累計平均得分', me.avg == null ? '—' : fmt(me.avg), me.avg == null ? '' : '分',
        me.avg == null ? '尚無成績' : '全班平均 ' + fmt(agg.stats.mean) + '（' + sg(me.avg - agg.stats.mean) + '）', me.avg == null ? '' : AX.cls(me.avg - agg.stats.mean)));
      tiles.appendChild(me.eligible ? AX.tile('累計名次', String(me.rank), '/ ' + agg.eligibleN + ' 人', '前 ' + S.topPercent(me.rank, agg.eligibleN) + '%・' + S.tierName(agg.tiers, me.avg))
        : AX.tile('累計名次', '—', '', '缺考過多，不列入排名'));
    }
    tiles.appendChild(tj ? AX.tile('近期趨勢', tj.label, '', '最近 ' + tj.recentN + ' 次相對班平均 ' + sg(tj.delta) + ' 分', tj.label === '進步' ? 'up' : (tj.label === '退步' ? 'down' : 'flat'))
      : AX.tile('近期趨勢', '資料不足', '', '至少需要 2 次測驗'));
    if (hwList(sc).length) tiles.appendChild(AX.tile('作業缺交', String(hw.total), '次', hw.total ? hw.parts.join('、') : '全部都有繳交', hw.total ? 'down' : 'up'));
    main.appendChild(tiles);

    // ---- 3. 證據：與班平均的差距
    if (qs.length) renderGap(main, qs, series, i, sc, weak);
    renderTerms(main, s, i);
    // ---- 4. 明細（預設摺疊）
    if (qs.length) renderTable(main, qs, i, sc.isAll);
    if (qs.length) renderPosition(main, agg, i, sc);
    renderHomework(main, sc, i, stu, hw);
  }

  // 一句結論：位置、近期走向、最需要補強的地方、缺交
  function conclusion(c) {
    var a = [], flags = 0, rank = null, n = null, score = null, dm = null, i;
    if (c.tr) { rank = c.tr.rank; n = c.tr.n; score = c.tr.score; dm = c.tr.diff; }
    else if (c.me.eligible) { rank = c.me.rank; n = c.agg.eligibleN; score = c.me.avg; dm = c.me.avg - c.agg.stats.mean; }
    var stable = c.series.length >= 3 && S.sd(c.series.map(function (x) { return x.diff; })) < 6 && !c.weak.length && (!c.tj || c.tj.label === '持平');
    if (score != null && score < c.passPct) { a.push((c.tr ? '學期成績' : '累計平均') + ' ' + fmt(score) + ' 分，低於及格線（' + c.passPct + '）'); flags++; }
    if (rank != null && n >= 4) {
      var p = rank / n, lv = p <= 0.25 ? '前段' : (p <= 0.5 ? '中前段' : (p <= 0.75 ? '中後段' : '後段'));
      var t = (stable ? '表現穩定，落在' : '整體落在') + '全班' + lv + '（第 ' + rank + ' 名／' + n + ' 人）';
      if (Math.abs(dm) >= 0.05) t += '，' + (dm > 0 ? '高於' : '低於') + '班平均 ' + fmt(Math.abs(dm)) + ' 分';
      if (lv === '後段') { t += '，建議多關心'; flags++; }
      a.push(t);
    } else if (rank != null) a.push('第 ' + rank + ' 名／' + n + ' 人');
    else if (!c.series.length) a.push('這個範圍內還沒有測驗成績');
    if (c.tj) {
      if (c.tj.label === '退步') { a.push('近期退步（最近 ' + c.tj.recentN + ' 次相對班平均少了 ' + fmt(-c.tj.delta) + ' 分）'); flags++; }
      else if (c.tj.label === '進步') a.push('近期進步中（最近 ' + c.tj.recentN + ' 次相對班平均多了 ' + fmt(c.tj.delta) + ' 分）');
    }
    if (c.weak.length === 1) {
      var w = c.weak[0];
      a.push('「' + w.q.name + '」是唯一明顯低於自己水準的一次（' + (w.diff >= 0 ? '只高於班平均 ' : '低於班平均 ') + fmt(Math.abs(w.diff)) + ' 分），建議複習該單元');
      if (w.diff < 0) flags++;
    } else if (c.weak.length > 1) {
      var low = c.weak.slice().sort(function (x, y) { return x.diff - y.diff; });
      a.push(c.weak.length + ' 次明顯低於自己水準，最弱是「' + low[0].q.name + '」（' + (low[0].diff >= 0 ? '只高於班平均 ' : '低於班平均 ') + fmt(Math.abs(low[0].diff)) + ' 分），建議複習這些單元');
      flags++;
    }
    var fails = c.series.filter(function (x) { return x.pct < c.passPct && c.weak.indexOf(x) === -1; });
    if (fails.length) { a.push('低於及格線的測驗：' + fails.map(function (x) { return x.q.name; }).join('、')); flags++; }
    if (c.hw.total) { a.push('作業缺交 ' + c.hw.total + ' 次（' + c.hw.parts.join('、') + '），記得提醒補交'); flags++; }
    if (c.absent.length) { a.push('缺考 ' + c.absent.length + ' 次'); flags++; }
    if (!flags && c.series.length >= 2) a.push('目前沒有需要特別處理的地方');
    return { text: a.join('；') + '。' + (c.series.length > 0 && c.series.length < 4 ? '（測驗次數還少，僅供參考）' : ''), flags: flags };
  }

  // ---------- 與班平均的差距（取代原本的「得分與班級平均」「名次變化」兩張圖） ----------
  function renderGap(main, qs, series, i, sc, weak) {
    var c = AX.card('每次測驗與班平均的差距', '0 線＝當次班平均，點在 0 線上方就是贏過班平均；用差距比較，不受考卷難易影響。名次、得分放在滑過時的提示裡。缺考的測驗線會中斷。' + (weak.length ? '紅點＝明顯低於自己水準的測驗。' : ''));
    var b1 = el('div'); c.appendChild(b1); main.appendChild(c);
    var vals = qs.map(function (q) { return q.pcts[i] == null ? null : q.pcts[i] - q.pctStats.mean; });
    var mx = Math.max.apply(null, [5].concat(vals.filter(function (v) { return v != null; }).map(Math.abs)));
    var step = mx <= 10 ? 5 : (mx <= 30 ? 10 : 20), m = Math.ceil(mx / step) * step, ticks = [], t, groups = null;
    for (t = -m; t <= m; t += step) ticks.push(t);
    if (sc.isAll) {
      groups = [];
      qs.forEach(function (q, k) { var g = groups[groups.length - 1]; if (g && g.term === q.term) g.to = k; else groups.push({ term: q.term, label: S.termLabel(q.term), from: k, to: k }); });
    }
    AX.lineChart(b1, {
      labels: qs.map(function (q) { return q.name; }), yMin: -m, yMax: m, ticks: ticks, yFmt: function (v) { return (v > 0 ? '+' : '') + v; }, groups: groups,
      series: [{ name: '與班平均的差距', color: 'var(--me)', values: vals }], refLine: { value: 0, label: '班平均' },
      ptColor: function (k) { return weak.some(function (w) { return w.q === qs[k]; }) ? 'var(--bad)' : null; },
      ariaLabel: '個人與班平均的差距折線圖',
      tipRows: function (k) {
        var q = qs[k], rows = [];
        if (q.scores[i] == null) rows.push({ name: '本人：缺考', value: '—' });
        else {
          rows.push({ color: 'var(--me)', name: '與班平均差', value: sg(vals[k]) + ' 分' });
          rows.push({ name: '得分' + (q.max !== 100 ? '（滿分 ' + fmt(q.max) + '）' : ''), value: fmt(q.scores[i]) });
          rows.push({ name: '名次', value: '第 ' + q.ranks[i] + ' 名 / ' + q.n + ' 人' });
        }
        rows.push({ color: 'var(--cls)', name: '班平均', value: fmt(q.stats.mean) });
        return { title: (q.term ? q.term + ' ' : '') + q.name + '（' + (q.category || '未分類') + '）', rows: rows };
      }
    });
  }

  // 全班位置分布圖：預設摺疊，打開才畫
  function renderPosition(main, agg, i, sc) {
    var A = sc.A, d = fold('我在全班的位置（分布圖）', sc.T ? '學期成績分布' : '累計平均得分分布', false), drawn = false;
    d.addEventListener('toggle', function () {
      if (!d.open || drawn) return; drawn = true;
      var b = el('div'); d.appendChild(b);
      var vals = sc.T ? sc.T.scores : agg.rows.map(function (rw) { return rw.eligible ? rw.avg : null; });
      AX.barChart(b, {
        bins: AX.pctBins(A.students, vals, vals[i] != null ? i : null), color: 'var(--cls)', hiColor: 'var(--me)', name: '全班', hiName: '本人所在組距',
        markBefore: A.passPct / 10, markLabel: '及格 ' + A.passPct, xTitle: sc.T ? '學期成績' : '累計平均得分', height: 230, ariaLabel: '全班成績分布，標示本人位置'
      });
    });
    main.appendChild(d);
  }

  // ---------- 各學期成績變化（只有一個學期時不顯示） ----------
  function renderTerms(main, s, i) {
    var rows = [];
    s.terms.forEach(function (t) { var r = S.termRow(s, t, i); if (r) rows.push(r); });
    if (rows.length < 2) return;
    var c = AX.card('各學期成績變化', '「相對班平均」＝本人減全班平均，數字越大代表在班上越突出；跨學期要看進退步，看這一欄最準。');
    var box = el('div'); c.appendChild(box);
    var mine = rows.map(function (r) { return r.score; }), means = rows.map(function (r) { return r.classMean; });
    var lo = rows.map(function (r) { return s.byTerm[r.term].T.tiers.back; }), hi = rows.map(function (r) { return s.byTerm[r.term].T.tiers.front; });
    var rg = AX.niceRange(mine.concat(means, lo, hi));
    AX.lineChart(box, {
      labels: rows.map(function (r) { return S.termLabel(r.term); }), yMin: rg.lo, yMax: rg.hi, ticks: rg.ticks, height: 210,
      series: [{ name: '本人', color: 'var(--me)', values: mine }, { name: '班級平均', color: 'var(--cls)', values: means }],
      band: { name: '後標～前標', color: 'var(--cls)', lo: lo, hi: hi }, ariaLabel: '各學期成績',
      tipRows: function (k) {
        var r = rows[k];
        return { title: S.termLabel(r.term), rows: [{ color: 'var(--me)', name: '本人（第 ' + r.rank + ' 名 / ' + r.n + ' 人）', value: fmt(r.score) }, { color: 'var(--cls)', name: '班級平均', value: fmt(r.classMean) }] };
      }
    });
    var wrap = el('div', { 'class': 'tbl-wrap' }); wrap.style.marginTop = '10px';
    var tb = el('table', { 'class': 'stats' }), thead = el('thead'), hr = el('tr');
    var hasOther = rows.some(function (r) { return r.comp.other != null; });
    ['學期', '學期成績', '班平均', '相對班平均', '名次', '所在位置', '較上學期', '第一次定期考查', '第二次定期考查', '紙筆測驗', '作業'].concat(hasOther ? ['課堂表現'] : []).concat(['期中考', '期末考']).forEach(function (h) { hr.appendChild(el('th', { 'class': h === '學期' ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (r, k) {
      var tr = el('tr'), pv = k > 0 ? rows[k - 1] : null;
      var cm = function (v) { return v == null ? '—' : fmt(v); };
      [S.termLabel(r.term), fmt(r.score) + (r.partial ? '*' : ''), fmt(r.classMean), sg(r.diff), r.rank + ' / ' + r.n, r.tier, pv ? sg(r.score - pv.score) + '（相對 ' + sg(r.diff - pv.diff) + '）' : '—',
        cm(r.comp.total1), cm(r.comp.total2), cm(r.comp.quiz), cm(r.comp.homework)].concat(hasOther ? [cm(r.comp.other)] : []).concat([cm(r.comp.midterm), cm(r.comp.final)]).forEach(function (v, j) {
        var td = el('td', { 'class': j === 0 ? 'l' : '' }, v);
        if (j === 3) td.className = AX.cls(r.diff);
        if (j === 6 && pv) td.className = AX.cls(r.diff - pv.diff, 2);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap);
    if (rows.some(function (r) { return r.partial; })) c.appendChild(el('p', { 'class': 'muted small' }, '* 該學期缺少部分成分（例如缺考，或第二次定期考查還沒考完），學期成績已依其餘成分重新分配比例。'));
    main.appendChild(c);
  }

  // ---------- 明細表（預設摺疊；只標色異常列：低於班平均，或名次比前次退步 3 名以上） ----------
  function renderTable(main, qs, i, isAll) {
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' });
    var heads = ['項目'].concat(isAll ? ['學期'] : []).concat(['類別', '得分', '班平均', '與班平均差', '名次', '所在位置', '較前次']);
    var thead = el('thead'), hr = el('tr');
    heads.forEach(function (h) { hr.appendChild(el('th', { 'class': (h === '類別' || h === '學期') ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody'), prev = null, warnN = 0;
    function left(j) { return j === 1 || (isAll && j === 2); }
    qs.forEach(function (q) {
      var tr = el('tr'), sc = q.scores[i];
      var pre = [q.name].concat(isAll ? [q.term || '—'] : []).concat([q.category || '—']);
      if (sc == null) {
        pre.concat(['缺考', fmt(q.stats.mean), '—', '—', '—', '—']).forEach(function (v, j) { tr.appendChild(el('td', { 'class': left(j) ? 'l' : '' }, v)); });
        tr.className = 'warnRow'; warnN++;
        body.appendChild(tr); return;
      }
      var diff = sc - q.stats.mean, dropped = prev && (q.ranks[i] - prev.rank) >= 3;
      if (diff < 0 || dropped) { tr.className = 'warnRow'; warnN++; }
      var cells = pre.concat([fmt(sc), fmt(q.stats.mean), null, q.ranks[i] + ' / ' + q.n, S.tierName(q.tiers, sc), null]);
      var diffAt = pre.length + 2, prevAt = pre.length + 5;
      cells.forEach(function (v, j) {
        var td = el('td', { 'class': left(j) ? 'l' : '' }, v == null ? '' : v);
        if (j === diffAt) { td.textContent = sg(diff) + ' 分'; td.className = AX.cls(diff); }
        if (j === prevAt) {
          if (prev) {
            // 兩次滿分相同就直接比得分；滿分不同才換算成百分制比較
            var dp = prev.max === q.max ? sc - prev.score : q.pcts[i] - prev.pct, dr = prev.rank - q.ranks[i];
            td.appendChild(el('span', { 'class': AX.cls(dp) }, sg(dp) + ' 分'));
            td.appendChild(document.createTextNode('・'));
            td.appendChild(el('span', { 'class': AX.cls(dr, 0) }, AX.rankMove(prev.rank, q.ranks[i])));
          } else td.textContent = '—';
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
      prev = { score: sc, max: q.max, pct: q.pcts[i], rank: q.ranks[i] };
    });
    tb.appendChild(body); wrap.appendChild(tb);
    var d = fold('每次測驗明細', qs.length + ' 次' + (warnN ? '，其中 ' + warnN + ' 次標色（需留意）' : '，沒有需要留意的'), false);
    d.appendChild(el('p', { 'class': 'sub' }, '淡紅色的列＝低於班平均、缺考，或名次比前次退步 3 名以上。「較前次」是和上一次有參加的測驗相比。'));
    d.appendChild(wrap); main.appendChild(d);
  }

  // ---------- 作業（各學期各一段；預設摺疊，有缺交時展開） ----------
  // 不比「總和」（會受項目數與缺交影響），改比得分率；沒填滿分時比每項平均
  function renderHomework(main, sc, i, stu, hw) {
    var N = sm().data.students.length, list = hwList(sc);
    if (!list.length) return;
    var d = fold('作業繳交情況', hw.total ? '缺交 ' + hw.total + ' 次' : '全部都有繳交', hw.total > 0);
    list.forEach(function (x) {
      var h = x.h;
      var val = function (k) { return h.pcts ? h.pcts[k] : h.sums[k] / h.nItems; };
      var all = h.sums.map(function (v, k) { return val(k); }), mu = S.mean(all), v = val(i), df = v - mu, unit = h.pcts ? '%' : ' 分';
      var miss = h.items.filter(function (it) { return stu.scores[it.k] == null; }).map(function (it) { return it.name; });
      var t = el('div', { 'class': 'h3' }, (x.term ? S.termLabel(x.term) + ' ' : '') + (h.category || '作業')); t.style.marginTop = '6px';
      d.appendChild(t);
      var ul = el('ul', { 'class': 'insights' });
      ul.appendChild(el('li', null, (h.pcts ? '得分率 ' : '每項平均 ') + fmt(v) + unit + '，' +
        (Math.abs(df) < 0.05 ? '與全班平均相同' : (df > 0 ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(df)) + (h.pcts ? ' 個百分點' : ' 分')) + '（全班 ' + fmt(mu) + unit + '，名次第 ' + h.ranks[i] + ' / ' + N + '）。缺交以 0 分計。'));
      ul.appendChild(el('li', null, miss.length ? '缺交 ' + miss.length + ' / ' + h.nItems + ' 項：' + miss.join('、') + '。' : '全部 ' + h.nItems + ' 項都有繳交。'));
      d.appendChild(ul);
    });
    main.appendChild(d);
  }
})();
</script>
