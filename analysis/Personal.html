        <button id="nextBtn" title="下一位">▶</button>

<script src="analysis-stats.js?v=20261120"></script>
<script src="analysis-demo.js?v=20261120"></script>
<script src="analysis-art.js?v=20261120"></script>
<script src="analysis-common.js?v=20261120"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt, sg = S.signed, ALL = '*';
  var st = { raw: null, model: null, key: null, term: null, subject: null, sums: [], lazy: [], stage: null, jr: null };
  var TYPE_LABEL = { quiz: '測驗', midterm: '段考', final: '段考', other: '課堂', homework: '作業' };

  AX.shell();
  AX.onResize(function () {
    st.lazy.forEach(function (d) { if (d.open && d._built) rebuild(d); });
  });

  AX.load().then(function (r) {
    st.raw = r.raw; st.model = r.model;
    try { st.stage = S.stageMatrix(r.model, { partial: true }); } catch (e) { st.stage = null; }
    var q = AX.qs(), M = st.model;
    if (!M.subjects.length || !M.roster.length) { AX.$('main').appendChild(el('div', { 'class': 'card empty' }, '試算表還沒有任何科目或學生，請先到「登記分數」面板建立。')); return; }
    st.key = M.roster.some(function (x) { return x.key === q.key; }) ? q.key : M.roster[0].key;
    st.term = (q.term !== undefined && (q.term === ALL || M.terms.indexOf(q.term) > -1)) ? q.term : S.defaultTerm(M, null);
    st.subject = M.subjects.some(function (x) { return x.name === q.subject; }) ? q.subject : null;
    renderBar(); renderMain();
  }).catch(AX.showError);

  // ---------- 列 ----------
  function renderBar() {
    var M = st.model, sel = AX.$('stuSel'); AX.clear(sel);
    M.roster.forEach(function (r) {
      var o = el('option', { value: r.key }, AX.seatLabel(r));
      if (r.key === st.key) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { st.key = sel.value; renderMain(); };
    AX.$('prevBtn').onclick = function () { step(-1); };
    AX.$('nextBtn').onclick = function () { step(1); };
    var items = M.terms.map(function (t) { return { label: S.termLabel(t), value: t }; });
    if (M.terms.length > 1) items.push({ label: '全部學期', value: ALL });
    AX.btnGroup(AX.$('termBtns'), items, st.term, function (v) { st.term = v; renderBar(); renderMain(); });
  }
  function step(d) {
    var ks = st.model.roster.map(function (r) { return r.key; }), n = ks.length; if (!n) return;
    st.key = ks[(ks.indexOf(st.key) + d + n) % n];
    AX.$('stuSel').value = st.key;
    renderMain();
  }

  // ---------- 小工具 ----------
  function fold(title, small, open) {
    var d = el('details', { 'class': 'fold' }); if (open) d.setAttribute('open', '');
    var sm = el('summary', null, title); if (small) sm.appendChild(el('small', null, small));
    d.appendChild(sm); return d;
  }
  // 摺疊區：第一次打開才畫（圖表要量寬度，關著的時候量不到）；視窗大小改變時，已打開的會重畫
  function lazyFold(host, title, small, build) {
    var d = fold(title, small, false);
    d._build = build; d._built = false;
    d.addEventListener('toggle', function () { if (d.open && !d._built) { d._built = true; build(d); } });
    st.lazy.push(d); host.appendChild(d); return d;
  }
  function rebuild(d) {
    Array.prototype.slice.call(d.children).forEach(function (k) { if (k.tagName !== 'SUMMARY') d.removeChild(k); });
    d._build(d);
  }
  function levelOf(rank, n) {
    var p = rank / n;
    return p <= 0.25 ? '前段' : (p <= 0.5 ? '中前段' : (p <= 0.75 ? '中後段' : '後段'));
  }
  // PR 值（百分等級）：約有幾成同學排在自己後面。第 1 名 ≈ 接近 100，最後一名 ≈ 接近 0，50 ＝ 正中間
  function prOf(rank, n) { return Math.max(1, Math.min(99, Math.round((n - rank + 0.5) / n * 100))); }
  function prCls(pr) { return pr >= 75 ? 'up' : (pr <= 25 ? 'down' : ''); }
  // 各科近期趨勢：每個項目（聽考、國卷、國習…）只跟自己比，再把各項目的進退步平均
  function trendOf(cats) {
    var parts = cats.filter(function (c) { return c.trend; });
    if (!parts.length) return null;
    var delta = S.mean(parts.map(function (c) { return c.trend.delta; }));
    var label = delta >= 5 ? '進步' : (delta <= -5 ? '退步' : '持平');
    var drivers = parts.filter(function (c) { return c.trend.label !== '持平'; });
    drivers.sort(function (a, b) { return Math.abs(b.trend.delta) - Math.abs(a.trend.delta); });
    var sorted = parts.slice().sort(function (a, b) { return Math.abs(b.trend.delta) - Math.abs(a.trend.delta); });
    return {
      delta: delta, label: label, parts: sorted,
      note: drivers.map(function (c) { return c.name + c.trend.label; }).join('、'),
      detail: sorted.map(function (c) { return c.name + ' ' + (c.trend.label === '持平' ? '持平' : c.trend.label) + ' ' + sg(c.trend.delta); }).join('、')
    };
  }
  function hwList(sub, sc) {
    var list = [];
    if (sc.isAll) sub.terms.forEach(function (t) { sub.byTerm[t].A.homework.forEach(function (h) { list.push({ h: h, term: t }); }); });
    else sc.A.homework.forEach(function (h) { list.push({ h: h, term: null }); });
    return list;
  }
  function hwMissing(sub, sc, i) {
    var parts = [], total = 0;
    hwList(sub, sc).forEach(function (x) {
      var m = x.h.missing[i]; total += m;
      if (m > 0) parts.push((x.term ? S.termLabel(x.term) : '') + (x.h.category || '作業') + ' ' + m + ' 次');
    });
    return { total: total, parts: parts };
  }
  // 明顯低於「自己平常水準」的測驗：和班平均的差距，比自己的平均差距低 10 分以上（至少 3 次測驗才判斷）
  function weakOf(series) {
    if (series.length < 3) return [];
    var mu = S.mean(series.map(function (x) { return x.diff; }));
    return series.filter(function (x) { return x.diff <= mu - 10; });
  }

  // ---------- 長期趨勢：現在這一次定期考查，和「前兩次」定期考查（期中、期末各算一次）比 ----------
  // 例如現在是五上期中，就拿四下期末、四下期中來比。用「相對班平均的差距」比較，才不受每次考卷難易影響。
  // 定期考查總成績＝平時成績＋段考（現在這次還沒考完段考時，只含已登記的成績，標＊）。包含匯入的歷史成績。
  function journeyNow() {
    if (!st.stage) return null;
    var r = -1;
    st.model.roster.forEach(function (x, k) { if (x.key === st.key) r = k; });
    return r < 0 ? null : S.studentJourney(st.stage, r);
  }
  function longOf(name) {
    var J = st.jr; if (!J) return null;
    var rows = J.rows, curIdx = -1, lastIn = -1, k;
    // 「現在」＝所選學期裡最後一次「已經考完」的定期考查（例如期中考完、期末還沒考完，現在就是期中）；
    // 整個學期都還沒考完段考時，才用進行中的那一次（標＊）
    for (k = 0; k < rows.length; k++) {
      if (st.term !== ALL && rows[k].term !== st.term) continue;
      lastIn = k;
      if (rows[k].label.indexOf('＊') === -1) curIdx = k;
    }
    if (curIdx < 0) curIdx = lastIn;
    if (curIdx < 0) return null;
    var L = [];
    for (k = 0; k <= curIdx; k++) {
      var c = rows[k].subj[name];
      if (c && c.v != null) L.push({ label: rows[k].label, term: rows[k].term, v: c.v, rank: c.rank, n: c.n, mean: c.mean, diff: c.v - c.mean, partial: rows[k].label.indexOf('＊') > -1 });
    }
    if (L.length < 2) return null;
    var cur = L[L.length - 1];
    if (cur.label !== rows[curIdx].label) return null;
    var prev = L.slice(Math.max(0, L.length - 3), L.length - 1);
    var base = S.mean(prev.map(function (x) { return x.diff; })), delta = cur.diff - base;
    return { rows: prev.concat([cur]), cur: cur, prev: prev, base: base, delta: delta, label: delta >= 5 ? '進步' : (delta <= -5 ? '退步' : '持平') };
  }
  function prevNames(lg) { return lg.prev.map(function (x) { return x.label.replace('＊', ''); }).join('、'); }

  // ---------- 資料整理：每一科算出「成績、名次、趨勢、各項目表現、亮點與拖累」 ----------
  function summarize(sub) {
    var i = sub.index[st.key]; if (i === undefined) return null;
    var isAll = st.term === ALL, sc;
    if (isAll) sc = { A: sub.all, T: null, isAll: true };
    else { var bt = sub.byTerm[st.term]; if (!bt) return null; sc = { A: bt.A, T: bt.T, isAll: false }; }
    var A = sc.A;
    if (!A.quiz.length && !A.homework.length) return null;
    var series = S.studentSeries(A, i, null);
    var tr = !isAll ? S.termRow(sub, st.term, i) : null;
    var agg = S.studentAgg(A, null), me = agg.rows[i];
    var tj = S.trendJudge(series);
    var prevRow = null;
    if (tr) { var ti = sub.terms.indexOf(st.term); prevRow = ti > 0 ? S.termRow(sub, sub.terms[ti - 1], i) : null; }
    var s = {
      sub: sub, name: sub.name, i: i, sc: sc, A: A, N: sub.data.students.length, series: series, tr: tr, agg: agg, me: me, tj: tj,
      prevRow: prevRow, passPct: A.passPct, weak: weakOf(series), hw: hwMissing(sub, sc, i),
      absent: A.quiz.filter(function (q) { return q.scores[i] == null; })
    };
    if (tr) { s.score = tr.score; s.diff = tr.diff; s.rank = tr.rank; s.n = tr.n; s.tier = tr.tier; s.label = '學期成績'; s.partial = tr.partial; }
    else if (me.eligible) { s.score = me.avg; s.diff = me.avg - agg.stats.mean; s.rank = me.rank; s.n = agg.eligibleN; s.tier = S.tierName(agg.tiers, me.avg); s.label = '累計平均'; }
    else { s.score = me.avg; s.diff = null; s.rank = null; s.n = agg.eligibleN; s.tier = ''; s.label = '累計平均'; }
    s.long = longOf(sub.name);
    s.cats = categoryRows(s);
    s.tj = trendOf(s.cats);
    var f = factors(s.cats);
    s.good = f.good; s.bad = f.bad;
    judge(s);
    return s;
  }

  // 各項目（聽考、國習、期中考…）：只和「同一個項目」比，不同項目不互比
  function categoryRows(s) {
    var A = s.A, i = s.i, rows = [], order = [], by = {};
    A.quiz.forEach(function (q) {
      var c = q.category || '';
      if (!by[c]) { by[c] = { all: [], taken: [] }; order.push(c); }
      by[c].all.push(q);
    });
    s.series.forEach(function (x) { by[x.q.category || ''].taken.push(x); });
    order.forEach(function (c) {
      var g = by[c], kind = g.all[0].kind, tk = g.taken;
      var worst = tk.length ? tk.slice().sort(function (a, b) { return a.diff - b.diff; })[0] : null;
      var mine = tk.length ? S.mean(tk.map(function (x) { return x.pct; })) : null;
      var cls = tk.length ? S.mean(tk.map(function (x) { return x.classMean; })) : null;
      rows.push({
        type: 'quiz', kind: kind, name: c || '（未分類）', n: tk.length, total: g.all.length, mine: mine, cls: cls,
        diff: mine == null ? null : mine - cls, trend: S.trendJudge(tk), worst: worst,
        absent: g.all.filter(function (q) { return q.scores[i] == null; })
      });
    });
    A.homework.forEach(function (h) {
      var my = [], cl = [], dfs = [];
      h.items.forEach(function (it, j) {
        var col = h.cols[j], mx = it.max > 0 ? it.max : null;
        var val = function (v) { v = v == null ? 0 : v; return mx ? v / mx * 100 : v; };
        var m = val(col[i]), c = S.mean(col.map(val));
        my.push(m); cl.push(c); dfs.push({ diff: m - c });
      });
      var missNames = h.items.filter(function (it, j) { return h.cols[j][i] == null; }).map(function (it) { return it.name; });
      rows.push({
        type: 'hw', kind: 'homework', name: h.category || '作業', n: h.nItems, total: h.nItems, mine: S.mean(my), cls: S.mean(cl),
        diff: S.mean(my) - S.mean(cl), trend: S.trendJudge(dfs), missing: missNames.length, missNames: missNames, absent: []
      });
    });
    return rows;
  }

  // 亮點（拉高成績的項目）與拖累（拉低成績的原因）：差距在 ±3 分以上，或同項目近期明顯進退步，或缺交、缺考
  function factors(rows) {
    var good = [], bad = [];
    rows.forEach(function (r) {
      var key = r.name;
      if (r.mine == null) { bad.push({ key: key, w: -50, text: r.name + '全部缺考' }); return; }
      var isBad = false;
      if (r.diff <= -3) {
        isBad = true;
        var ex = [];
        if (r.type === 'hw' && r.missing) ex.push('缺交 ' + r.missing + ' 次');
        if (r.type === 'quiz' && r.n >= 2 && r.worst && r.worst.diff <= -8) ex.push('「' + r.worst.q.name + '」低於班平均 ' + fmt(-r.worst.diff) + ' 分');
        if (r.type === 'quiz' && r.absent.length) ex.push('缺考 ' + r.absent.length + ' 次');
        bad.push({ key: key, w: r.diff, text: r.name + ' ' + sg(r.diff) + (ex.length ? '（' + ex.join('；') + '）' : '') });
      } else if (r.diff >= 3) {
        good.push({ key: key, w: r.diff, text: r.name + ' ' + sg(r.diff) });
      } else if (r.trend && r.trend.label === '退步') {
        isBad = true; bad.push({ key: key, w: -2, text: r.name + ' 近期退步（' + sg(r.trend.delta) + '）' });
      } else if (r.trend && r.trend.label === '進步') {
        good.push({ key: key, w: 2, text: r.name + ' 近期進步（' + sg(r.trend.delta) + '）' });
      }
      if (!isBad) {
        if (r.type === 'hw' && r.missing) bad.push({ key: key, w: -r.missing, text: r.name + ' 缺交 ' + r.missing + ' 次' });
        else if (r.type === 'quiz' && r.absent.length) bad.push({ key: key, w: -r.absent.length, text: r.name + ' 缺考 ' + r.absent.length + ' 次' });
        else if (r.type === 'quiz' && r.n >= 3 && r.worst && r.worst.diff <= -12) bad.push({ key: key, w: r.worst.diff / 3, text: '「' + r.worst.q.name + '」明顯偏低（低於班平均 ' + fmt(-r.worst.diff) + ' 分）' });
      }
    });
    good.sort(function (a, b) { return b.w - a.w; });
    bad.sort(function (a, b) { return a.w - b.w; });
    return { good: good, bad: bad };
  }

  function judge(s) {
    var f = [];
    if (s.score != null && s.score < s.passPct) f.push('低於及格線');
    if (s.rank != null && s.n >= 4 && s.rank / s.n > 0.75) f.push('全班後段');
    if (s.tj && s.tj.label === '退步') f.push('近期退步');
    if (s.long && s.long.label === '退步') f.push('長期退步');
    if (s.hw.total) f.push('作業缺交');
    if (s.absent.length) f.push('缺考');
    if (s.bad.some(function (x) { return x.w <= -5; })) f.push('有項目明顯落後');
    s.flags = f;
  }

  // 一科一行的總結
  function shortLine(s) {
    var t;
    if (s.rank != null) {
      t = 'PR ' + prOf(s.rank, s.n) + '（第 ' + s.rank + ' 名／' + s.n + ' 人，' + levelOf(s.rank, s.n) + '）';
      if (s.diff != null && Math.abs(s.diff) >= 0.05) t += '，' + (s.diff > 0 ? '高於' : '低於') + '班平均 ' + fmt(Math.abs(s.diff)) + ' 分';
    } else t = s.score != null ? '缺考過多，未列入排名' : '尚無成績';
    if (s.tj && s.tj.label !== '持平') t += '，近期' + s.tj.label;
    else if (s.tj && s.tj.note) t += '，近期整體持平（但' + s.tj.note + '）';
    if (s.long && s.long.label !== '持平') t += '，長期' + s.long.label;
    if (s.good.length) t += '；亮點：' + s.good.slice(0, 2).map(function (x) { return x.text; }).join('、');
    if (s.bad.length) t += '；拖累：' + s.bad.slice(0, 2).map(function (x) { return x.text; }).join('、');
    else if (!s.good.length) t += '；各項目與班上差不多';
    return t;
  }

  // 整體狀況：綜合各科
  function overallText(sums) {
    var withRank = sums.filter(function (s) { return s.rank != null && s.n >= 4; }), a = [];
    if (withRank.length) {
      var avgP = S.mean(withRank.map(function (s) { return s.rank / s.n; }));
      var lv = avgP <= 0.25 ? '前段' : (avgP <= 0.5 ? '中前段' : (avgP <= 0.75 ? '中後段' : '後段'));
      a.push(sums.length + ' 科整體落在全班' + lv + '（各科平均 PR ' + Math.round(S.mean(withRank.map(function (s) { return prOf(s.rank, s.n); }))) + '）');
      var best = withRank.filter(function (s) { return s.rank / s.n <= 0.25; }).map(function (s) { return s.name; });
      if (best.length && best.length < withRank.length) a.push('表現最好：' + best.join('、'));
    } else a.push('這個範圍的成績還不夠判斷整體位置');
    var ups = sums.filter(function (s) { return s.tj && s.tj.label === '進步'; }).map(function (s) { return s.name; });
    var downs = sums.filter(function (s) { return s.tj && s.tj.label === '退步'; }).map(function (s) { return s.name; });
    if (ups.length) a.push('近期進步：' + ups.join('、'));
    if (downs.length) a.push('近期退步：' + downs.join('、'));
    var lups = sums.filter(function (s) { return s.long && s.long.label === '進步'; }).map(function (s) { return s.name; });
    var ldowns = sums.filter(function (s) { return s.long && s.long.label === '退步'; }).map(function (s) { return s.name; });
    if (lups.length) a.push('長期進步：' + lups.join('、'));
    if (ldowns.length) a.push('長期退步：' + ldowns.join('、'));
    var warn = sums.filter(function (s) { return s.flags.length; });
    if (warn.length) a.push('需要留意：' + warn.map(function (s) { return s.name + '（' + s.flags.slice(0, 2).join('、') + '）'; }).join('、'));
    else a.push('目前沒有需要特別處理的地方');
    return { text: a.join('；') + '。', flagged: warn.length };
  }

  // ---------- 主畫面 ----------
  function metricTile(title, big, unit, rows) {
    var t = AX.tile(title, big, unit, '', '');
    var ul = el('ul', { 'class': 'mrows' });
    rows.forEach(function (r) {
      var li = el('li', { title: '點一下，下方打開' + r.name + '的詳細說明' });
      li.appendChild(el('span', { 'class': 'nm' }, r.name));
      li.appendChild(el('span', { 'class': 'vl ' + (r.cls || '') }, r.text));
      li.onclick = function () { openDetail(r.name); };
      ul.appendChild(li);
    });
    t.appendChild(ul);
    return t;
  }

  // ---------- 詳細卡片 ----------

      AX.seatLabel(stu) + '。排名只與全班（' + s.N + ' 人）比較。' + (s.partial ? '學期成績缺少部分成分（例如缺考或期末還沒考），已依其餘成分重新分配比例。' : ''));

      var lhead = el('thead'); lhead.appendChild(lh); lt.appendChild(lhead);

        [x.label.replace('＊', '') + (k === lg.rows.length - 1 ? '（現在）' : ''), fmt(x.v) + (x.partial ? '＊' : ''), fmt(x.mean), sg(x.diff) + ' 分', 'PR ' + prOf(x.rank, x.n) + '（' + x.rank + ' / ' + x.n + '）'].forEach(function (v, j) {
          var td = el('td', { 'class': j === 0 ? 'l' : '' }, v);

        });

      var lp = el('p', { 'class': 'sub' });
      lp.style.marginTop = '8px';
      lp.appendChild(document.createTextNode('現在相對班平均 ' + sg(lg.cur.diff) + ' 分，前兩次平均 ' + sg(lg.base) + ' 分，差了 ' + sg(lg.delta) + ' 分 → '));
      lp.appendChild(el('b', { 'class': trCls(lg) }, '長期' + lg.label));
      lp.appendChild(document.createTextNode('（差 5 分以上才算進步或退步）。用「與班平均差」比較，不受考卷難易影響。' + (lg.cur.partial ? '＊現在這一次定期考查還沒考完段考，分數只含已登記的成績，之後會再變動。' : '')));
      card.appendChild(lp);
    }

    // 各項目表現：只和同一個項目比
    card.appendChild(el('div', { 'class': 'h3' }, '各項目表現'));
    card.appendChild(el('p', { 'class': 'sub' }, '只和「同一個項目」比：聽考跟聽考比、國習跟國習比，不會拿不同項目互相比較。「進退步」＝同項目最近幾次相對班平均的差距，減去之前幾次的差距（差 5 分以上才算進步或退步）。得分已換算成百分制。'));
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' }), thead = el('thead'), hr = el('tr');
    ['項目', '類型', '次數', '我的平均', '班平均', '與班平均差', '進退步（同項目比較）', '備註'].forEach(function (h, j) { hr.appendChild(el('th', { 'class': (j === 1 || j === 7) ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    s.cats.forEach(function (r) {
      var tr = el('tr', { 'data-cat': r.name });
      var cls = [];
      if (r.diff == null || r.diff <= -3 || r.missing || (r.absent && r.absent.length)) cls.push('warnRow');
      if (focus && focus === r.name) cls.push('pick');
      tr.className = cls.join(' ');
      var notes = [];
      if (r.type === 'hw' && r.missing) notes.push('缺交：' + r.missNames.join('、'));

      var trend = r.trend ? r.trend.label + '　' + sg(r.trend.delta) + ' 分' : '—';
      var cells = [r.name, TYPE_LABEL[r.kind] || '測驗', r.type === 'hw' ? r.n + ' 項' : r.n + ' / ' + r.total + ' 次',

  // 一句結論：位置、近期走向、最需要補強的地方、缺交（單科詳細用）
  function conclusion(c) {
    var a = [], flags = 0, rank = null, n = null, score = null, dm = null;
    if (c.tr) { rank = c.tr.rank; n = c.tr.n; score = c.tr.score; dm = c.tr.diff; }
    else if (c.me.eligible) { rank = c.me.rank; n = c.agg.eligibleN; score = c.me.avg; dm = c.me.avg - c.agg.stats.mean; }
    var stable = c.series.length >= 3 && S.sd(c.series.map(function (x) { return x.diff; })) < 6 && !c.weak.length && (!c.tj || c.tj.label === '持平');
    if (score != null && score < c.passPct) { a.push((c.tr ? '學期成績' : '累計平均') + ' ' + fmt(score) + ' 分，低於及格線（' + c.passPct + '）'); flags++; }
    if (rank != null && n >= 4) {
      var lv = levelOf(rank, n);
      var t = (stable ? '表現穩定，落在' : '整體落在') + '全班' + lv + '（PR ' + prOf(rank, n) + '，第 ' + rank + ' 名／' + n + ' 人）';
      if (Math.abs(dm) >= 0.05) t += '，' + (dm > 0 ? '高於' : '低於') + '班平均 ' + fmt(Math.abs(dm)) + ' 分';
      if (lv === '後段') { t += '，建議多關心'; flags++; }
      a.push(t);
    } else if (rank != null) a.push('第 ' + rank + ' 名／' + n + ' 人');
    else if (!c.series.length) a.push('這個範圍內還沒有測驗成績');
    if (c.tj) {
      if (c.tj.label === '退步') { a.push('近期退步（各項目平均相對班平均少了 ' + fmt(-c.tj.delta) + ' 分：' + c.tj.detail + '）'); flags++; }
      else if (c.tj.label === '進步') a.push('近期進步中（各項目平均相對班平均多了 ' + fmt(c.tj.delta) + ' 分：' + c.tj.detail + '）');
      else if (c.tj.note) a.push('近期整體持平，但' + c.tj.note + '（' + c.tj.detail + '）');
    }
    if (c.weak.length === 1) {
      var w = c.weak[0];
      a.push('「' + w.q.name + '」是唯一明顯低於自己水準的一次（' + (w.diff >= 0 ? '只高於班平均 ' : '低於班平均 ') + fmt(Math.abs(w.diff)) + ' 分），建議複習該單元');
      if (w.diff < 0) flags++;
    } else if (c.weak.length > 1) {
      var low = c.weak.slice().sort(function (x, y) { return x.diff - y.diff; });
      a.push(c.weak.length + ' 次明顯低於自己水準，最弱是「' + low[0].q.name + '」（' + (low[0].diff >= 0 ? '只高於班平均 ' : '低於班平均 ') + fmt(Math.abs(low[0].diff)) + ' 分），建議複習這些單元');
      flags++;
    }
    var fails = c.series.filter(function (x) { return x.pct < c.passPct && c.weak.indexOf(x) === -1; });
    if (fails.length) { a.push('低於及格線的測驗：' + fails.map(function (x) { return x.q.name; }).join('、')); flags++; }
    if (c.hw.total) { a.push('作業缺交 ' + c.hw.total + ' 次（' + c.hw.parts.join('、') + '），記得提醒補交'); flags++; }
    if (c.absent.length) { a.push('缺考 ' + c.absent.length + ' 次'); flags++; }
    if (!flags && c.series.length >= 2) a.push('目前沒有需要特別處理的地方');
    return { text: a.join('；') + '。' + (c.series.length > 0 && c.series.length < 4 ? '（測驗次數還少，僅供參考）' : ''), flags: flags };
  }

  // ---------- 摺疊區內容 ----------
  function gapChart(d, s) {
    var qs = s.A.quiz, i = s.i, sc = s.sc, weak = s.weak;
    d.appendChild(el('p', { 'class': 'sub' }, '0 線＝當次班平均，點在 0 線上方就是贏過班平均；用差距比較，不受考卷難易影響。點旁的數字是該次得分，名次放在滑過時的提示裡。缺考的測驗線會中斷。' + (weak.length ? '紅點＝明顯低於自己水準的測驗。' : '')));
    var b1 = el('div'); d.appendChild(b1);
    var vals = qs.map(function (q) { return q.pcts[i] == null ? null : q.pcts[i] - q.pctStats.mean; });
    var mx = Math.max.apply(null, [5].concat(vals.filter(function (v) { return v != null; }).map(Math.abs)));
    var step2 = mx <= 10 ? 5 : (mx <= 30 ? 10 : 20), m = Math.ceil(mx / step2) * step2, ticks = [], t, groups = null;
    for (t = -m; t <= m; t += step2) ticks.push(t);
    if (sc.isAll) {
      groups = [];
      qs.forEach(function (q, k) { var g = groups[groups.length - 1]; if (g && g.term === q.term) g.to = k; else groups.push({ term: q.term, label: S.termLabel(q.term), from: k, to: k }); });
    }
    AX.lineChart(b1, {
      labels: qs.map(function (q) { return q.name; }), yMin: -m, yMax: m, ticks: ticks, yFmt: function (v) { return (v > 0 ? '+' : '') + v; }, groups: groups,
      series: [{ name: '與班平均的差距', color: 'var(--me)', values: vals }], refLine: { value: 0, label: '班平均' },
      ptColor: function (k) { return weak.some(function (w) { return w.q === qs[k]; }) ? 'var(--bad)' : null; },
      ptLabel: function (k) { var q = qs[k]; return q.scores[i] == null ? '' : fmt(q.scores[i]); },
      ariaLabel: '個人與班平均的差距折線圖',
      tipRows: function (k) {
        var q = qs[k], rows = [];
        if (q.scores[i] == null) rows.push({ name: '本人：缺考', value: '—' });
        else {
          rows.push({ color: 'var(--me)', name: '與班平均差', value: sg(vals[k]) + ' 分' });
          rows.push({ name: '得分' + (q.max !== 100 ? '（滿分 ' + fmt(q.max) + '）' : ''), value: fmt(q.scores[i]) });
          rows.push({ name: '名次', value: '第 ' + q.ranks[i] + ' 名 / ' + q.n + ' 人' });
        }
        rows.push({ color: 'var(--cls)', name: '班平均', value: fmt(q.stats.mean) });
        return { title: (q.term ? q.term + ' ' : '') + q.name + '（' + (q.category || '未分類') + '）', rows: rows };
      }
    });
  }

  function positionChart(d, s) {
    var A = s.A, sc = s.sc, i = s.i, agg = s.agg;
    var b = el('div'); d.appendChild(b);
    var vals = sc.T ? sc.T.scores : agg.rows.map(function (rw) { return rw.eligible ? rw.avg : null; });
    AX.barChart(b, {
      bins: AX.pctBins(A.students, vals, vals[i] != null ? i : null), color: 'var(--cls)', hiColor: 'var(--me)', name: '全班', hiName: '本人所在組距',
      markBefore: A.passPct / 10, markLabel: '及格 ' + A.passPct, xTitle: sc.T ? '學期成績' : '累計平均得分', height: 230, ariaLabel: '全班成績分布，標示本人位置'
    });
  }

  function termRowsOf(s) {
    var rows = [];
    s.sub.terms.forEach(function (t) { var r = S.termRow(s.sub, t, s.i); if (r) rows.push(r); });
    return rows;
  }

  function termsTable(c, s) {
    var rows = termRowsOf(s), sub = s.sub;
    c.appendChild(el('p', { 'class': 'sub' }, '「相對班平均」＝本人減全班平均，數字越大代表在班上越突出；跨學期要看進退步，看這一欄最準。'));
    var box = el('div'); c.appendChild(box);
    var mine = rows.map(function (r) { return r.score; }), means = rows.map(function (r) { return r.classMean; });
    var lo = rows.map(function (r) { return sub.byTerm[r.term].T.tiers.back; }), hi = rows.map(function (r) { return sub.byTerm[r.term].T.tiers.front; });
    var rg = AX.niceRange(mine.concat(means, lo, hi));
    AX.lineChart(box, {
      labels: rows.map(function (r) { return S.termLabel(r.term); }), yMin: rg.lo, yMax: rg.hi, ticks: rg.ticks, height: 210,
      series: [{ name: '本人', color: 'var(--me)', values: mine }, { name: '班級平均', color: 'var(--cls)', values: means }],
      band: { name: '後標～前標', color: 'var(--cls)', lo: lo, hi: hi }, ariaLabel: '各學期成績',
      tipRows: function (k) {
        var r = rows[k];
        return { title: S.termLabel(r.term), rows: [{ color: 'var(--me)', name: '本人（第 ' + r.rank + ' 名 / ' + r.n + ' 人）', value: fmt(r.score) }, { color: 'var(--cls)', name: '班級平均', value: fmt(r.classMean) }] };
      }
    });
    var wrap = el('div', { 'class': 'tbl-wrap' }); wrap.style.marginTop = '10px';
    var tb = el('table', { 'class': 'stats' }), thead = el('thead'), hr = el('tr');
    var hasOther = rows.some(function (r) { return r.comp.other != null; });
    ['學期', '學期成績', '班平均', '相對班平均', '名次', '所在位置', '較上學期', '第一次定期考查', '第二次定期考查', '紙筆測驗', '作業'].concat(hasOther ? ['課堂表現'] : []).concat(['期中考', '期末考']).forEach(function (h) { hr.appendChild(el('th', { 'class': h === '學期' ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (r, k) {
      var tr = el('tr'), pv = k > 0 ? rows[k - 1] : null;
      var cm = function (v) { return v == null ? '—' : fmt(v); };
      [S.termLabel(r.term), fmt(r.score) + (r.partial ? '*' : ''), fmt(r.classMean), sg(r.diff), r.rank + ' / ' + r.n, r.tier, pv ? sg(r.score - pv.score) + '（相對 ' + sg(r.diff - pv.diff) + '）' : '—',
        cm(r.comp.total1), cm(r.comp.total2), cm(r.comp.quiz), cm(r.comp.homework)].concat(hasOther ? [cm(r.comp.other)] : []).concat([cm(r.comp.midterm), cm(r.comp.final)]).forEach(function (v, j) {
        var td = el('td', { 'class': j === 0 ? 'l' : '' }, v);
        if (j === 3) td.className = AX.cls(r.diff);
        if (j === 6 && pv) td.className = AX.cls(r.diff - pv.diff, 2);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap);
    if (rows.some(function (r) { return r.partial; })) c.appendChild(el('p', { 'class': 'muted small' }, '* 該學期缺少部分成分（例如缺考，或第二次定期考查還沒考完），學期成績已依其餘成分重新分配比例。'));
  }

  // 逐次明細（預設摺疊；要看每一次的分數才需要打開）
  function detailTable(host, s) {
    var qs = s.A.quiz, i = s.i, isAll = s.sc.isAll;
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' });
    var heads = ['項目'].concat(isAll ? ['學期'] : []).concat(['類別', '得分', '班平均', '與班平均差', '名次', '所在位置', '較前次']);
    var thead = el('thead'), hr = el('tr');
    heads.forEach(function (h) { hr.appendChild(el('th', { 'class': (h === '類別' || h === '學期') ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody'), prev = null, warnN = 0;
    function left(j) { return j === 1 || (isAll && j === 2); }
    qs.forEach(function (q) {
      var tr = el('tr'), sc = q.scores[i];
      var pre = [q.name].concat(isAll ? [q.term || '—'] : []).concat([q.category || '—']);
      if (sc == null) {
        pre.concat(['缺考', fmt(q.stats.mean), '—', '—', '—', '—']).forEach(function (v, j) { tr.appendChild(el('td', { 'class': left(j) ? 'l' : '' }, v)); });
        tr.className = 'warnRow'; warnN++;
        body.appendChild(tr); return;
      }
      var diff = sc - q.stats.mean, dropped = prev && (q.ranks[i] - prev.rank) >= 3;
      if (diff < 0 || dropped) { tr.className = 'warnRow'; warnN++; }
      var cells = pre.concat([fmt(sc), fmt(q.stats.mean), null, q.ranks[i] + ' / ' + q.n, S.tierName(q.tiers, sc), null]);
      var diffAt = pre.length + 2, prevAt = pre.length + 5;
      cells.forEach(function (v, j) {
        var td = el('td', { 'class': left(j) ? 'l' : '' }, v == null ? '' : v);
        if (j === diffAt) { td.textContent = sg(diff) + ' 分'; td.className = AX.cls(diff); }
        if (j === prevAt) {
          if (prev) {
            var dp = prev.max === q.max ? sc - prev.score : q.pcts[i] - prev.pct, dr = prev.rank - q.ranks[i];
            td.appendChild(el('span', { 'class': AX.cls(dp) }, sg(dp) + ' 分'));
            td.appendChild(document.createTextNode('・'));
            td.appendChild(el('span', { 'class': AX.cls(dr, 0) }, AX.rankMove(prev.rank, q.ranks[i])));
          } else td.textContent = '—';
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
      prev = { score: sc, max: q.max, pct: q.pcts[i], rank: q.ranks[i] };
    });
    tb.appendChild(body); wrap.appendChild(tb);
    var d = fold('逐次測驗明細', qs.length + ' 次' + (warnN ? '，其中 ' + warnN + ' 次標色（需留意）' : '，沒有需要留意的'), false);
    d.appendChild(el('p', { 'class': 'sub' }, '淡紅色的列＝低於班平均、缺考，或名次比前次退步 3 名以上。「較前次」是和上一次有參加的測驗相比（不分項目）。要比同項目的進退步，請看上面的「各項目表現」。'));
    d.appendChild(wrap); host.appendChild(d);
  }

  // 作業（各學期各一段；預設摺疊，有缺交時展開）
  function homeworkFold(host, s) {
    var sc = s.sc, i = s.i, N = s.N, stu = s.sub.data.students[i], hw = s.hw;
    var list = hwList(s.sub, sc);
    if (!list.length) return;
    var d = fold('作業繳交情況', hw.total ? '缺交 ' + hw.total + ' 次' : '全部都有繳交', hw.total > 0);
    list.forEach(function (x) {
      var h = x.h;
      var val = function (k) { return h.pcts ? h.pcts[k] : h.sums[k] / h.nItems; };
      var all = h.sums.map(function (v, k) { return val(k); }), mu = S.mean(all), v = val(i), df = v - mu, unit = h.pcts ? '%' : ' 分';
      var miss = h.items.filter(function (it) { return stu.scores[it.k] == null; }).map(function (it) { return it.name; });
      var t = el('div', { 'class': 'h3' }, (x.term ? S.termLabel(x.term) + ' ' : '') + (h.category || '作業')); t.style.marginTop = '6px';
      d.appendChild(t);
      var ul = el('ul', { 'class': 'insights' });
      ul.appendChild(el('li', null, (h.pcts ? '得分率 ' : '每項平均 ') + fmt(v) + unit + '，' +
        (Math.abs(df) < 0.05 ? '與全班平均相同' : (df > 0 ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(df)) + (h.pcts ? ' 個百分點' : ' 分')) + '（全班 ' + fmt(mu) + unit + '，名次第 ' + h.ranks[i] + ' / ' + N + '）。缺交以 0 分計。'));
      ul.appendChild(el('li', null, miss.length ? '缺交 ' + miss.length + ' / ' + h.nItems + ' 項：' + miss.join('、') + '。' : '全部 ' + h.nItems + ' 項都有繳交。'));
      d.appendChild(ul);
    });
    host.appendChild(d);
  }
})();
</script>
