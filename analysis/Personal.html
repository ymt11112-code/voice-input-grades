<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個人成績概況</title>
  <link rel="stylesheet" href="analysis-common.css">
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a href="Dashboard.html">全班概況</a>
      <a class="on" href="Personal.html">個人概況</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span class="lbl">科目</span><span id="subjectBtns" class="grp"></span></span>
      <span class="grp">
        <span class="lbl">學生</span>
        <button id="prevBtn" title="上一位">◀</button>
        <select id="stuSel"></select>
        <button id="nextBtn" title="下一位">▶</button>
      </span>
      <span class="grp" id="catWrap"><span class="lbl">測驗類別</span><span id="catBtns" class="grp"></span></span>
    </div>
    <div id="main"></div>
  </div>
</div>

<script src="analysis-common.js"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt, sg = S.signed;
  var st = { subjects: [], kinds: {}, subject: null, data: null, A: null, cats: null, si: 0, wantRow: null, pass: AX.getPass() };

  AX.shell();
  AX.onResize(function () { if (st.A) renderMain(); });

  AX.loadInit().then(function (init) {
    st.subjects = init.subjects; st.kinds = init.kinds;
    var q = AX.qs();
    st.subject = st.subjects.indexOf(q.subject) > -1 ? q.subject : st.subjects[0];
    st.wantRow = q.row ? Number(q.row) : null;
    renderSubjectBtns();
    if (!st.subject) { AX.$('main').appendChild(el('div', { 'class': 'card empty' }, '試算表還沒有任何科目，請先到「登記分數」面板建立。')); return; }
    loadSubject();
  }).catch(AX.showError);

  function loadSubject() {
    AX.call('getAnalysisData', st.subject).then(function (d) {
      st.data = d;
      for (var c in d.kinds) st.kinds[c] = d.kinds[c];
      st.A = S.analyze(d, st.kinds, st.pass);
      st.cats = null;
      var idx = -1;
      if (st.wantRow != null) d.students.forEach(function (s, i) { if (s.row === st.wantRow) idx = i; });
      st.si = idx > -1 ? idx : Math.min(st.si, Math.max(0, d.students.length - 1));
      st.wantRow = null;
      renderStudentSel();
      renderCatBtns();
      renderMain();
    }).catch(AX.showError);
  }

  // ---------- 列 ----------
  function renderSubjectBtns() {
    var box = AX.$('subjectBtns'); AX.clear(box);
    st.subjects.forEach(function (s) {
      var b = el('button', { 'class': s === st.subject ? 'on' : '' }, s);
      b.onclick = function () {
        if (s === st.subject) return;
        // 換科目時盡量停在同一位學生（用姓名對應，各科名單通常相同）
        var keep = st.data && st.data.students[st.si] ? st.data.students[st.si].name : null;
        st.subject = s; renderSubjectBtns();
        AX.call('getAnalysisData', s).then(function (d) {
          st.data = d; for (var c in d.kinds) st.kinds[c] = d.kinds[c];
          st.A = S.analyze(d, st.kinds, st.pass); st.cats = null;
          var j = -1; d.students.forEach(function (x, i) { if (x.name === keep) j = i; });
          st.si = j > -1 ? j : 0;
          renderStudentSel(); renderCatBtns(); renderMain();
        }).catch(AX.showError);
      };
      box.appendChild(b);
    });
  }
  function renderStudentSel() {
    var sel = AX.$('stuSel'); AX.clear(sel);
    st.A.students.forEach(function (s, i) {
      var o = el('option', { value: i }, AX.seatLabel(s));
      if (i === st.si) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { st.si = Number(sel.value); renderMain(); };
    AX.$('prevBtn').onclick = function () { step(-1); };
    AX.$('nextBtn').onclick = function () { step(1); };
  }
  function step(d) {
    var n = st.A.students.length; if (!n) return;
    st.si = (st.si + d + n) % n;
    AX.$('stuSel').value = st.si;
    renderMain();
  }
  function renderCatBtns() {
    var box = AX.$('catBtns'), cats = []; AX.clear(box);
    st.A.quiz.forEach(function (q) { if (cats.indexOf(q.category) === -1) cats.push(q.category); });
    AX.$('catWrap').hidden = cats.length < 2;
    var all = el('button', { 'class': st.cats ? '' : 'on' }, '全部');
    all.onclick = function () { st.cats = null; renderCatBtns(); renderMain(); };
    box.appendChild(all);
    cats.forEach(function (c) {
      var on = st.cats && st.cats.indexOf(c) > -1;
      var b = el('button', { 'class': on ? 'on' : '' }, c || '（未分類）');
      b.onclick = function () {
        var cur = st.cats ? st.cats.slice() : [], i = cur.indexOf(c);
        if (i > -1) cur.splice(i, 1); else cur.push(c);
        st.cats = cur.length ? cur : null; renderCatBtns(); renderMain();
      };
      box.appendChild(b);
    });
  }

  // ---------- 小元件 ----------
  function card(title, sub) {
    var c = el('div', { 'class': 'card' });
    c.appendChild(el('h2', null, title));
    if (sub) c.appendChild(el('p', { 'class': 'sub' }, sub));
    return c;
  }
  function tile(k, v, unit, d, dcls) {
    var t = el('div', { 'class': 'tile' });
    t.appendChild(el('div', { 'class': 'k' }, k));
    var vv = el('div', { 'class': 'v' }, v);
    if (unit) vv.appendChild(el('small', null, unit));
    t.appendChild(vv);
    if (d) t.appendChild(el('div', { 'class': 'd ' + (dcls || '') }, d));
    return t;
  }
  function cls(v, eps) { eps = eps == null ? 0.05 : eps; return v > eps ? 'up' : (v < -eps ? 'down' : 'flat'); }
  function rankMove(prev, cur) { // 名次數字變小＝進步
    var d = prev - cur;
    return d > 0 ? '▲ ' + d + ' 名' : (d < 0 ? '▼ ' + (-d) + ' 名' : '名次不變');
  }
  function niceRange(vals) {
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    lo = Math.max(0, Math.floor((lo - 5) / 10) * 10); hi = Math.min(100, Math.ceil((hi + 5) / 10) * 10);
    if (hi - lo < 20) { hi = Math.min(100, lo + 20); lo = Math.max(0, hi - 20); }
    var stp = hi - lo > 50 ? 20 : 10, ticks = [];
    for (var t = lo; t <= hi; t += stp) ticks.push(t);
    return { lo: lo, hi: hi, ticks: ticks };
  }

  // ---------- 主畫面 ----------
  function renderMain() {
    var main = AX.$('main'); AX.clear(main);
    var A = st.A, N = A.students.length;
    if (!N) { main.appendChild(el('div', { 'class': 'card empty' }, '這個科目還沒有學生名單。')); return; }
    var i = st.si, stu = A.students[i];
    try { history.replaceState(null, '', '?subject=' + encodeURIComponent(st.subject) + '&row=' + stu.row + (AX.isDemo ? '&demo=1' : '')); } catch (e) { /* 本機檔案可能不允許，忽略 */ }

    var qs = A.quiz.filter(function (q) { return !st.cats || st.cats.indexOf(q.category) > -1; });
    var series = S.studentSeries(A, i, st.cats);
    var agg = S.studentAgg(A, st.cats), me = agg.rows[i];
    if (!qs.length && !A.homework.length) {
      main.appendChild(el('div', { 'class': 'card empty' }, '這個科目還沒有登記任何成績。')); return;
    }

    var head = el('div', { 'class': 'card' });
    head.appendChild(el('h2', null, AX.seatLabel(stu) + '・' + st.subject));
    head.appendChild(el('p', { 'class': 'sub' }, '共 ' + qs.length + ' 次測驗，實際參加 ' + series.length + ' 次' + (series.length < qs.length ? '（缺考：' + qs.filter(function (q) { return q.scores[i] == null; }).map(function (q) { return q.name; }).join('、') + '）' : '') + '。排名只與全班（' + N + ' 人）比較。'));
    head.style.marginBottom = '12px';

    var tiles = el('div', { 'class': 'tiles' });
    if (qs.length) {
      // 1 累計平均
      tiles.appendChild(tile('累計平均得分率', me.avg == null ? '—' : fmt(me.avg), me.avg == null ? '' : '%',
        me.avg == null ? '尚無成績' : '全班平均 ' + fmt(agg.stats.mean) + '%（' + sg(me.avg - agg.stats.mean) + '）', me.avg == null ? '' : cls(me.avg - agg.stats.mean)));
      // 2 名次
      if (me.eligible) {
        tiles.appendChild(tile('累計名次', String(me.rank), '/ ' + agg.eligibleN + ' 人',
          '前 ' + S.topPercent(me.rank, agg.eligibleN) + '%・' + S.tierName(agg.tiers, me.avg)));
      } else {
        tiles.appendChild(tile('累計名次', '—', '', '缺考過多，不列入排名'));
      }
      // 3 最近一次
      if (series.length) {
        var L = series[series.length - 1], P = series.length > 1 ? series[series.length - 2] : null;
        tiles.appendChild(tile('最近一次：' + L.q.name, fmt(L.score), '/ ' + fmt(L.q.max),
          '第 ' + L.rank + ' 名 / ' + L.n + ' 人' + (P ? '（' + rankMove(P.rank, L.rank) + '）' : ''), P ? cls(P.rank - L.rank, 0) : ''));
      }
      // 4 進退步
      var tj = S.trendJudge(series);
      if (tj) {
        tiles.appendChild(tile('近期趨勢', tj.label, '',
          '最近 ' + tj.recentN + ' 次相對班平均 ' + sg(tj.delta) + ' 個百分點', tj.label === '進步' ? 'up' : (tj.label === '退步' ? 'down' : 'flat')));
      } else {
        tiles.appendChild(tile('近期趨勢', '資料不足', '', '至少需要 2 次測驗'));
      }
    }
    A.homework.forEach(function (h) {
      tiles.appendChild(tile((h.category || '作業') + '總和', fmt(h.sums[i]), h.totalMax ? '/ ' + fmt(h.totalMax) : '分',
        '第 ' + h.ranks[i] + ' 名 / ' + N + ' 人・缺交 ' + h.missing[i] + ' 次', h.missing[i] > 0 ? 'down' : ''));
    });
    main.appendChild(head);
    main.appendChild(tiles);

    if (qs.length) {
      renderInsights(main, series, agg, me, qs);
      renderCharts(main, qs, series, agg, i);
      renderTable(main, qs, i);
    }
    A.homework.forEach(function (h) { renderHomework(main, h, i); });
  }

  // ---------- 分析重點（文字） ----------
  function renderInsights(main, series, agg, me, qs) {
    var c = card('分析重點', '依照全班資料自動整理。進退步是和「當次班平均」相比，所以不會因為某次考卷特別難或特別簡單而誤判。');
    var ul = el('ul', { 'class': 'insights' });
    function add(t) { ul.appendChild(el('li', null, t)); }
    var A = st.A;
    if (!series.length) { add('這個範圍內還沒有任何測驗成績。'); c.appendChild(ul); main.appendChild(c); return; }

    if (me.avg != null) {
      var d = me.avg - agg.stats.mean;
      add('累計平均得分率 ' + fmt(me.avg) + '%，' + (Math.abs(d) < 0.05 ? '與全班平均相同' : (d > 0 ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(d)) + ' 個百分點') +
        (me.eligible ? '；累計名次第 ' + me.rank + ' 名（共 ' + agg.eligibleN + ' 人，前 ' + S.topPercent(me.rank, agg.eligibleN) + '%），落在「' + S.tierName(agg.tiers, me.avg) + '」位置。' : '；因缺考超過一半，未列入排名。'));
    }
    var tj = S.trendJudge(series);
    if (tj) {
      var msg = tj.label === '進步' ? '近期表現進步：最近 ' + tj.recentN + ' 次比之前的 ' + tj.earlierN + ' 次，相對班平均多了 ' + fmt(tj.delta) + ' 個百分點。'
        : tj.label === '退步' ? '近期表現退步：最近 ' + tj.recentN + ' 次比之前的 ' + tj.earlierN + ' 次，相對班平均少了 ' + fmt(-tj.delta) + ' 個百分點，建議多關心。'
        : '近期表現大致持平（最近 ' + tj.recentN + ' 次與之前相比，相對班平均只差 ' + sg(tj.delta) + ' 個百分點）。';
      if (series.length < 4) msg += '（測驗次數還少，僅供參考）';
      add(msg);
    }
    if (series.length >= 2) {
      var L = series[series.length - 1], P = series[series.length - 2], dp = L.pct - P.pct;
      add('最近一次「' + L.q.name + '」得分率 ' + fmt(L.pct) + '%，比前一次「' + P.q.name + '」' + (Math.abs(dp) < 0.05 ? '相同' : (dp > 0 ? '進步 ' : '退步 ') + fmt(Math.abs(dp)) + ' 個百分點') +
        '；名次由第 ' + P.rank + ' 名' + (L.rank === P.rank ? '維持' : (L.rank < P.rank ? '進步' : '退到') + '第 ' + L.rank + ' 名') + '。');
    }
    if (series.length >= 2) {
      var best = series.slice().sort(function (a, b) { return a.diff - b.diff; });
      var hi = best[best.length - 1], lo = best[0];
      add('相對班級最強的是「' + hi.q.name + '」（高於班平均 ' + fmt(hi.diff) + ' 點，第 ' + hi.rank + ' 名）；最弱的是「' + lo.q.name + '」（' + (lo.diff >= 0 ? '高於' : '低於') + '班平均 ' + fmt(Math.abs(lo.diff)) + ' 點，第 ' + lo.rank + ' 名）。');
    }
    if (series.length >= 3) {
      var s = S.sd(series.map(function (x) { return x.pct; }));
      add('成績穩定度：得分率標準差 ' + fmt(s) + '，' + (s < 5 ? '表現很穩定' : (s < 10 ? '略有起伏' : '起伏較大')) + '。');
    }
    var fails = series.filter(function (x) { return x.pct < A.passPct; });
    if (fails.length) add('低於及格線（' + A.passPct + '%）的測驗：' + fails.map(function (x) { return x.q.name + '（' + fmt(x.pct) + '%）'; }).join('、') + '。');
    c.appendChild(ul); main.appendChild(c);
  }

  // ---------- 圖 ----------
  function renderCharts(main, qs, series, agg, i) {
    var A = st.A;
    var c1 = card('得分率與班級平均', '橘線是本人，藍線是班級平均，淡色帶是班上「後標～前標」的範圍。缺考的測驗線會中斷。');
    var b1 = el('div'); c1.appendChild(b1); main.appendChild(c1);
    var mine = qs.map(function (q) { return q.pcts[i]; });
    var means = qs.map(function (q) { return q.pctStats.mean; });
    var lo = qs.map(function (q) { return q.tiersPct.back; }), hi = qs.map(function (q) { return q.tiersPct.front; });
    var r = niceRange(mine.filter(function (v) { return v != null; }).concat(means, lo, hi));
    AX.lineChart(b1, {
      labels: qs.map(function (q) { return q.name; }), yMin: r.lo, yMax: r.hi, ticks: r.ticks, yFmt: function (v) { return v + '%'; },
      series: [{ name: '本人', color: 'var(--series-2)', values: mine }, { name: '班級平均', color: 'var(--series-1)', values: means }],
      band: { name: '後標～前標', color: 'var(--series-1)', lo: lo, hi: hi }, ariaLabel: '個人與班級平均得分率折線圖',
      tipRows: function (k) {
        var q = qs[k], rows = [];
        if (q.scores[i] != null) rows.push({ color: 'var(--series-2)', name: '本人（' + fmt(q.scores[i]) + '/' + fmt(q.max) + '・第 ' + q.ranks[i] + ' 名）', value: fmt(q.pcts[i]) + '%' });
        else rows.push({ name: '本人：缺考', value: '—' });
        rows.push({ color: 'var(--series-1)', name: '班級平均', value: fmt(q.pctStats.mean) + '%' });
        return { title: q.name + '（' + (q.category || '未分類') + '）', rows: rows };
      }
    });

    var cols = el('div', { 'class': 'cols mb' });
    var c2 = card('名次變化', '每次測驗在全班的名次，越往上名次越前面。'), c3 = card('我在全班的位置', '全班「累計平均得分率」的分布，橘色是本人所在組距。');
    var b2 = el('div'), b3 = el('div'); c2.appendChild(b2); c3.appendChild(b3);
    cols.appendChild(c2); cols.appendChild(c3); main.appendChild(cols);
    var ranks = qs.map(function (q) { return q.ranks[i]; });
    var maxN = Math.max.apply(null, qs.map(function (q) { return q.n; }).concat([2]));
    var ticks = [1]; var stp = maxN <= 10 ? 1 : (maxN <= 30 ? 5 : 10);
    for (var t = stp; t <= maxN; t += stp) if (t !== 1) ticks.push(t);
    if (ticks[ticks.length - 1] !== maxN && maxN - ticks[ticks.length - 1] > stp / 2) ticks.push(maxN);
    AX.lineChart(b2, {
      labels: qs.map(function (q) { return q.name; }), yMin: 1, yMax: maxN, ticks: ticks, invert: true, height: 230,
      series: [{ name: '名次', color: 'var(--series-2)', values: ranks }], ariaLabel: '個人名次折線圖',
      tipRows: function (k) {
        var q = qs[k];
        return { title: q.name, rows: q.scores[i] == null ? [{ name: '缺考', value: '—' }] : [{ color: 'var(--series-2)', name: '/ ' + q.n + ' 人', value: '第 ' + ranks[k] + ' 名' }] };
      }
    });
    var avgs = agg.rows.map(function (rw) { return rw.eligible ? rw.avg : null; });
    AX.barChart(b3, {
      bins: AX.pctBins(A.students, avgs, agg.rows[i].eligible ? i : null), color: 'var(--series-1)', hiColor: 'var(--series-2)', name: '全班', hiName: '本人所在組距',
      markBefore: A.passPct / 10, markLabel: '及格 ' + A.passPct + '%', xTitle: '累計平均得分率（%）', height: 230, ariaLabel: '全班累計平均得分率分布，標示本人位置'
    });
  }

  // ---------- 明細表 ----------
  function renderTable(main, qs, i) {
    var c = card('每次測驗明細', '「較前次」是和上一次有參加的測驗相比：得分率差距（百分點）與名次變化。');
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' });
    var thead = el('thead'), hr = el('tr');
    ['項目', '類別', '成績', '得分率', '班平均', '與班平均差', '名次', '所在位置', '較前次'].forEach(function (h, k) { hr.appendChild(el('th', { 'class': k === 1 ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody'), prev = null;
    qs.forEach(function (q) {
      var tr = el('tr'), sc = q.scores[i];
      if (sc == null) {
        [q.name, q.category || '—', '缺考', '—', fmt(q.pctStats.mean) + '%', '—', '—', '—', '—'].forEach(function (v, k) { tr.appendChild(el('td', { 'class': k === 1 ? 'l' : '' }, v)); });
        body.appendChild(tr); return;
      }
      var diff = q.pcts[i] - q.pctStats.mean;
      var cells = [q.name, q.category || '—', fmt(sc) + ' / ' + fmt(q.max), fmt(q.pcts[i]) + '%', fmt(q.pctStats.mean) + '%', null, q.ranks[i] + ' / ' + q.n, S.tierName(q.tiers, sc), null];
      cells.forEach(function (v, k) {
        var td = el('td', { 'class': k === 1 ? 'l' : '' }, v == null ? '' : v);
        if (k === 5) { td.textContent = sg(diff) + ' 點'; td.className = cls(diff); }
        if (k === 8) {
          if (prev) {
            var dp = q.pcts[i] - prev.pct, dr = prev.rank - q.ranks[i];
            var s1 = el('span', { 'class': cls(dp) }, sg(dp) + ' 點'), s2 = el('span', { 'class': cls(dr, 0) }, rankMove(prev.rank, q.ranks[i]));
            td.appendChild(s1); td.appendChild(document.createTextNode('・')); td.appendChild(s2);
          }
          else td.textContent = '—';
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
      prev = { pct: q.pcts[i], rank: q.ranks[i] };
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap); main.appendChild(c);
  }

  // ---------- 作業 ----------
  function renderHomework(main, h, i) {
    var A = st.A, N = A.students.length, stu = A.students[i];
    var c = card((h.category || '作業') + '：總和', '作業只比較「總和」，空白視為缺交（以 0 分計）。');
    var miss = h.items.filter(function (it) { return stu.scores[it.k] == null; }).map(function (it) { return it.name; });
    var d = h.sums[i] - h.stats.mean;
    var ul = el('ul', { 'class': 'insights' });
    ul.appendChild(el('li', null, '總和 ' + fmt(h.sums[i]) + (h.totalMax ? ' / ' + fmt(h.totalMax) + ' 分（' + fmt(h.pcts[i]) + '%）' : ' 分') + '，' +
      (Math.abs(d) < 0.05 ? '與全班平均相同' : (d > 0 ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(d)) + ' 分（平均 ' + fmt(h.stats.mean) + '）') + '；總和名次第 ' + h.ranks[i] + ' 名 / ' + N + ' 人，落在「' + S.tierName(h.tiers, h.sums[i]) + '」位置。'));
    ul.appendChild(el('li', null, miss.length ? '缺交 ' + miss.length + ' / ' + h.nItems + ' 項：' + miss.join('、') + '。' : '全部 ' + h.nItems + ' 項都有繳交。'));
    c.appendChild(ul); main.appendChild(c);
  }
})();
</script>
</body>
</html>
