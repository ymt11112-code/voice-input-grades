<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>獎狀名單</title>
  <link rel="stylesheet" href="analysis-common.css">
  <style>
    .list li.off { opacity: .45; text-decoration: line-through; }
    .list li label { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; cursor: pointer; }
    .tieNote { color: var(--mid); font-size: 12.5px; margin: 2px 0 4px; }
    .pasteBox { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }
    .pasteBox ol { margin: 6px 0 0; padding-left: 20px; }
    .pasteBox li { margin: 3px 0; }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a href="Dashboard.html">全班概況</a>
      <a href="Personal.html">個人概況</a>
      <a href="Progress.html">成績歷程</a>
      <a href="Report.html">家長報告</a>
      <a href="Attention.html">關注名單</a>
      <a class="on" href="Awards.html">獎狀名單</a>
      <a href="Missing.html">缺分紀錄</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span class="lbl">學期</span><span id="termBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">名單種類</span><span id="phaseBtns" class="grp"></span></span>
      <span class="spacer"></span>
      <button id="reloadBtn" title="在試算表貼上或修改成績後，按這裡重新讀取">🔄 重新讀取試算表</button>
    </div>
    <div class="card noprint">
      <div class="setgrp">
        <div class="h3">名單條件</div>
        <div class="bar">
          <span class="grp"><span class="lbl" id="topLbl">每科前</span><input type="number" id="optTopN" min="1" max="30"><span class="lbl">名</span></span>
          <label class="chk"><input type="checkbox" id="optTies"> 同分一併列入</label>
          <span class="grp" id="basisGrp"><span class="lbl">排名依據</span>
            <select id="optBasis">
              <option value="exam">只看這次考試分數</option>
              <option value="term">定期考查總成績（平時成績＋段考；期末＝學期成績）</option>
            </select></span>
          <label class="chk"><input type="checkbox" id="optSeat"> 不重複名單依座號排列</label>
        </div>
        <div class="bar" id="progBar">
          <span class="grp"><span class="lbl">進步獎每科</span><input type="number" id="optProgN" min="1" max="30"><span class="lbl">人</span></span>
          <span class="grp"><span class="lbl">進步算法</span>
            <select id="optMetric">
              <option value="score">分數進步（期末 − 比較基準）</option>
              <option value="relative">相對班平均進步（扣除考卷難易）</option>
              <option value="rank">名次進步</option>
            </select></span>
          <span class="grp"><span class="lbl">比較基準</span>
            <select id="optBase">
              <option value="midterm">同學期的期中考</option>
              <option value="prevFinal">上一學期的期末考</option>
            </select></span>
          <span class="grp"><span class="lbl">至少進步</span><input type="number" id="optMin" min="1"><span class="lbl" id="minUnit">分</span></span>
          <label class="chk"><input type="checkbox" id="optExcl"> 已得該科前幾名者不重複領進步獎</label>
        </div>
        <div class="bar"><span class="lbl" id="subjLbl">納入的科目</span><span id="subjChecks" class="grp"></span></div>
      </div>
    </div>
    <div id="main"></div>
  </div>
</div>

<script src="analysis-stats.js"></script>
<script src="analysis-demo.js"></script>
<script src="analysis-common.js"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt;
  var st = { raw: null, model: null, term: null, phase: 'final', last: null, parsed: null, ex: {}, subjSel: null, domSel: null,
    o: { topN: 5, ties: true, basis: 'exam', sortBySeat: false, progressN: 3, progressMetric: 'score', progressBase: 'midterm', minGain: 5, excludeTop: true } };
  var PHASE_NAME = { midterm: '期中考', final: '期末考', term: '學期總成績' };

  AX.shell();
  try { var sv = JSON.parse(AX.lsGet('AX_AWARD') || '{}'); for (var k in sv) if (k in st.o) st.o[k] = sv[k]; } catch (e) { /* 用預設值 */ }
  try { st.ex = JSON.parse(AX.lsGet('AX_AWARD_EX') || '{}'); } catch (e) { st.ex = {}; }
  function persist() { AX.lsSet('AX_AWARD', JSON.stringify(st.o)); }
  function persistEx() { AX.lsSet('AX_AWARD_EX', JSON.stringify(st.ex)); }
  function exKey(kind, subject, key) { return [st.term, st.phase, kind, subject, key].join('|'); }

  // ---- 條件欄位
  var F = { topN: AX.$('optTopN'), ties: AX.$('optTies'), basis: AX.$('optBasis'), seat: AX.$('optSeat'), progN: AX.$('optProgN'), metric: AX.$('optMetric'), base: AX.$('optBase'), min: AX.$('optMin'), excl: AX.$('optExcl') };
  function loadFields() {
    F.topN.value = st.o.topN; F.ties.checked = st.o.ties; F.basis.value = st.o.basis; F.seat.checked = st.o.sortBySeat;
    F.progN.value = st.o.progressN; F.metric.value = st.o.progressMetric; F.base.value = st.o.progressBase; F.min.value = st.o.minGain; F.excl.checked = st.o.excludeTop;
    AX.$('minUnit').textContent = st.o.progressMetric === 'rank' ? '名' : '分';
  }
  function readFields() {
    var n = Number(F.topN.value); st.o.topN = n >= 1 ? Math.floor(n) : 5;
    st.o.ties = F.ties.checked; st.o.basis = F.basis.value; st.o.sortBySeat = F.seat.checked;
    var p = Number(F.progN.value); st.o.progressN = p >= 1 ? Math.floor(p) : 3;
    st.o.progressMetric = F.metric.value; st.o.progressBase = F.base.value;
    var mg = Number(F.min.value); st.o.minGain = mg > 0 ? mg : 1; st.o.excludeTop = F.excl.checked;
    AX.$('minUnit').textContent = st.o.progressMetric === 'rank' ? '名' : '分';
    persist(); render();
  }
  Object.keys(F).forEach(function (k) { F[k].onchange = readFields; });
  F.metric.addEventListener('change', function () { F.min.value = F.metric.value === 'rank' ? 3 : 5; readFields(); });

  // ---- 載入
  function isCore(n) { return /^(國語|國文|國語文|語文|數學|社會|自然)/.test(n); }
  function init(r, keepSel) {
    st.raw = r.raw; st.model = r.model;
    var m = st.model, names = m.subjects.map(function (s) { return s.name; });
    if (!keepSel || !st.subjSel) {
      // 期中、期末結算只計算國語、數學、社會、自然；健康、綜合等不預設納入（需要時可自己勾選）
      var core = names.filter(isCore);
      st.subjSel = core.length ? core : names.slice();
    }
    st.subjSel = st.subjSel.filter(function (n) { return names.indexOf(n) > -1; });
  }
  function allTerms() {
    var t = (st.raw.terms || []).slice();
    st.model.terms.forEach(function (x) { if (t.indexOf(x) === -1) t.push(x); });
    Object.keys(st.raw.domains || {}).forEach(function (x) { if (t.indexOf(x) === -1) t.push(x); });
    return t;
  }
  AX.load().then(function (r) {
    init(r, false);
    var m = st.model, q = AX.qs(), terms = allTerms();
    // 預設學期要選「有成績資料」的學期；舊格式（沒分學期）的資料學期是空的，不能直接選登記簿裡自動建的預設學期
    var dataTerms = m.terms;
    st.term = q.term && terms.indexOf(q.term) > -1 ? q.term
      : (dataTerms.indexOf(m.currentTerm) > -1 ? m.currentTerm : (dataTerms.length ? dataTerms[dataTerms.length - 1] : terms[terms.length - 1]));
    st.phase = hasFinal() ? 'final' : 'midterm';
    loadFields(); renderBar(); render();
  }).catch(AX.showError);
  AX.$('reloadBtn').onclick = function () {
    AX.load().then(function (r) { init(r, true); st.domSel = null; renderBar(); render(); AX.toast('已重新讀取試算表'); }).catch(AX.showError);
  };

  function hasFinal() {
    return st.model.subjects.some(function (sm) { var bt = sm.byTerm[st.term]; return bt && bt.T.comp.final.some(function (v) { return v != null; }); });
  }
  function parsedForTerm() {
    var vals = st.raw.domains && st.raw.domains[st.term];
    if (!vals) return null;
    return S.parseDomainSheet(vals);
  }

  function renderBar() {
    var m = st.model;
    AX.btnGroup(AX.$('termBtns'), allTerms().map(function (t) { return { label: S.termLabel(t), value: t }; }), st.term, function (v) {
      st.term = v; if (st.phase !== 'term') st.phase = hasFinal() ? 'final' : 'midterm'; st.domSel = null; renderBar(); render();
    });
    AX.btnGroup(AX.$('phaseBtns'), [{ label: '期中考', value: 'midterm' }, { label: '期末考', value: 'final' }, { label: '學期總成績（各領域）', value: 'term' }], st.phase, function (v) { st.phase = v; renderBar(); render(); });
    var isTerm = st.phase === 'term';
    AX.$('progBar').hidden = st.phase !== 'final';
    AX.$('basisGrp').hidden = isTerm;
    AX.$('topLbl').textContent = isTerm ? '每領域前' : '每科前';
    AX.$('subjLbl').textContent = isTerm ? '納入的領域' : '納入的科目（期中、期末預設只算國語、數學、社會、自然）';
    var box = AX.$('subjChecks'); AX.clear(box);
    if (isTerm) {
      st.parsed = parsedForTerm();
      if (!st.parsed || st.parsed.error) { box.appendChild(el('span', { 'class': 'muted small' }, '貼上學校匯出的成績後，這裡會列出領域')); return; }
      var names = st.parsed.domains.map(function (d) { return d.name; });
      if (!st.domSel) st.domSel = names.slice();
      names.forEach(function (n) {
        var lab = el('label', { 'class': 'chk' }), cb = el('input', { type: 'checkbox' });
        cb.checked = st.domSel.indexOf(n) > -1;
        cb.onchange = function () { st.domSel = names.filter(function (x) { return x === n ? cb.checked : st.domSel.indexOf(x) > -1; }); render(); };
        lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + n)); box.appendChild(lab);
      });
      return;
    }
    m.subjects.forEach(function (sm) {
      var lab = el('label', { 'class': 'chk' }), cb = el('input', { type: 'checkbox' });
      cb.checked = st.subjSel.indexOf(sm.name) > -1;
      cb.onchange = function () {
        st.subjSel = m.subjects.map(function (x) { return x.name; }).filter(function (n) { return n === sm.name ? cb.checked : st.subjSel.indexOf(n) > -1; });
        render();
      };
      lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + sm.name)); box.appendChild(lab);
    });
  }

  function titleText() { return S.termLabel(st.term) + ' ' + PHASE_NAME[st.phase]; }
  function unitOf(s) { return st.phase === 'term' || st.o.basis === 'term' ? ' 分' : ' %'; }

  // ---- 版面
  function render() {
    var main = AX.$('main'); AX.clear(main);
    var o = Object.assign({}, st.o, { term: st.term, phase: st.phase, subjects: st.subjSel, domains: st.domSel,
      excluded: function (kind, subject, key) { return !!st.ex[exKey(kind, subject, key)]; } });
    var isFinal = st.phase === 'final', R;

    if (st.phase === 'term') {
      st.parsed = parsedForTerm();
      if (!st.parsed) { renderPasteGuide(main); return; }
      if (st.parsed.error) { renderPasteGuide(main, st.parsed.error); return; }
      R = S.domainAwards(st.parsed, o);
      main.appendChild(statusCard());
    } else {
      R = S.awards(st.model, o);
      if (R.missing.length) main.appendChild(el('div', { 'class': 'note noprint' }, '這些科目沒有可用的成績，未列入名單：' + R.missing.map(function (x) { return x.subject + '（' + x.why + '）'; }).join('、') +
        '。如果是別位老師的科目（例如自然），請先用試算表選單「建立外科成績貼上區」建立工作表並貼上成績。'));
    }
    st.last = R;
    if (!R.subjects.length) { main.appendChild(el('div', { 'class': 'card empty' }, '沒有可以產生名單的科目／領域。')); return; }

    var unit = st.phase === 'term' ? '領域' : '科', tiles = el('div', { 'class': 'tiles noprint' });
    tiles.appendChild(AX.tile('前 ' + st.o.topN + ' 名（不重複）', String(R.topUnique.length), '人', R.subjects.length + ' ' + unit + '合計 ' + R.subjects.reduce(function (n, s) { return n + s.top.filter(function (x) { return !x.excluded; }).length; }, 0) + ' 個名額'));
    if (isFinal) tiles.appendChild(AX.tile('進步獎（不重複）', String(R.progUnique.length), '人', R.subjects.reduce(function (n, s) { return n + s.prog.filter(function (x) { return !x.excluded; }).length; }, 0) + ' 個名額'));
    var ties = R.subjects.filter(function (s) { return s.top.length > st.o.topN; });
    if (ties.length) tiles.appendChild(AX.tile('同分超出名額', String(ties.length), unit, ties.map(function (s) { return s.name; }).join('、') + '：請在下方明細勾選決定', 'down'));
    main.appendChild(tiles);

    // ---- 名單（你原本的格式：不重複名單＋科目）
    var c = AX.card(titleText() + ' 獎狀名單', '同一位同學在多個' + (st.phase === 'term' ? '領域' : '科目') + '得獎時合併成一列。可以直接複製貼到試算表／Word，或寫入試算表。下方明細可以取消勾選某位同學（例如同分要手動決定時）。');
    var bar = el('div', { 'class': 'bar noprint' });
    var b1 = el('button', { 'class': 'primary' }, '📋 複製（可貼進試算表）'); b1.onclick = copyTable;
    var b2 = el('button', null, '📄 寫入試算表「獎狀名單_系統產生」'); b2.onclick = writeSheet;
    var b3 = el('button', null, '🖨️ 列印'); b3.onclick = function () { window.print(); };
    bar.appendChild(b1); bar.appendChild(b2); bar.appendChild(b3);
    var link = el('a', { 'class': 'link', id: 'sheetLink', target: '_blank', rel: 'noopener' }); link.hidden = true; bar.appendChild(link);
    c.appendChild(bar);
    var cols = el('div', { 'class': isFinal ? 'cols' : '' });
    var L = el('div'), Rr = el('div'); cols.appendChild(L); if (isFinal) cols.appendChild(Rr); c.appendChild(cols); main.appendChild(c);
    L.appendChild(uniqueTable('前 ' + st.o.topN + ' 名名單', R.topUnique));
    if (isFinal) Rr.appendChild(uniqueTable('進步獎名單', R.progUnique));

    // ---- 各科（各領域）明細，每位同學可勾選
    var d = AX.card('各' + (st.phase === 'term' ? '領域' : '科') + '明細', '每一' + unit + '各自的名次與分數，製作獎狀時對照。取消勾選的同學不會出現在上面的不重複名單。' + (isFinal ? '進步獎的數字是「比較基準 → 期末考」與進步幅度。' : ''));
    var grid = el('div', { 'class': 'grid2' }); d.appendChild(grid); main.appendChild(d);
    R.subjects.forEach(function (s) {
      var mini = el('div', { 'class': 'mini' });
      mini.appendChild(el('h3', null, s.name));
      mini.appendChild(el('div', { 'class': 'h3 muted' }, '前 ' + st.o.topN + ' 名（' + s.top.length + ' 人）'));
      if (s.top.length > st.o.topN) mini.appendChild(el('div', { 'class': 'tieNote' }, '⚠ 同分 ' + s.top.length + ' 人超出 ' + st.o.topN + ' 個名額，請勾選要列入的人（或取消勾選「同分一併列入」只取前 ' + st.o.topN + ' 位）'));
      mini.appendChild(entryList(s.top, 'top', s.name, function (x) { return fmt(x.value) + unitOf(); }, true));
      if (isFinal) {
        var h = el('div', { 'class': 'h3 muted' }, '進步獎（' + s.prog.length + ' 人）'); h.style.marginTop = '10px'; mini.appendChild(h);
        if (s.prog.length) mini.appendChild(entryList(s.prog, 'prog', s.name, function (x) {
          return st.o.progressMetric === 'rank' ? '第 ' + x.baseRank + ' → 第 ' + x.curRank + ' 名（+' + fmt(x.gain, 0) + '）' : fmt(x.base) + ' → ' + fmt(x.cur) + '（+' + fmt(x.gain) + '）';
        }, false));
        else mini.appendChild(el('div', { 'class': 'muted small' }, s.progNote || '沒有符合條件的同學（可以調低「至少進步」）'));
      }
      grid.appendChild(mini);
    });
    if (st.phase !== 'term' && st.o.basis === 'exam') d.appendChild(el('p', { 'class': 'muted small' }, '分數單位：考試得分率（得分 ÷ 滿分 × 100）。滿分都是 100 時就是原始分數。'));
  }

  function entryList(entries, kind, subject, valFn, showRank) {
    var ul = el('ul', { 'class': 'list' });
    entries.forEach(function (x) {
      var li = el('li', { 'class': x.excluded ? 'off' : '' });
      li.appendChild(el('span', { 'class': 'rk' }, showRank ? String(x.rank) : ''));
      var lab = el('label'), cb = el('input', { type: 'checkbox' });
      cb.checked = !x.excluded;
      cb.onchange = function () {
        var key = exKey(kind, subject, x.key);
        if (cb.checked) delete st.ex[key]; else st.ex[key] = true;
        persistEx(); render();
      };
      lab.appendChild(cb); lab.appendChild(document.createTextNode(AX.seatLabel(x)));
      li.appendChild(lab);
      li.appendChild(el('span', { 'class': 'vl' }, valFn(x)));
      ul.appendChild(li);
    });
    return ul;
  }

  function uniqueTable(title, list) {
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' });
    var thead = el('thead'), hr = el('tr');
    ['序', '姓名', '科目'].forEach(function (h, i) { hr.appendChild(el('th', { 'class': i === 0 ? '' : 'l' }, h)); });
    thead.appendChild(el('tr')).appendChild(el('th', { colspan: '3', 'class': 'l' }, title));
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    list.forEach(function (x, i) {
      var tr = el('tr');
      tr.appendChild(el('td', null, String(i + 1)));
      tr.appendChild(el('td', { 'class': 'l' }, x.name));
      tr.appendChild(el('td', { 'class': 'l' }, x.subjects.join('、')));
      body.appendChild(tr);
    });
    if (!list.length) { var e = el('tr'); e.appendChild(el('td', { colspan: '3', 'class': 'l muted' }, '（沒有符合條件的同學）')); body.appendChild(e); }
    tb.appendChild(body); wrap.appendChild(tb); return wrap;
  }

  // ---- 學期總成績：還沒貼上成績時的說明
  function sheetName() { return '領域成績_' + st.term; }
  function attachSheetLink(a) {
    AX.call('getSpreadsheetInfo').then(function (info) {
      if (!info || !info.url) return;
      var gid = info.subjectGids && info.subjectGids[sheetName()];
      a.href = info.url + (gid !== undefined ? '#gid=' + gid : ''); a.hidden = false;
    }).catch(function () { /* 連結只是方便 */ });
  }
  function renderPasteGuide(main, error) {
    var c = AX.card('學期總成績：貼上學校匯出的成績', '學期總成績的各領域（語文、數學、社會、自然、健體、藝術、綜合、藝才…）以學校系統匯出的「學期領域成績」為準。');
    if (error) c.appendChild(el('div', { 'class': 'note' }, error));
    var box = el('div', { 'class': 'pasteBox' });
    box.appendChild(el('b', null, '怎麼做：'));
    var ol = el('ol');
    ['按下面的「建立貼上區」，會在試算表新增一張「' + sheetName() + '」工作表（已經有的話就直接用）。',
      '把學校系統匯出的學期領域成績表整份複製，貼到那張工作表的 A1。標題列、班級、名次、平均欄位都不用刪，系統會自己找「座號」「姓名」和各領域欄位，「名次」「平均」之後的內容會被忽略。',
      '回到這個頁面，按右上角「🔄 重新讀取試算表」，名單就會自動產生。'].forEach(function (t) { ol.appendChild(el('li', null, t)); });
    box.appendChild(ol);
    var bar = el('div', { 'class': 'bar noprint' }); bar.style.marginTop = '10px';
    var b = el('button', { 'class': 'primary' }, '建立貼上區「' + sheetName() + '」');
    var a = el('a', { 'class': 'link', target: '_blank', rel: 'noopener' }, '開啟這張工作表 ›'); a.hidden = true;
    b.onclick = function () {
      AX.call('createDomainSheet', st.term).then(function (res) {
        AX.toast(res.existed ? '這張工作表已經存在，請直接貼上成績' : '已建立「' + res.name + '」，請把學校匯出的成績貼到 A1');
        attachSheetLink(a);
      }).catch(AX.showError);
    };
    bar.appendChild(b); bar.appendChild(a); box.appendChild(bar);
    c.appendChild(box); main.appendChild(c);
    attachSheetLink(a);
  }
  function statusCard() {
    var P = st.parsed, c = AX.card(null);
    c.className += ' noprint';
    var line = el('div', { 'class': 'small' });
    line.appendChild(document.createTextNode('已讀到「' + sheetName() + '」：' + P.students.length + ' 位學生、' + P.domains.length + ' 個領域（' + P.domains.map(function (d) { return d.name; }).join('、') + '），標題列在第 ' + P.headerRow + ' 列。 '));
    var a = el('a', { 'class': 'link', target: '_blank', rel: 'noopener' }, '開啟貼上區 ›'); a.hidden = true; line.appendChild(a);
    c.appendChild(line); attachSheetLink(a);
    return c;
  }

  // ---- 輸出：與你原本表格一致的版面（序號｜姓名｜科目［｜進步獎姓名｜科目］）
  function tableRows() {
    var R = st.last, isFinal = st.phase === 'final';
    var n = Math.max(R.topUnique.length, isFinal ? R.progUnique.length : 0);
    var head = ['序號', '前' + st.o.topN + '名 不重複名單', '科目'].concat(isFinal ? ['進步獎 姓名', '科目'] : []);
    var rows = [head];
    for (var i = 0; i < n; i++) {
      var a = R.topUnique[i], b = isFinal ? R.progUnique[i] : null;
      rows.push([i + 1, a ? a.name : '', a ? a.subjects.join('、') : ''].concat(isFinal ? [b ? b.name : '', b ? b.subjects.join('、') : ''] : []));
    }
    return rows;
  }
  function copyTable() {
    var text = tableRows().map(function (r) { return r.join('\t'); }).join('\n');
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); AX.toast('已複製，可以貼到試算表或 Word'); } catch (e) { AX.toast('瀏覽器不允許複製，請改用「寫入試算表」', true); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { AX.toast('已複製，可以貼到試算表或 Word'); }, fallback);
    else fallback();
  }
  function writeSheet() {
    var rows = [[titleText() + ' 獎狀名單']].concat(tableRows());
    AX.call('writeAwardsSheet', titleText(), rows).then(function (res) {
      AX.toast('已寫入試算表工作表「' + res.name + '」');
      return AX.call('getSpreadsheetInfo').then(function (info) {
        if (!info || !info.url) return;
        var a = AX.$('sheetLink'); a.href = info.url + '#gid=' + res.gid; a.textContent = '開啟「' + res.name + '」›'; a.hidden = false;
      }).catch(function () { /* 連結只是方便，失敗不影響 */ });
    }).catch(AX.showError);
  }
})();
</script>
