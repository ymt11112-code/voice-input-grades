<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成績歷程</title>
  <link rel="stylesheet" href="analysis-common.css">
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a href="Dashboard.html">全班概況</a>
      <a href="Personal.html">個人概況</a>
      <a class="on" href="Progress.html">成績歷程</a>
      <a href="Report.html">家長報告</a>
      <a href="Attention.html">關注名單</a>
      <a href="Awards.html">獎狀名單</a>
      <a href="Missing.html">缺分紀錄</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span id="tabBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">成績依據</span><span id="basisBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">總平均納入</span><span id="subjBtns" class="grp"></span></span>
    </div>
    <div class="bar" id="bar2"></div>
    <div id="main"></div>
  </div>
</div>

<script src="analysis-stats.js"></script>
<script src="analysis-demo.js"></script>
<script src="analysis-common.js"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt, sg = S.signed;
  // 科目固定配色（顏色跟著科目走，不會因為勾選的科目變動而改變）
  var PALETTE = ['#2a78d6', '#eb6834', '#2a9d6a', '#8a5fd0', '#c99a12', '#d6459b', '#0e9aa7', '#7a8b99'];
  var st = { raw: null, model: null, M: null, tab: 'person', basis: 'term', subs: null, key: null, cmpIdx: null, th: 5, sort: 'seat' };

  AX.shell();
  AX.onResize(function () { if (st.M) renderMain(); });

  AX.load().then(function (r) {
    st.raw = r.raw; st.model = r.model;
    var q = AX.qs();
    if (q.tab === 'class') st.tab = 'class';
    if (q.basis === 'exam') st.basis = 'exam';
    if (!st.model.roster.length) { AX.$('main').appendChild(el('div', { 'class': 'card empty' }, '試算表還沒有學生名單，請先到「登記分數」面板建立。')); return; }
    st.key = q.key && st.model.roster.some(function (x) { return x.key === q.key; }) ? q.key : st.model.roster[0].key;
    rebuild(); renderBars(); renderMain();
  }).catch(AX.showError);

  // 有匯入歷史成績時，預設只把「歷史成績也有的科目」算進總平均（例如歷史只有國數社自，就不把英語算進去），這樣各階段的總平均才是同一口徑
  function effSubs(M0) {
    if (st.subs) return st.subs;
    if (M0.histSubjects.length) { var x = M0.subjects.filter(function (n) { return M0.histSubjects.indexOf(n) > -1; }); if (x.length) return x; }
    return null;
  }
  function rebuild() {
    var M0 = S.stageMatrix(st.model, { basis: st.basis });
    st.effSubs = effSubs(M0);
    st.M = st.effSubs ? S.stageMatrix(st.model, { basis: st.basis, subjects: st.effSubs }) : M0;
    // 全班名次進退的「典型幅度」：所有同學、相鄰階段的名次變動取中位數
    var ds = [];
    for (var k = 1; k < st.M.stages.length; k++) {
      var a = st.M.stages[k - 1].overall.rank, b = st.M.stages[k].overall.rank;
      for (var r = 0; r < a.length; r++) if (a[r] != null && b[r] != null) ds.push(Math.abs(a[r] - b[r]));
    }
    ds.sort(function (x, y) { return x - y; });
    st.typ = ds.length ? { median: ds[ds.length >> 1], p80: ds[Math.min(ds.length - 1, Math.floor(ds.length * 0.8))], n: ds.length } : null;
  }
  // 學年分組（圖表底部標示 113學年、114學年…，提醒年級與課程換了一輪）
  function yearGroups(labels) {
    var out = [];
    st.M.stages.forEach(function (s, i) { var y = S.yearOf(s.term); if (out.length && out[out.length - 1].y === y) out[out.length - 1].to = i; else out.push({ y: y, from: i, to: i, label: y + '學年' }); });
    return out.length > 1 ? out : null;
  }
  function colorOf(name) { var i = st.M.subjects.indexOf(name); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; }
  function rIdx() { for (var i = 0; i < st.model.roster.length; i++) if (st.model.roster[i].key === st.key) return i; return 0; }

  // ---------- 控制列 ----------
  function renderBars() {
    AX.btnGroup(AX.$('tabBtns'), [{ label: '個人歷程', value: 'person' }, { label: '全班進退步', value: 'class' }], st.tab, function (v) { st.tab = v; renderBars(); renderMain(); });
    AX.btnGroup(AX.$('basisBtns'), [{ label: '定期考查總成績', value: 'term' }, { label: '段考分數', value: 'exam' }], st.basis, function (v) { st.basis = v; rebuild(); st.cmpIdx = null; renderBars(); renderMain(); });
    var box = AX.$('subjBtns'); AX.clear(box);
    st.M.subjects.forEach(function (n) {
      var on = !st.effSubs || st.effSubs.indexOf(n) > -1, b = el('button', { 'class': on ? 'on' : '' }, n);
      b.onclick = function () {
        var cur = st.effSubs ? st.effSubs.slice() : st.M.subjects.slice(), i = cur.indexOf(n);
        if (i > -1) { if (cur.length > 1) cur.splice(i, 1); } else cur.push(n);
        st.subs = cur;
        rebuild(); renderBars(); renderMain();
      };
      box.appendChild(b);
    });
    var bar2 = AX.$('bar2'); AX.clear(bar2);
    if (st.tab === 'person') {
      var g = el('span', { 'class': 'grp' });
      g.appendChild(el('span', { 'class': 'lbl' }, '學生'));
      var prev = el('button', { title: '上一位' }, '◀'), next = el('button', { title: '下一位' }, '▶'), sel = el('select');
      st.model.roster.forEach(function (x) { var o = el('option', { value: x.key }, AX.seatLabel(x)); if (x.key === st.key) o.selected = true; sel.appendChild(o); });
      sel.onchange = function () { st.key = sel.value; renderMain(); };
      function step(d) { var n = st.model.roster.length, i = (rIdx() + d + n) % n; st.key = st.model.roster[i].key; sel.value = st.key; renderMain(); }
      prev.onclick = function () { step(-1); }; next.onclick = function () { step(1); };
      g.appendChild(prev); g.appendChild(sel); g.appendChild(next); bar2.appendChild(g);
    } else if (st.M.stages.length > 1) {
      if (st.cmpIdx == null || st.cmpIdx < 1 || st.cmpIdx >= st.M.stages.length) st.cmpIdx = st.M.stages.length - 1;
      var g2 = el('span', { 'class': 'grp' });
      g2.appendChild(el('span', { 'class': 'lbl' }, '比較'));
      var s2 = el('select');
      st.M.stages.forEach(function (x, i) { if (i === 0) return; var o = el('option', { value: i }, x.label + '（相比 ' + st.M.stages[i - 1].label + '）'); if (i === st.cmpIdx) o.selected = true; s2.appendChild(o); });
      s2.onchange = function () { st.cmpIdx = Number(s2.value); renderMain(); };
      g2.appendChild(s2); bar2.appendChild(g2);
      var g3 = el('span', { 'class': 'grp' });
      g3.appendChild(el('span', { 'class': 'lbl' }, '名次進退達'));
      var th = el('input', { type: 'number', min: '1', max: '30', style: 'width:64px' }); th.value = st.th;
      th.onchange = function () { var v = Number(th.value); st.th = v >= 1 ? v : 5; renderMain(); };
      g3.appendChild(th); g3.appendChild(el('span', { 'class': 'lbl' }, '名以上標示「進步多／退步多」'));
      bar2.appendChild(g3);
      var g4 = el('span', { 'class': 'grp' });
      g4.appendChild(el('span', { 'class': 'lbl' }, '排序'));
      var s4 = el('select');
      [['seat', '依座號'], ['rank', '依名次'], ['up', '進步最多在前'], ['down', '退步最多在前']].forEach(function (x) { var o = el('option', { value: x[0] }, x[1]); if (x[0] === st.sort) o.selected = true; s4.appendChild(o); });
      s4.onchange = function () { st.sort = s4.value; renderMain(); };
      g4.appendChild(s4); bar2.appendChild(g4);
    }
    bar2.hidden = !bar2.firstChild;
  }

  // ---------- 主畫面 ----------
  function renderMain() {
    var main = AX.$('main'); AX.clear(main);
    try { history.replaceState(null, '', AX.pageUrl('Progress.html', { tab: st.tab === 'class' ? 'class' : '', basis: st.basis === 'exam' ? 'exam' : '', key: st.key })); } catch (e) { /* 忽略 */ }
    var M = st.M;
    if (!M.stages.length) {
      main.appendChild(el('div', { 'class': 'card empty' }, st.basis === 'term' ? '還沒有完成的定期考查（期中考或期末考還沒有成績）。可以改看「段考分數」，或在下方匯入前幾學年的歷史成績。' : '還沒有任何期中考或期末考的成績，登記後這裡就會出現歷程。'));
    } else {
      if (st.basis === 'exam' && st.model.history.length) main.appendChild(el('div', { 'class': 'card note' }, '目前看的是「段考分數」，歷史成績是學校算好的定期考查總成績（平時＋段考），口徑不同，所以沒有納入。要連同前幾學年一起看，請改選「定期考查總成績」。'));
      if (st.tab === 'person') renderPerson(main); else renderClass(main);
    }
    renderHistoryCard(main);
  }

  // ===== 歷史成績匯入與管理 =====
  function renderHistoryCard(main) {
    var H = st.model.history || [], det = el('details', { 'class': 'card' });
    var stages = {}, order = [];
    H.forEach(function (h) { var k = h.term + '|' + h.p; if (!stages[k]) { stages[k] = { term: h.term, p: h.p, n: {}, rows: 0 }; order.push(k); } stages[k].n[h.name] = true; stages[k].rows++; });
    order.sort(function (a, b) { return (S.termKey(stages[a].term) - S.termKey(stages[b].term)) || (stages[a].p - stages[b].p); });
    var sm = el('summary', { style: 'cursor:pointer;font-weight:600' }, '歷史成績（前幾學年）' + (order.length ? '：已匯入 ' + order.length + ' 個階段' : '：尚未匯入'));
    det.appendChild(sm);
    det.appendChild(el('p', { 'class': 'sub' }, '把前幾學年學校算好的「定期考查總成績」（平時＋段考）貼進來，就能和目前學期一起比較長期的成績與名次。用「姓名」對應同學；請貼進當時全班（包含後來轉出的同學），名次才會和當時一致。分數是 0 或空白的視為沒有成績。'));
    if (order.length) {
      var ul = el('div', { 'class': 'chips' });
      order.forEach(function (k) {
        var s = stages[k], chip = el('span', { 'class': 'chip' }, s.term + (s.p === 1 ? '中' : '末') + '　' + Object.keys(s.n).length + ' 人 ');
        var del = el('button', { 'class': 'danger', title: '刪除這個階段的歷史成績' }, '刪除');
        del.onclick = function () {
          if (!confirm('確定要刪除「' + s.term + (s.p === 1 ? '期中' : '期末') + '」的歷史成績嗎？')) return;
          AX.call('deleteHistoryStage', s.term, s.p).then(function (h) { st.model.history = h; st.raw.history = h; rebuild(); renderBars(); renderMain(); AX.toast('已刪除'); }).catch(AX.showError);
        };
        chip.appendChild(del); ul.appendChild(chip);
      });
      det.appendChild(ul);
    }
    var bar = el('div', { 'class': 'bar', style: 'margin-top:10px' });
    var tIn = el('input', { type: 'text', placeholder: '例如 113上', style: 'width:90px' }), pSel = el('select');
    [['1', '期中'], ['2', '期末']].forEach(function (x) { pSel.appendChild(el('option', { value: x[0] }, x[1])); });
    var g1 = el('span', { 'class': 'grp' }); g1.appendChild(el('span', { 'class': 'lbl' }, '貼上的表沒有「學期、階段」欄時，套用：')); g1.appendChild(tIn); g1.appendChild(pSel); bar.appendChild(g1);
    det.appendChild(bar);
    var ta = el('textarea', { rows: '8', style: 'width:100%;font-size:13px', placeholder: ['從 Excel 複製後貼上。第一列要有標題，至少要有「姓名」和科目欄（國語、數學…）。', '可以一次貼多個階段：加上「學期」「階段」兩欄（階段寫 中 或 末）。', '學期\t階段\t姓名\t國語\t數學\t社會\t自然', '113上\t中\t王小明\t92.5\t95\t90\t93'].join('\n') });
    det.appendChild(ta);
    var msg = el('p', { 'class': 'sub' }, ''), act = el('div', { 'class': 'bar' });
    var parseBtn = el('button', null, '檢查內容'), goBtn = el('button', { 'class': 'on' }, '匯入');
    goBtn.disabled = true; var parsed = null;
    function doParse() {
      parsed = S.parseHistory(ta.value, tIn.value.trim(), pSel.value);
      var names = {}; parsed.rows.forEach(function (r) { names[r.name] = true; });
      var inRoster = {}; st.model.roster.forEach(function (r) { inRoster[r.name] = true; });
      var out = Object.keys(names).filter(function (n) { return !inRoster[n]; });
      var txt = parsed.errors.length ? '⚠ ' + parsed.errors.slice(0, 3).join('；') + (parsed.errors.length > 3 ? ' …' : '') : '';
      if (parsed.rows.length) txt += (txt ? '\n' : '') + '找到 ' + parsed.stages + ' 個階段、' + Object.keys(names).length + ' 位同學、科目：' + parsed.subjects.join('、') + '，共 ' + parsed.rows.length + ' 筆成績。' +
        (out.length ? '\n不在目前名單的姓名（' + out.length + ' 位，仍會算進當時全班名次）：' + out.join('、') + '。如果其中有人只是名字寫法不同（例如錯字），請先改成目前名單的寫法再匯入。' : '');
      msg.style.whiteSpace = 'pre-wrap'; msg.textContent = txt || '沒有讀到成績。'; goBtn.disabled = !parsed.rows.length;
    }
    parseBtn.onclick = doParse;
    goBtn.onclick = function () {
      if (!parsed || !parsed.rows.length) return;
      if (!confirm('匯入 ' + parsed.stages + ' 個階段、' + parsed.rows.length + ' 筆成績？同一學期＋階段原有的歷史成績會被取代。')) return;
      AX.call('importHistory', parsed.rows).then(function (res) { st.model.history = res.history; st.raw.history = res.history; ta.value = ''; rebuild(); renderBars(); renderMain(); AX.toast('已匯入 ' + res.imported + ' 筆'); }).catch(AX.showError);
    };
    act.appendChild(parseBtn); act.appendChild(goBtn); det.appendChild(act); det.appendChild(msg);
    if (!order.length) det.open = true;
    main.appendChild(det);
  }

  function rkText(r) { return r == null ? '—' : String(r); }
  function moveCell(prev, cur) { // 名次進退（數字變小＝進步）
    if (prev == null || cur == null) return { text: '—', cls: '' };
    var d = prev - cur;
    return { text: d > 0 ? '▲' + d : (d < 0 ? '▼' + (-d) : '＝'), cls: d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'), d: d };
  }

  // ===== 個人歷程 =====
  function renderPerson(main) {
    var M = st.M, r = rIdx(), who = st.model.roster[r], J = S.studentJourney(M, r), rows = J.rows;
    var basisName = st.basis === 'exam' ? '段考分數（期中考、期末考的得分率）' : '定期考查總成績（平時成績＋段考）';
    var head = AX.card(AX.seatLabel(who) + '・成績歷程',
      '共 ' + rows.length + ' 個階段（' + rows[0].label + ' → ' + rows[rows.length - 1].label + '）。成績依據：' + basisName + '；總平均＝' + M.stages[M.stages.length - 1].overall.names.join('、') + ' 的平均，名次是和全班比較。');
    head.style.marginBottom = '12px';
    main.appendChild(head);

    var last = rows[rows.length - 1], prevRow = rows.length > 1 ? rows[rows.length - 2] : null;
    var tiles = el('div', { 'class': 'tiles' });
    tiles.appendChild(AX.tile('最新階段・' + last.label, last.avg == null ? '—' : fmt(last.avg), last.avg == null ? '' : '分', last.avg == null ? '這個階段缺考或缺成績，沒有總平均' : '全班平均 ' + fmt(last.classMean) + '（' + sg(last.avg - last.classMean) + '）', last.avg == null ? '' : AX.cls(last.avg - last.classMean)));
    tiles.appendChild(AX.tile('總平均名次', last.rank == null ? '—' : String(last.rank), last.rank == null ? '' : '/ ' + last.n + ' 人', last.rank == null ? '' : '前 ' + S.topPercent(last.rank, last.n) + '%'));
    var mv = prevRow && last.rank != null && prevRow.rank != null ? prevRow.rank - last.rank : null;
    tiles.appendChild(AX.tile('較上一階段', mv == null ? '—' : (mv > 0 ? '▲ ' + mv : (mv < 0 ? '▼ ' + (-mv) : '＝')), mv == null ? '' : '名', prevRow && mv != null ? prevRow.label + ' 第 ' + prevRow.rank + ' 名 → 第 ' + last.rank + ' 名' : '', mv == null ? '' : AX.cls(mv, 0.5)));
    var ranks = rows.map(function (x) { return x.rank; }).filter(function (v) { return v != null; });
    tiles.appendChild(AX.tile('相對全班位置（標準分）', last.z == null ? '—' : sg(last.z, 2), '', last.z == null ? '' : '0＝全班平均；+1 約前 16%、−1 約後 16%', last.z == null ? '' : AX.cls(last.z)));
    tiles.appendChild(AX.tile('各階段平均名次', ranks.length ? fmt(S.mean(ranks)) : '—', ranks.length ? '名' : '', ranks.length ? '最好第 ' + Math.min.apply(null, ranks) + ' 名、最差第 ' + Math.max.apply(null, ranks) + ' 名' : ''));
    main.appendChild(tiles);

    // --- 分數表
    var c1 = AX.card('各階段分數', '每一格是該階段的得分（滿分 100）。最後三欄是整個歷程的個人平均、全班平均與差距。');
    var w1 = el('div', { 'class': 'tbl-wrap' }), tb1 = el('table', { 'class': 'stats' }), h1 = el('tr');
    ['科目'].concat(rows.map(function (x) { return x.label; })).concat(['個人平均', '全班平均', '差距']).forEach(function (h, i) { h1.appendChild(el('th', { 'class': i === 0 ? 'l' : '' }, h)); });
    var th1 = el('thead'); th1.appendChild(h1); tb1.appendChild(th1);
    var bd1 = el('tbody');
    J.bySubject.forEach(function (b) {
      var tr = el('tr'), td0 = el('td', { 'class': 'l' }); var dot = el('span', { 'class': 'dot' }); dot.style.background = colorOf(b.name); td0.appendChild(dot); td0.appendChild(document.createTextNode(b.name)); tr.appendChild(td0);
      rows.forEach(function (x) { var c = x.subj[b.name]; tr.appendChild(el('td', null, c && c.v != null ? fmt(c.v) : '—')); });
      tr.appendChild(el('td', null, b.avg == null ? '—' : fmt(b.avg))); tr.appendChild(el('td', null, b.classAvg == null ? '—' : fmt(b.classAvg)));
      tr.appendChild(el('td', { 'class': b.avg == null ? '' : AX.cls(b.avg - b.classAvg) }, b.avg == null ? '—' : sg(b.avg - b.classAvg)));
      bd1.appendChild(tr);
    });
    var allAvg = rows.map(function (x) { return x.avg; }).filter(function (v) { return v != null; }), allCm = rows.map(function (x) { return x.classMean; }).filter(function (v) { return v != null; });
    var trT = el('tr', { 'class': 'tot' }); trT.appendChild(el('td', { 'class': 'l' }, '總平均'));
    rows.forEach(function (x) { trT.appendChild(el('td', null, x.avg == null ? '—' : fmt(x.avg))); });
    trT.appendChild(el('td', null, allAvg.length ? fmt(S.mean(allAvg)) : '—')); trT.appendChild(el('td', null, allCm.length ? fmt(S.mean(allCm)) : '—'));
    trT.appendChild(el('td', { 'class': allAvg.length ? AX.cls(S.mean(allAvg) - S.mean(allCm)) : '' }, allAvg.length ? sg(S.mean(allAvg) - S.mean(allCm)) : '—'));
    bd1.appendChild(trT);
    tb1.appendChild(bd1); w1.appendChild(tb1); c1.appendChild(w1); main.appendChild(c1);

    // --- 名次表
    var c2 = AX.card('各階段名次', '括號是和上一階段比的進退（▲進步、▼退步，名次數字越小越好）；標色的是進退達 ' + st.th + ' 名以上。');
    var w2 = el('div', { 'class': 'tbl-wrap' }), tb2 = el('table', { 'class': 'stats' }), h2 = el('tr');
    ['科目'].concat(rows.map(function (x) { return x.label; })).concat(['平均名次']).forEach(function (h, i) { h2.appendChild(el('th', { 'class': i === 0 ? 'l' : '' }, h)); });
    var th2 = el('thead'); th2.appendChild(h2); tb2.appendChild(th2);
    var bd2 = el('tbody');
    function rankRow(label, getRank, n, color, tot) {
      var tr = el('tr', { 'class': tot ? 'tot' : '' }), td0 = el('td', { 'class': 'l' });
      if (color) { var dot = el('span', { 'class': 'dot' }); dot.style.background = color; td0.appendChild(dot); }
      td0.appendChild(document.createTextNode(label)); tr.appendChild(td0);
      var rs = [];
      rows.forEach(function (x, i) {
        var cur = getRank(x), pv = i > 0 ? getRank(rows[i - 1]) : null, td = el('td');
        if (cur == null) { td.textContent = '—'; tr.appendChild(td); return; }
        rs.push(cur);
        var m = moveCell(pv, cur);
        td.textContent = String(cur) + (pv != null && m.d ? '（' + m.text + '）' : '');
        if (m.d && Math.abs(m.d) >= st.th) td.className = m.cls;
        tr.appendChild(td);
      });
      tr.appendChild(el('td', null, rs.length ? fmt(S.mean(rs)) : '—'));
      return tr;
    }
    J.bySubject.forEach(function (b) { bd2.appendChild(rankRow(b.name, function (x) { var c = x.subj[b.name]; return c ? c.rank : null; }, 0, colorOf(b.name), false)); });
    bd2.appendChild(rankRow('總平均名次', function (x) { return x.rank; }, 0, null, true));
    tb2.appendChild(bd2); w2.appendChild(tb2); c2.appendChild(w2); main.appendChild(c2);

    // --- 標準分表（不受考卷難易、分數集中程度影響，比名次更適合看長期變化）
    var c3 = AX.card('各階段相對位置（標準分）', '標準分＝（個人成績 − 全班平均）÷ 全班標準差。0 是全班平均，+1 約在前 16%，+2 約在前 2%，負數反之。班上分數很集中時，差一兩分名次就差很多，看標準分比看名次穩定。');
    var w3 = el('div', { 'class': 'tbl-wrap' }), tb3 = el('table', { 'class': 'stats' }), h3 = el('tr');
    ['科目'].concat(rows.map(function (x) { return x.label; })).concat(['平均']).forEach(function (h, i) { h3.appendChild(el('th', { 'class': i === 0 ? 'l' : '' }, h)); });
    var th3 = el('thead'); th3.appendChild(h3); tb3.appendChild(th3);
    var bd3 = el('tbody');
    function zRow(label, getZ, color, tot) {
      var tr = el('tr', { 'class': tot ? 'tot' : '' }), td0 = el('td', { 'class': 'l' }), zs = [];
      if (color) { var dot = el('span', { 'class': 'dot' }); dot.style.background = color; td0.appendChild(dot); }
      td0.appendChild(document.createTextNode(label)); tr.appendChild(td0);
      rows.forEach(function (x) { var z = getZ(x); if (z != null) zs.push(z); tr.appendChild(el('td', { 'class': z == null ? '' : AX.cls(z, 0.25) }, z == null ? '—' : sg(z, 2))); });
      tr.appendChild(el('td', { 'class': zs.length ? AX.cls(S.mean(zs), 0.25) : '' }, zs.length ? sg(S.mean(zs), 2) : '—'));
      return tr;
    }
    J.bySubject.forEach(function (b) { bd3.appendChild(zRow(b.name, function (x) { var c = x.subj[b.name]; return c ? c.z : null; }, colorOf(b.name), false)); });
    bd3.appendChild(zRow('總平均', function (x) { return x.z; }, null, true));
    tb3.appendChild(bd3); w3.appendChild(tb3); c3.appendChild(w3); main.appendChild(c3);

    // --- 圖表
    var cols = el('div', { 'class': 'cols' }); main.appendChild(cols);
    var nMax = Math.max.apply(null, M.stages.map(function (x) { return x.overall.n; }).concat([2]));
    var maxN = Math.max.apply(null, M.stages.map(function (x) { return Math.max.apply(null, x.subjects.map(function (n) { return x.n[n]; })); }).concat([2]));
    function rankTicks(n) { var t = [1], step = n > 20 ? 5 : (n > 10 ? 3 : 2); for (var v = step; v < n; v += step) t.push(v); t.push(n); return t.filter(function (v, i, a) { return a.indexOf(v) === i; }); }
    var cA = AX.card('總平均名次變化', '往上＝名次越前面。' + (nMax ? '全班 ' + nMax + ' 人。' : '')); cols.appendChild(cA);
    var boxA = el('div'); cA.appendChild(boxA);
    AX.lineChart(boxA, {
      labels: rows.map(function (x) { return x.label; }), series: [{ name: '總平均名次', color: 'var(--series-2)', values: rows.map(function (x) { return x.rank; }) }],
      yMin: 1, yMax: nMax, ticks: rankTicks(nMax), invert: true, height: 250, noLegend: true, groups: yearGroups(), ariaLabel: '總平均名次變化',
      tipRows: function (i) { var x = rows[i]; return { title: x.label, rows: [{ color: 'var(--series-2)', name: '總平均名次', value: x.rank == null ? '—' : '第 ' + x.rank + ' 名 / ' + x.n + ' 人' }, { name: '總平均', value: x.avg == null ? '—' : fmt(x.avg) + ' 分（班平均 ' + fmt(x.classMean) + '）' }] }; }
    });
    var cB = AX.card('各科名次變化', '每條線是一個科目，往上＝名次越前面。'); cols.appendChild(cB);
    var boxB = el('div'); cB.appendChild(boxB);
    AX.lineChart(boxB, {
      labels: rows.map(function (x) { return x.label; }),
      series: J.bySubject.map(function (b) { return { name: b.name, color: colorOf(b.name), values: rows.map(function (x) { var c = x.subj[b.name]; return c ? c.rank : null; }) }; }),
      yMin: 1, yMax: maxN, ticks: rankTicks(maxN), invert: true, height: 250, groups: yearGroups(), ariaLabel: '各科名次變化',
      tipRows: function (i) { var x = rows[i]; return { title: x.label, rows: J.bySubject.map(function (b) { var c = x.subj[b.name]; return { color: colorOf(b.name), name: b.name, value: c && c.rank != null ? '第 ' + c.rank + ' 名（' + fmt(c.v) + ' 分）' : '—' }; }) }; }
    });
    var cols2 = el('div', { 'class': 'cols' }); main.appendChild(cols2);
    var all = [];
    rows.forEach(function (x) { Object.keys(x.subj).forEach(function (n) { if (x.subj[n].v != null) all.push(x.subj[n].v); if (x.subj[n].mean != null) all.push(x.subj[n].mean); }); });
    var rg = AX.niceRange(all);
    var cC = AX.card('各科成績變化', '每條線是一個科目的得分。'); cols2.appendChild(cC);
    var boxC = el('div'); cC.appendChild(boxC);
    AX.lineChart(boxC, {
      labels: rows.map(function (x) { return x.label; }),
      series: J.bySubject.map(function (b) { return { name: b.name, color: colorOf(b.name), values: rows.map(function (x) { var c = x.subj[b.name]; return c && c.v != null ? c.v : null; }) }; }),
      yMin: rg.lo, yMax: rg.hi, ticks: rg.ticks, height: 250, groups: yearGroups(), ariaLabel: '各科成績變化',
      tipRows: function (i) { var x = rows[i]; return { title: x.label, rows: J.bySubject.map(function (b) { var c = x.subj[b.name]; return { color: colorOf(b.name), name: b.name, value: c && c.v != null ? fmt(c.v) + '（班 ' + fmt(c.mean) + '）' : '—' }; }) }; }
    });
    var cD = AX.card('個人平均與全班各科平均的差距', '往右＝高於全班平均、往左＝低於。數字是「個人平均／全班平均」。'); cols2.appendChild(cD);
    var boxD = el('div'); cD.appendChild(boxD);
    var dr = J.bySubject.filter(function (b) { return b.avg != null; });
    AX.divBars(boxD, { rows: dr.map(function (b) { return { label: b.name, value: b.avg - b.classAvg, text: fmt(b.avg) + ' / ' + fmt(b.classAvg), tip: { title: b.name, rows: [{ name: '個人平均', value: fmt(b.avg) }, { name: '全班平均', value: fmt(b.classAvg) }, { name: '平均名次', value: fmt(b.rankAvg) }] } }; }), ariaLabel: '個人與全班各科平均差距' });

    // --- 重點
    var ins = AX.card('分析重點', '依這位同學全部階段的資料自動整理。');
    var ul = el('ul', { 'class': 'insights' });
    function add(t) { ul.appendChild(el('li', null, t)); }
    if (last.rank != null) add('最新階段（' + last.label + '）總平均 ' + fmt(last.avg) + ' 分，名次第 ' + last.rank + '（全班 ' + last.n + ' 人，前 ' + S.topPercent(last.rank, last.n) + '%），' + (last.avg >= last.classMean ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(last.avg - last.classMean)) + ' 分。');
    if (ranks.length >= 2) {
      var k = ranks.length, recentN = Math.min(3, Math.ceil(k / 2)), rec = S.mean(ranks.slice(k - recentN)), ear = S.mean(ranks.slice(0, k - recentN)), gap = ear - rec, need = Math.max(2, 0.08 * nMax);
      add('名次趨勢：最近 ' + recentN + ' 個階段平均第 ' + fmt(rec) + ' 名，之前平均第 ' + fmt(ear) + ' 名，' + (gap >= need ? '整體在進步。' : (gap <= -need ? '整體在退步，值得留意。' : '大致持平。')));
      var zr = rows.map(function (x) { return x.z; }).filter(function (v) { return v != null; });
      if (zr.length >= 4) {
        var zN = Math.min(3, Math.floor(zr.length / 2)), zRec = S.mean(zr.slice(zr.length - zN)), zEar = S.mean(zr.slice(0, zr.length - zN)), zg = zRec - zEar;
        add('標準分趨勢：最近 ' + zN + ' 個階段平均 ' + sg(zRec, 2) + '，之前平均 ' + sg(zEar, 2) + '，' + (Math.abs(zg) < 0.3 ? '相對全班的位置沒有明顯改變。' : (zg > 0 ? '相對全班的位置有' : '相對全班的位置有') + (zg > 0 ? '上升（約 ' : '下降（約 ') + fmt(Math.abs(zg), 2) + ' 個標準差）。' + (Math.abs(zg) >= 0.5 ? '這是比較明確的變化。' : '幅度不大，再觀察一兩次。')));
      }
      var avgR = S.mean(ranks), pos = avgR / nMax, band = pos <= 0.2 ? '前段（前 20%）' : (pos <= 0.4 ? '中前段' : (pos <= 0.6 ? '中段' : (pos <= 0.8 ? '中後段' : '後段（後 20%）')));
      add('長期位置：全部階段平均名次第 ' + fmt(avgR) + ' 名（全班約 ' + nMax + ' 人），大致落在' + band + '。多個階段平均下來，這個位置比任何單一次的名次都可靠。');
      if (st.typ && prevRow && last.rank != null && prevRow.rank != null) {
        var lastMove = Math.abs(prevRow.rank - last.rank);
        add('最近一次名次變動 ' + lastMove + ' 名；全班各階段之間名次變動的中位數是 ' + st.typ.median + ' 名，約 80% 的變動在 ' + st.typ.p80 + ' 名以內。' + (lastMove <= st.typ.median ? '屬於正常波動，不必特別解讀。' : (lastMove <= st.typ.p80 ? '略大於一般波動，但還在常見範圍。' : '明顯大於一般波動，值得了解當次的狀況。')));
      }
      var sdv = S.sd(ranks); add('名次穩定度：標準差 ' + fmt(sdv) + ' 名，' + (sdv <= Math.max(2, 0.08 * nMax) ? '表現穩定。' : '各階段起伏' + (sdv >= 0.2 * nMax ? '很大' : '較明顯') + '。'));
      var best = null, worst = null;
      rows.forEach(function (x) { if (x.rank == null) return; if (!best || x.rank < best.rank) best = x; if (!worst || x.rank > worst.rank) worst = x; });
      if (best && worst && best !== worst) add('名次最好的是 ' + best.label + '（第 ' + best.rank + ' 名），最差的是 ' + worst.label + '（第 ' + worst.rank + ' 名）。');
    }
    var bs = dr.slice().sort(function (a, b) { return (b.avg - b.classAvg) - (a.avg - a.classAvg); });
    if (bs.length >= 2) {
      var top = bs[0], bot = bs[bs.length - 1];
      add('相對全班最強的科目是「' + top.name + '」（高於全班平均 ' + fmt(top.avg - top.classAvg) + ' 分，平均名次 ' + fmt(top.rankAvg) + '）；相對最弱的是「' + bot.name + '」（' + (bot.avg >= bot.classAvg ? '高於' : '低於') + '全班平均 ' + fmt(Math.abs(bot.avg - bot.classAvg)) + ' 分，平均名次 ' + fmt(bot.rankAvg) + '）。');
    }
    var swing = null;
    J.bySubject.forEach(function (b) {
      for (var i = 1; i < rows.length; i++) {
        var a = rows[i - 1].subj[b.name], c = rows[i].subj[b.name];
        if (!a || !c || a.rank == null || c.rank == null) continue;
        var dd = a.rank - c.rank;
        if (!swing || Math.abs(dd) > Math.abs(swing.d)) swing = { name: b.name, from: rows[i - 1].label, to: rows[i].label, a: a.rank, c: c.rank, d: dd };
      }
    });
    if (swing && Math.abs(swing.d) >= Math.max(4, 0.15 * maxN)) add('單科起伏最大的是「' + swing.name + '」：' + swing.from + ' 第 ' + swing.a + ' 名 → ' + swing.to + ' 第 ' + swing.c + ' 名（' + (swing.d > 0 ? '進步 ' : '退步 ') + Math.abs(swing.d) + ' 名）。' + (swing.d < 0 ? '建議了解當次是否有特殊狀況。' : ''));
    if (rows.some(function (x) { return x.rank == null; })) add('有些階段因為缺考或缺成績，沒有總平均與名次（表格中顯示「—」）。');
    ins.appendChild(ul); main.appendChild(ins);
  }

  // ===== 全班進退步 =====
  function renderClass(main) {
    var M = st.M, n = M.stages.length;
    if (n < 2) { main.appendChild(el('div', { 'class': 'card empty' }, '至少要有兩個階段（例如期中考、期末考）的成績，才能比較進退步。')); return; }
    var ci = st.cmpIdx == null ? n - 1 : st.cmpIdx, cur = M.stages[ci], prv = M.stages[ci - 1], R = M.roster.length;
    var recs = [];
    for (var r = 0; r < R; r++) {
      var a = prv.overall.rank[r], b = cur.overall.rank[r], pa = prv.overall.avg[r], pb = cur.overall.avg[r];
      var dRank = a != null && b != null ? a - b : null;   // 正＝進步
      recs.push({ r: r, who: M.roster[r], rank: b, prevRank: a, avg: pb, prevAvg: pa, d: dRank, dAvg: pa != null && pb != null ? pb - pa : null });
    }
    var comp = recs.filter(function (x) { return x.d != null; });
    var up = comp.filter(function (x) { return x.d > 0; }).length, dn = comp.filter(function (x) { return x.d < 0; }).length;
    var upMany = comp.filter(function (x) { return x.d >= st.th; }), dnMany = comp.filter(function (x) { return x.d <= -st.th; });
    var head = AX.card(cur.label + ' 相比 ' + prv.label + '：名次進退', '總平均＝' + cur.overall.names.join('、') + ' 的平均（' + (st.basis === 'exam' ? '段考分數' : '定期考查總成績') + '）。名次數字變小＝進步。兩個階段都有總平均的 ' + comp.length + ' 位同學納入比較。');
    head.appendChild(AX.chips([['進步', up + ' 人'], ['退步', dn + ' 人'], ['不變', (comp.length - up - dn) + ' 人'], ['進步多（≥' + st.th + ' 名）', upMany.length + ' 人'], ['退步多（≥' + st.th + ' 名）', dnMany.length + ' 人'], ['全班總平均', fmt(cur.overall.classMean) + '（' + sg(cur.overall.classMean - prv.overall.classMean) + '）']].concat(st.typ ? [['名次變動中位數', st.typ.median + ' 名'], ['80% 的變動在', st.typ.p80 + ' 名內']] : [])));
    if (st.typ) head.appendChild(el('p', { 'class': 'sub', style: 'margin-top:8px' }, '提醒：全班各階段之間，名次變動的中位數是 ' + st.typ.median + ' 名，約 80% 的變動在 ' + st.typ.p80 + ' 名以內；班上分數越集中，小幅度的分數差就會造成越大的名次起伏。只有明顯超過這個幅度、或連續多次同方向的變動，才值得當作進步或退步來解讀。'));
    main.appendChild(head);

    var list = recs.slice();
    if (st.sort === 'rank') list.sort(function (a, b) { return (a.rank == null) - (b.rank == null) || a.rank - b.rank; });
    else if (st.sort === 'up') list.sort(function (a, b) { return (b.d == null ? -999 : b.d) - (a.d == null ? -999 : a.d); });
    else if (st.sort === 'down') list.sort(function (a, b) { return (a.d == null ? 999 : a.d) - (b.d == null ? 999 : b.d); });
    var subs = cur.subjects.filter(function (nm) { return prv.subjects.indexOf(nm) > -1; });
    var c = AX.card('全班名次進退表', '點姓名可以看那位同學的完整歷程。各科欄位是該科名次的進退（▲進步、▼退步）。標色的是進退達 ' + st.th + ' 名以上。');
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' }), hr = el('tr');
    ['座號 姓名', '總平均', '名次', '上一階段名次', '名次進退', '分數進退', '標示'].concat(subs).forEach(function (h, i) { hr.appendChild(el('th', { 'class': i === 0 ? 'l' : '' }, h)); });
    var thd = el('thead'); thd.appendChild(hr); tb.appendChild(thd);
    var body = el('tbody');
    list.forEach(function (x) {
      var tr = el('tr'), td0 = el('td', { 'class': 'l' });
      var a = el('a', { 'class': 'link', href: '#', title: '看個人歷程' }, AX.seatLabel(x.who));
      a.onclick = function (ev) { ev.preventDefault(); st.key = x.who.key; st.tab = 'person'; renderBars(); renderMain(); window.scrollTo(0, 0); };
      td0.appendChild(a); tr.appendChild(td0);
      tr.appendChild(el('td', null, x.avg == null ? '—' : fmt(x.avg)));
      tr.appendChild(el('td', null, rkText(x.rank)));
      tr.appendChild(el('td', null, rkText(x.prevRank)));
      var mvv = moveCell(x.prevRank, x.rank);
      tr.appendChild(el('td', { 'class': mvv.cls }, mvv.text));
      tr.appendChild(el('td', { 'class': x.dAvg == null ? '' : AX.cls(x.dAvg) }, x.dAvg == null ? '—' : sg(x.dAvg)));
      var flag = x.d == null ? (x.rank == null || x.prevRank == null ? '缺考／缺成績' : '') : (x.d >= st.th ? '進步多' : (x.d <= -st.th ? '退步多' : ''));
      tr.appendChild(el('td', { 'class': flag === '進步多' ? 'up' : (flag === '退步多' ? 'down' : 'muted') }, flag));
      subs.forEach(function (nm) {
        var m2 = moveCell(prv.ranks[nm][x.r], cur.ranks[nm][x.r]);
        tr.appendChild(el('td', { 'class': m2.d && Math.abs(m2.d) >= st.th ? m2.cls : 'muted' }, m2.text));
      });
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap); main.appendChild(c);

    // 進步多／退步多的名單摘要
    var cols = el('div', { 'class': 'cols' }); main.appendChild(cols);
    function listCard(title, arr, sub) {
      var cc = AX.card(title, sub); cols.appendChild(cc);
      if (!arr.length) { cc.appendChild(el('p', { 'class': 'muted small' }, '沒有達到門檻的同學。')); return; }
      cc.appendChild(AX.studentList(arr.map(function (x) { return { label: AX.seatLabel(x.who), href: AX.pageUrl('Progress.html', { key: x.who.key }), rank: x.rank, value: '第 ' + x.prevRank + ' → 第 ' + x.rank + ' 名（' + (x.d > 0 ? '▲' : '▼') + Math.abs(x.d) + '）' }; })));
    }
    listCard('進步多（可作為進步獎參考）', upMany.slice().sort(function (a, b) { return b.d - a.d; }), '名次進步 ' + st.th + ' 名以上，依進步幅度排列。');
    listCard('退步多（建議關心）', dnMany.slice().sort(function (a, b) { return a.d - b.d; }), '名次退步 ' + st.th + ' 名以上，依退步幅度排列。');
  }
})();
