<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全班成績概況</title>
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="analysis-common.css?v=20261127">
  <style>
    .wrow { display: grid; grid-template-columns: 9em 1fr; gap: 4px 12px; padding: 9px 0; border-bottom: 2px dotted var(--line); align-items: baseline; }
    .wrow:last-of-type { border-bottom: none; }
    .wrow .who { font-size: 15px; }
    .wrow .ls > div { font-size: 14px; padding: 2px 0; line-height: 1.5; }
    .wrow .ls .sj { font-weight: 700; margin-right: 6px; }
    .wrow .ls .ty { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
    .wrow .ls .hi { color: var(--high); }
    @media (max-width: 640px) { .wrow { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a class="on" href="Dashboard.html">全班概況</a>
      <a href="Personal.html">個人概況</a>
      <a href="Gradebook.html">成績總表</a>
      <a href="Progress.html">成績歷程</a>
      <a href="Report.html">家長報告</a>
      <a href="Attention.html">關注名單</a>
      <a href="Awards.html">獎狀名單</a>
      <a href="Missing.html">缺分紀錄</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span class="lbl">科目</span><span id="subjectBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">學期</span><span id="termBtns" class="grp"></span></span>
      <span class="grp" id="periodWrap" hidden><span class="lbl">定期考查</span><span id="periodBtns" class="grp"></span></span>
      <span class="grp" id="catWrap"><span class="lbl">測驗類別</span><span id="catBtns" class="grp"></span></span>
      <span class="spacer"></span>
      <button id="settingsBtn">⚙️ 分析設定</button>
    </div>
    <div class="card" id="settings" hidden></div>
    <div id="main"></div>
  </div>
</div>

<script src="analysis-stats.js?v=20261127"></script>
<script src="analysis-demo.js?v=20261127"></script>
<script src="analysis-art.js?v=20261127"></script>
<script src="analysis-common.js?v=20261127"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el, fmt = S.fmt, sg = S.signed, ALL = '*';
  var st = { raw: null, model: null, subject: null, term: null, cats: null, pick: -1, sort: 'seat', attAll: {}, period: 0 };

  AX.shell();
  AX.onResize(function () { if (st.model) renderMain(); });
  AX.$('settingsBtn').onclick = function () { var b = AX.$('settings'); b.hidden = !b.hidden; };

  function load(keep) {
    AX.load().then(function (r) {
      st.raw = r.raw; st.model = r.model;
      var q = AX.qs();
      var names = st.model.subjects.map(function (s) { return s.name; });
      // 預設一次看全部科目（只有一科時直接看那一科）；網址指定科目時看那一科
      if (!keep || (st.subject !== ALL && names.indexOf(st.subject) === -1)) st.subject = names.indexOf(q.subject) > -1 ? q.subject : (names.length > 1 ? ALL : names[0]);
      renderSettings();
      if (!st.subject) { AX.$('main').appendChild(el('div', { 'class': 'card empty' }, '試算表還沒有任何科目，請先到「登記分數」面板建立。')); return; }
      pickDefaultTerm(keep);
      renderBar(); renderMain();
    }).catch(AX.showError);
  }
  function renderSettings() {
    AX.renderSettings(AX.$('settings'), { raw: st.raw, model: st.model, showAlert: false, onChange: function () { load(true); } });
  }
  function sm() { return st.subject === ALL ? null : S.subjectOf(st.model, st.subject); }
  function pickDefaultTerm(keep) {
    if (st.subject === ALL) {   // 全部科目：學期只能選單一學期
      if (keep && st.term !== ALL && st.model.terms.indexOf(st.term) > -1) return;
      st.term = S.defaultTerm(st.model, null); st.cats = null; st.pick = -1; st.period = 0;
      return;
    }
    var s = sm();
    if (keep && (st.term === ALL ? s.terms.length > 1 : s.terms.indexOf(st.term) > -1)) return;
    st.term = S.defaultTerm(st.model, s);
    st.cats = null; st.pick = -1;
  }
  load(false);

  // ---------- 列 ----------
  function renderBar() {
    var s = sm(), isAllSub = st.subject === ALL;
    var subItems = st.model.subjects.map(function (x) { return { label: x.name, value: x.name }; });
    if (subItems.length > 1) subItems.unshift({ label: '全部科目', value: ALL });
    AX.btnGroup(AX.$('subjectBtns'), subItems, st.subject, function (v) {
      var keepTerm = st.subject === ALL || v === ALL;   // 在「全部科目」與單科之間切換時，盡量保留學期
      st.subject = v; st.cats = null; st.pick = -1; pickDefaultTerm(keepTerm); renderBar(); renderMain();
    });
    var items = isAllSub ? st.model.terms.map(function (t) { return { label: S.termLabel(t), value: t }; }) : s.terms.map(function (t) { return { label: S.termLabel(t), value: t }; });
    if (!isAllSub && s.terms.length > 1) items.push({ label: '全部學期', value: ALL });
    AX.btnGroup(AX.$('termBtns'), items, st.term, function (v) { st.term = v; st.cats = null; st.pick = -1; st.period = 0; renderBar(); renderMain(); });
    // 定期考查：只有「全部科目」總覽會用到，選期中考或期末考
    AX.$('periodWrap').hidden = !isAllSub;
    if (isAllSub) AX.btnGroup(AX.$('periodBtns'), [{ label: '期中考', value: 1 }, { label: '期末考', value: 2 }], curPeriod(), function (v) { st.period = v; renderBar(); renderMain(); });
    renderCatBtns();
  }
  function scope() {
    var s = sm();
    if (st.term === ALL) return { A: s.all, T: null, isAll: true };
    var bt = s.byTerm[st.term];
    return bt ? { A: bt.A, T: bt.T, isAll: false } : null;
  }
  function renderCatBtns() {
    if (st.subject === ALL) { AX.$('catWrap').hidden = true; return; }
    var sc = scope(), box = AX.$('catBtns'); AX.clear(box);
    var cats = [];
    if (sc) sc.A.quiz.forEach(function (q) { if (cats.indexOf(q.category) === -1) cats.push(q.category); });
    AX.$('catWrap').hidden = cats.length < 2;
    if (st.cats) st.cats = st.cats.filter(function (c) { return cats.indexOf(c) > -1; });
    if (st.cats && !st.cats.length) st.cats = null;
    var items = [{ label: '全部', value: ALL }].concat(cats.map(function (c) { return { label: c || '（未分類）', value: c }; }));
    box.appendChild(el('span'));
    items.forEach(function (it) {
      var on = it.value === ALL ? !st.cats : (st.cats && st.cats.indexOf(it.value) > -1);
      var b = el('button', { 'class': on ? 'on' : '' }, it.label);
      b.onclick = function () {
        if (it.value === ALL) st.cats = null;
        else { var cur = st.cats ? st.cats.slice() : [], i = cur.indexOf(it.value); if (i > -1) cur.splice(i, 1); else cur.push(it.value); st.cats = cur.length ? cur : null; }
        st.pick = -1; renderCatBtns(); renderMain();
      };
      box.appendChild(b);
    });
  }

  function personalUrl(idx, term) {
    var s = sm();
    return AX.pageUrl('Personal.html', { subject: st.subject, key: s.keys[idx], term: term });
  }
  function slist(rows, term) { // rows: [{idx, rank, value}]
    var s = sm();
    return AX.studentList(rows.map(function (r) {
      return { label: AX.seatLabel(s.data.students[r.idx]), href: personalUrl(r.idx, term), rank: r.rank, value: r.value };
    }));
  }

  // ---------- 主畫面 ----------
  function renderMain() {
    var main = AX.$('main'); AX.clear(main);
    if (st.subject === ALL) { renderAll(main); return; }
    var s = sm(), sc = scope();
    var N = s.data.students.length;
    if (!N) { main.appendChild(el('div', { 'class': 'card empty' }, '這個科目還沒有學生名單。')); return; }
    if (!sc) { main.appendChild(el('div', { 'class': 'card empty' }, '這個科目在所選學期還沒有登記任何成績。')); return; }
    var A = sc.A, T = sc.T;
    var qs = A.quiz.filter(function (q) { return !st.cats || st.cats.indexOf(q.category) > -1; });
    if (!qs.length && !A.homework.length) {
      main.appendChild(el('div', { 'class': 'card empty' }, '這個學期還沒有登記任何成績（或所有類別都設成「不分析」）。'));
      renderCrossTerm(main); renderCrossSubject(main); return;
    }
    if (st.pick >= qs.length) st.pick = -1;
    var agg = S.studentAgg(A, st.cats);
    var term = sc.isAll ? null : st.term;

    // ---- 1. 需關注名單（老師打開這頁最想知道的事，放最上面）
    renderWatch(main, qs, agg, sc, term);

    // ---- 數據卡
    var tiles = el('div', { 'class': 'tiles' });
    if (T && T.stats.n) {
      var below = T.scores.filter(function (v) { return v != null && v < A.passPct; }).length;
      tiles.appendChild(AX.tile('學期成績平均', fmt(T.stats.mean), '分', '中位數 ' + fmt(T.stats.median) + '・不及格 ' + below + ' 人'));
    }
    if (qs.length) {
      var last = qs[qs.length - 1], prev = qs.length > 1 ? qs[qs.length - 2] : null;
      var dl = prev ? last.pctStats.mean - prev.pctStats.mean : null;
      tiles.appendChild(AX.tile('最近一次：' + last.name, fmt(last.pctStats.mean), '% 得分率',
        dl == null ? '平均 ' + fmt(last.stats.mean) + ' 分' : '較前次 ' + sg(dl) + ' 個百分點', dl == null ? '' : AX.cls(dl)));
      if (!T) tiles.appendChild(AX.tile('累計平均得分率', fmt(agg.stats.mean), '%', '中位數 ' + fmt(agg.stats.median) + '%・' + qs.length + ' 次測驗'));
    }
    // 各類測驗平均（例如國語的聽考、國卷）：每個類別各一塊，期中考、期末考另外看
    quizCatStats(A).forEach(function (g) {
      tiles.appendChild(AX.tile((g.cat || '（未分類）') + '測驗平均', fmt(g.mean), '分', g.n + ' 次・最近一次 ' + g.last.name + '：' + fmt(g.last.pctStats.mean) + '（換算 100 分）'));
    });
    // 作業：除了國語的筆記看總分，其餘都看平均（每一項換算成 100 分的平均，項目數不同也能比）
    A.homework.forEach(function (h) { tiles.appendChild(hwTile(st.subject, h)); });
    main.appendChild(tiles);
    if (qs.some(function (q) { return q.maxAssumed; })) main.appendChild(el('div', { 'class': 'note' }, '部分項目沒有填滿分，得分率以滿分 100 計算（表格中滿分標 * 者）。'));

    // ---- 2. 學生 × 測驗熱力圖 → 趨勢 → 一覽表（點某次測驗才展開分布）
    if (qs.length) { renderHeatmap(main, qs, sc, agg, term); renderTrend(main, qs); renderTable(main, qs, sc.isAll, term); }
    if (T && T.stats.n) renderTermScore(main, A, T, term);
    if (!T && qs.length) renderCumulative(main, agg);
    renderHomework(main, sc);
    renderCrossTerm(main);
    renderCrossSubject(main);
  }

  // ============================================================
  // 全部科目總覽（預設畫面）：需關注名單、色塊、定期考查總覽；各科詳細概況按需要才打開
  // ============================================================
  var PERIOD_NAME = { 1: '期中考', 2: '期末考' };
  function allTerm() { return st.term && st.term !== ALL && st.model.terms.indexOf(st.term) > -1 ? st.term : S.defaultTerm(st.model, null); }
  function subsOf(term) { return st.model.subjects.filter(function (x) { return x.byTerm[term]; }); }
  // 現在看期中考還是期末考：使用者沒指定時，取「最近一次已經考完」的定期考查，都還沒考完就取有資料的那一次
  function curPeriod() {
    if (st.period === 1 || st.period === 2) return st.period;
    var term = allTerm(), subs = subsOf(term), p = 0;
    ['complete', 'used'].forEach(function (key) {
      if (p) return;
      [1, 2].forEach(function (pp) { if (subs.some(function (x) { return x.byTerm[term].T.periods[pp - 1][key]; })) p = pp; });
    });
    return p || 1;
  }
  function openSubject(name) {
    st.subject = name; st.cats = null; st.pick = -1; pickDefaultTerm(true);
    renderBar(); renderMain();
    try { window.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
  }
  // 國語的「筆記」看總分，其他作業都看平均（每一項換算成 100 分的平均；項目數不同的作業也能比）
  function isTotalHw(subject, h) { return subject === '國語' && String(h.category || '').indexOf('筆記') > -1; }
  function hwStat(subject, h) {
    var miss = h.missingStudents ? '・缺交 ' + h.missingStudents + ' 人' : '';
    if (isTotalHw(subject, h)) return { total: true, v: h.stats.mean, text: '總分 ' + fmt(h.stats.mean) + (h.totalMax ? ' / ' + fmt(h.totalMax) : '') + miss };
    var avg = h.pcts ? S.mean(h.pcts) : h.stats.mean / Math.max(1, h.nItems);
    return { total: false, v: avg, text: fmt(avg) + ' 分' + miss };
  }
  function hwTile(subject, h) {
    var nm = h.category || '作業', d = '全數繳交 ' + h.fullCount + ' 人・有缺交 ' + h.missingStudents + ' 人';
    if (isTotalHw(subject, h)) return AX.tile(nm + '總分平均', fmt(h.stats.mean), h.totalMax ? '/ ' + fmt(h.totalMax) : '分', d);
    var avg = h.pcts ? S.mean(h.pcts) : h.stats.mean / Math.max(1, h.nItems);
    return AX.tile(nm + '平均', fmt(avg), '分', '每項平均' + (h.pcts ? '（換算 100 分）' : '') + '・' + d);
  }
  // 各類測驗的平均（聽考、國卷、測驗…）：期中考、期末考不在這裡，另外在「定期考查」看
  function quizCatStats(A) {
    var order = [], by = {};
    A.quiz.forEach(function (q) {
      if (q.kind === 'midterm' || q.kind === 'final') return;
      var c = q.category || '';
      if (!by[c]) { by[c] = []; order.push(c); }
      by[c].push(q);
    });
    return order.map(function (c) { var g = by[c]; return { cat: c, n: g.length, mean: S.mean(g.map(function (q) { return q.pctStats.mean; })), last: g[g.length - 1] }; });
  }
  function metricTile(title, big, unit, rows, note) {
    var t = AX.tile(title, big, unit, note || '', '');
    var ul = el('ul', { 'class': 'mrows' });
    rows.forEach(function (r) {
      var li = el('li', { title: '點一下，改看' + r.subject + '的詳細概況' });
      li.appendChild(el('span', { 'class': 'nm' }, r.name));
      li.appendChild(el('span', { 'class': 'vl ' + (r.cls || '') }, r.text));
      li.onclick = function () { openSubject(r.subject); };
      ul.appendChild(li);
    });
    t.appendChild(ul);
    return t;
  }
  function stuUrl(r, term, subject) { return AX.pageUrl('Personal.html', { subject: subject, key: r.key, term: term }); }

  function renderAll(main) {
    var term = allTerm(), subs = subsOf(term);
    if (!subs.length) { main.appendChild(el('div', { 'class': 'card empty' }, '所選學期還沒有登記任何成績。')); return; }
    var p = curPeriod();
    renderAllTiles(main, term, subs, p);
    renderPeriodOverview(main, term, subs, p);
    renderWatchAll(main, term, subs);
    renderSubjectEntry(main, term, subs);
  }

  // ---------- 全部科目的需關注名單 ----------
  // 1) 表現明顯異常：相對「自己平常的水準」大幅下滑（突然落差、連續退步、學期退步、單科明顯偏弱），就算不是最後幾名也會列出
  // 2) 低於及格線或後標（任何一科）　3) 有缺交或缺考
  function renderWatchAll(main, term, subs) {
    var m = st.model, th = AX.getAlertTh();
    var WEIRD = { '突然落差': 1, '連續退步': 1, '學期退步': 1, '單科偏弱': 1 };
    var weird = [], miss = [];
    m.roster.forEach(function (r) {
      var al = S.alertsFor(m, r.key, th, term).filter(function (a) { return WEIRD[a.type]; });
      if (al.length) weird.push({ r: r, list: al, high: al.filter(function (a) { return a.level === 'high'; }).length });
      var ms = [];
      subs.forEach(function (sm) {
        var i = sm.index[r.key]; if (i === undefined) return;
        var bt = sm.byTerm[term];
        var hm = 0; bt.A.homework.forEach(function (h) { hm += h.missing[i]; });
        var ab = bt.A.quiz.filter(function (q) { return q.scores[i] == null; }).length;
        if (hm || ab) ms.push({ subject: sm.name, hm: hm, ab: ab });
      });
      if (ms.length) miss.push({ r: r, list: ms, total: ms.reduce(function (n, x) { return n + x.hm + x.ab; }, 0) });
    });
    weird.sort(function (a, b) { return (b.high - a.high) || (b.list.length - a.list.length); });
    miss.sort(function (a, b) { return b.total - a.total; });

    var c = AX.card('需關注名單', '一次檢查全部科目（' + subs.map(function (x) { return x.name; }).join('、') + '）。「表現明顯異常」不看名次，看的是比他自己平常的水準低很多的同學，所以就算不是最後幾名也會列出。點名字看個人概況。');

    // 1) 表現明顯異常
    var h1 = el('div', { 'class': 'h3' }, '表現明顯異常（比自己平常水準低很多）　');
    h1.appendChild(el('b', null, weird.length + ' 人'));
    c.appendChild(h1);
    if (!weird.length) c.appendChild(el('div', { 'class': 'muted small' }, '目前沒有人出現明顯的突然落差或連續退步'));
    else {
      var allW = !!st.attAll.weird;
      var wl = el('div');
      (allW ? weird : weird.slice(0, 5)).forEach(function (x) {
        var row = el('div', { 'class': 'wrow' });
        var who = el('div', { 'class': 'who' });
        who.appendChild(el('a', { 'class': 'link', href: stuUrl(x.r, term, x.list[0].subject) }, AX.seatLabel(x.r)));
        row.appendChild(who);
        var ls = el('div', { 'class': 'ls' });
        x.list.forEach(function (a) {
          var d = el('div'), hi = a.level === 'high';
          d.appendChild(el('span', { 'class': 'sj' + (hi ? ' hi' : '') }, (hi ? '❗' : '') + a.subject));
          d.appendChild(el('span', { 'class': 'ty' }, a.type));
          d.appendChild(document.createTextNode(a.short || a.text));
          ls.appendChild(d);
        });
        row.appendChild(ls);
        wl.appendChild(row);
      });
      c.appendChild(wl);
      if (weird.length > 5) {
        var bw = el('button', { 'class': 'secondary noprint' }, allW ? '收合' : '顯示全部 ' + weird.length + ' 人');
        bw.onclick = function () { st.attAll.weird = !allW; renderMain(); };
        c.appendChild(bw);
      }
    }

    // 有缺交或缺考：縮成一小排（座號姓名＋哪一科），不佔版面
    var h2 = el('div', { 'class': 'h3' }, '有缺交或缺考　'); h2.style.marginTop = '16px';
    h2.appendChild(el('b', null, miss.length + ' 人'));
    c.appendChild(h2);
    if (!miss.length) c.appendChild(el('div', { 'class': 'muted small' }, '全班都沒有缺交'));
    else {
      var allM = !!st.attAll.miss, mbox = el('div', { 'class': 'chips' });
      (allM ? miss : miss.slice(0, 12)).forEach(function (x) {
        var chip = el('span', { 'class': 'chip', title: x.list.map(function (y) { return y.subject + ' ' + [y.hm ? '作業缺 ' + y.hm + ' 次' : '', y.ab ? '缺考 ' + y.ab + ' 次' : ''].filter(Boolean).join('・'); }).join('、') });
        chip.appendChild(el('a', { 'class': 'link', href: stuUrl(x.r, term, x.list[0].subject) }, AX.seatLabel(x.r)));
        chip.appendChild(el('b', null, ' ' + x.list.map(function (y) { return y.subject.slice(0, 2) + (y.hm ? '缺' + y.hm : '') + (y.ab ? '考' + y.ab : ''); }).join(' ')));
        mbox.appendChild(chip);
      });
      c.appendChild(mbox);
      c.appendChild(el('div', { 'class': 'muted small', style: 'margin-top:6px' }, '「缺」＝作業缺交次數、「考」＝缺考次數；滑鼠移上去看完整說明。'));
      if (miss.length > 12) {
        var bm = el('button', { 'class': 'secondary noprint' }, allM ? '收合' : '顯示全部 ' + miss.length + ' 人');
        bm.style.marginTop = '6px';
        bm.onclick = function () { st.attAll.miss = !allM; renderMain(); };
        c.appendChild(bm);
      }
    }
    var ft = el('p', { 'class': 'muted small', style: 'margin:10px 0 0' }, '更細的警示條件與門檻在「');
    ft.appendChild(el('a', { 'class': 'link', href: AX.pageUrl('Attention.html', {}) }, '關注名單'));

  // ---------- 需關注名單：低於及格或後標／連續退步／有缺交 ----------
  function watchGroups(qs, agg, sc) {
    var A = sc.A, T = sc.T, N = A.students.length, i, k;
    var useT = !!(T && T.stats.n);
    var vals = useT ? T.scores : agg.rows.map(function (r) { return r.eligible ? r.avg : null; });
    var ranks = useT ? T.ranks : agg.rows.map(function (r) { return r.rank; });
    var back = useT ? T.tiers.back : (agg.eligibleN ? agg.tiers.back : null);
    var low = [], decl = [], miss = [];
    for (i = 0; i < N; i++) {
      var v = vals[i];
      if (v != null) {
        if (v < A.passPct) low.push({ idx: i, rank: ranks[i], v: v, fail: true });
        else if (back != null && v < back) low.push({ idx: i, rank: ranks[i], v: v, fail: false });
      }
      // 連續退步：最近幾次測驗「與當次班平均的差距」連續變小，且合計掉 5 分以上
      var ser = S.studentSeries(A, i, st.cats);
      if (ser.length >= 3) {
        var m = ser.length, run = 0;
        while (m - 1 - run > 0 && ser[m - 1 - run].diff < ser[m - 2 - run].diff) run++;
        var drop = run >= 2 ? ser[m - 1 - run].diff - ser[m - 1].diff : 0;
        if (run >= 2 && drop >= 5) decl.push({ idx: i, run: run, drop: drop, from: ser[m - 1 - run].diff, to: ser[m - 1].diff });
      }
      var hm = 0;
      A.homework.forEach(function (h) { hm += h.missing[i]; });
      var ab = qs.filter(function (q) { return q.scores[i] == null; }).length;
      if (hm || ab) miss.push({ idx: i, hm: hm, ab: ab });
    }
    low.sort(function (a, b) { return (b.fail - a.fail) || (a.v - b.v); });
    decl.sort(function (a, b) { return b.drop - a.drop; });
    miss.sort(function (a, b) { return (b.hm + b.ab) - (a.hm + a.ab); });
    return { low: low, decl: decl, miss: miss, useT: useT, back: back, pass: A.passPct };
  }

  }

  // ---------- 學生 × 測驗熱力圖 ----------
  // 每格依「與當次班平均的差距」上色：綠＝高於平均，紅＝低於平均，灰＝缺交／缺考；格子裡仍寫出得分，不只靠顏色
  function hmColor(d) {
    if (Math.abs(d) < 2) return '#EFEBE3';
    var a = 0.14 + 0.5 * Math.min(1, (Math.abs(d) - 2) / 23);
    return d > 0 ? 'rgba(59,125,52,' + a.toFixed(2) + ')' : 'rgba(193,71,51,' + a.toFixed(2) + ')';
  }
  function weakTests(qs) {
    var pass = scope().A.passPct;
    return qs.map(function (q, k) { return { q: q, k: k }; })
      .sort(function (a, b) { return a.q.pctStats.mean - b.q.pctStats.mean; })
      .slice(0, 3)
      .filter(function (x) { return x.q.pctStats.mean < 80 || x.q.pcts.filter(function (p) { return p != null && p < pass; }).length >= Math.max(2, x.q.n * 0.2); });
  }
  function renderHeatmap(main, qs, sc, agg, term) {
    var A = sc.A, T = sc.T, s = sm(), N = A.students.length;

    var weak = weakTests(qs);
    if (weak.length) {
      var wl = el('div', { 'class': 'note', style: 'margin:0 0 8px' });
      wl.appendChild(document.createTextNode('較弱的單元：' + weak.map(function (x) {
        return x.q.name + '（平均得分率 ' + fmt(x.q.pctStats.mean) + '%，不及格 ' + x.q.pcts.filter(function (p) { return p != null && p < A.passPct; }).length + ' 人）';
      }).join('、')));
      c.appendChild(wl);
    }
    var lg = el('div', { 'class': 'hmLegend' });
    lg.appendChild(document.createTextNode('低於班平均 '));
    [-25, -15, -8, 0, 8, 15, 25].forEach(function (d) { var i = el('i'); i.style.background = hmColor(d); lg.appendChild(i); });
    lg.appendChild(document.createTextNode(' 高於班平均（滿色約差 25 分以上）　'));
    var na = el('i'); na.style.background = '#E4E1DD'; lg.appendChild(na); lg.appendChild(document.createTextNode(' 缺交／缺考'));
    c.appendChild(lg);

    var bar = el('div', { 'class': 'bar noprint' }); bar.style.marginBottom = '8px';
    [['seat', '依座號'], ['low', '由低分排起']].forEach(function (o) {
      var b = el('button', { 'class': st.sort === o[0] ? 'on' : '' }, o[1]);
      b.onclick = function () { st.sort = o[0]; renderMain(); };
      bar.appendChild(b);
    });
    c.appendChild(bar);

    var avg = T && T.stats.n ? T.scores : agg.rows.map(function (r) { return r.eligible ? r.avg : null; });
    var order = [], i;
    for (i = 0; i < N; i++) order.push(i);
    if (st.sort === 'low') order.sort(function (a, b) { return (avg[a] == null ? 1e9 : avg[a]) - (avg[b] == null ? 1e9 : avg[b]); });

    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'hm' }), thead = el('thead'), hr = el('tr');
    hr.appendChild(el('th'));
    qs.forEach(function (q, k) {
      var th = el('th', { 'class': 'col' + (k === st.pick ? ' sel' : ''), title: (q.term ? q.term + ' ' : '') + q.name + '（平均 ' + fmt(q.stats.mean) + '）' }, q.name);
      th.onclick = function () { st.pick = k; renderMain(); var d = AX.$('detail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      hr.appendChild(th);
    });
    hr.appendChild(el('th', { style: 'text-align:left;padding-left:8px' }, T && T.stats.n ? '學期成績' : '累計平均'));
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    order.forEach(function (idx) {
      var tr = el('tr'), nm = el('td', { 'class': 'nm' });
      nm.appendChild(el('a', { 'class': 'link', href: personalUrl(idx, term), title: '看個人概況' }, AX.seatLabel(A.students[idx])));
      tr.appendChild(nm);
      qs.forEach(function (q) {
        var v = q.scores[idx], td;
        if (v == null) td = el('td', { 'class': 'na', title: q.name + '：缺交／缺考' }, '—');
        else {

          td = el('td', { title: q.name + '：' + fmt(v) + (q.max !== 100 ? ' / ' + fmt(q.max) : '') + '，與班平均 ' + sg(d) + ' 分' }, fmt(v, 0));
          td.style.background = hmColor(d);

      var a = el('td', { 'class': 'avg' }, avg[idx] == null ? '—' : fmt(avg[idx]));

      hr.appendChild(th);
    });

  // ---------- 單次測驗細節（在一覽表那一列下方展開） ----------

  // ---------- 作業：只看總和（全部學期時，逐學期各一張） ----------
  function renderHomework(main, sc) {

  // ---------- 跨學期比較 ----------
  function renderCrossTerm(main) {

    var rows = s.terms.map(function (t) { return { t: t, T: s.byTerm[t].T, A: s.byTerm[t].A }; });
    var means = rows.map(function (r) { return r.T.stats.n ? r.T.stats.mean : null; });

      labels: s.terms.map(S.termLabel), yMin: rg.lo, yMax: rg.hi, ticks: rg.ticks, height: 220,
      series: [{ name: '學期成績班平均', color: 'var(--series-1)', values: means }],

      tipRows: function (i) {

      }
    });
    var wrap = el('div', { 'class': 'tbl-wrap' }); wrap.style.marginTop = '10px';
    var tb = el('table', { 'class': 'stats' }), thead = el('thead'), hr = el('tr');
    var hasOther = rows.some(function (r) { return S.nonNull(r.T.comp.other).length > 0; });
    ['學期', '學期成績', '較上學期', '第一次定期考查', '第二次定期考查', '紙筆測驗', '作業'].concat(hasOther ? ['課堂表現'] : []).concat(['期中考', '期末考', '標準差', '及格率', '人數']).forEach(function (h) { hr.appendChild(el('th', { 'class': h === '學期' ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (r, i) {
      var T = r.T, tr = el('tr'), cm = function (k) { var v = S.nonNull(T.comp[k]); return v.length ? fmt(S.mean(v)) + '%' : '—'; };
      var ok = T.scores.filter(function (v) { return v != null; });
      var vals = [S.termLabel(r.t), T.stats.n ? fmt(T.stats.mean) : '—', i > 0 && means[i] != null && means[i - 1] != null ? sg(means[i] - means[i - 1]) : '—',
        cm('total1'), cm('total2'), cm('quiz'), cm('homework')].concat(hasOther ? [cm('other')] : []).concat([cm('midterm'), cm('final'), fmt(T.stats.sd), ok.length ? fmt(ok.filter(function (v) { return v >= pass; }).length / ok.length * 100, 0) + '%' : '—', String(T.stats.n)]);
      vals.forEach(function (v, j) {
        var td = el('td', { 'class': j === 0 ? 'l' : '' }, v);
        if (j === 2 && v !== '—') td.className = AX.cls(means[i] - means[i - 1]);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap);

    // 進步／退步最多的同學：比較「相對班平均的差距」在最近兩個學期的變化
    var cur = st.term === ALL ? s.terms[s.terms.length - 1] : st.term, ci = s.terms.indexOf(cur);
    if (ci > 0) {
      var pt = s.terms[ci - 1], chg = [];
      s.data.students.forEach(function (stu, i) {
        var a = S.termRow(s, pt, i), b = S.termRow(s, cur, i);
        if (a && b) chg.push({ idx: i, d: b.diff - a.diff, from: a.score, to: b.score });
      });
      chg.sort(function (x, y) { return y.d - x.d; });
      var h3 = el('div', { 'class': 'h3' }, S.termLabel(cur) + ' 相較 ' + S.termLabel(pt) + '：相對班平均的變化（扣除整體難易影響）'); h3.style.margin = '14px 0 6px';
      c.appendChild(h3);
      var cols = el('div', { 'class': 'cols' }), L = el('div'), R = el('div'); cols.appendChild(L); cols.appendChild(R); c.appendChild(cols);
      L.appendChild(el('div', { 'class': 'h3' }, '進步最多'));
      L.appendChild(slist(chg.slice(0, 5).filter(function (x) { return x.d > 0; }).map(function (x) { return { idx: x.idx, rank: null, value: sg(x.d) + ' 點（' + fmt(x.from) + '→' + fmt(x.to) + '）' }; }), cur));
      R.appendChild(el('div', { 'class': 'h3' }, '退步最多'));
      R.appendChild(slist(chg.slice(-5).reverse().filter(function (x) { return x.d < 0; }).map(function (x) { return { idx: x.idx, rank: null, value: sg(x.d) + ' 點（' + fmt(x.from) + '→' + fmt(x.to) + '）' }; }), cur));
    }
    main.appendChild(c);
  }

  // ---------- 各科比較 ----------
  function renderCrossSubject(main) {
    var m = st.model;
    if (m.subjects.length < 2) return;
    var term = st.term === ALL ? S.defaultTerm(m, sm()) : st.term;
    var rows = m.subjects.filter(function (x) { return x.byTerm[term]; });
    if (rows.length < 2) return;
    var c = AX.card('各科比較：' + S.termLabel(term), '同一學期各科的學期成績，看哪一科全班整體偏弱、哪一科差距大。');
    var wrap = el('div', { 'class': 'tbl-wrap' }), tb = el('table', { 'class': 'stats' }), thead = el('thead'), hr = el('tr');
    ['科目', '平均', '中位數', '標準差', '最高', '最低', '前標', '後標', '及格率', '人數'].forEach(function (h) { hr.appendChild(el('th', { 'class': h === '科目' ? 'l' : '' }, h)); });
    thead.appendChild(hr); tb.appendChild(thead);
    var body = el('tbody');
    rows.forEach(function (x) {
      var T = x.byTerm[term].T, ok = S.nonNull(T.scores), tr = el('tr', { 'class': x.name === st.subject ? 'pick' : '' });
      if (!T.stats.n) return;
      [x.name, fmt(T.stats.mean), fmt(T.stats.median), fmt(T.stats.sd), fmt(T.stats.max), fmt(T.stats.min), fmt(T.tiers.front), fmt(T.tiers.back),
        fmt(ok.filter(function (v) { return v >= m.passPct; }).length / ok.length * 100, 0) + '%', String(T.stats.n)]
        .forEach(function (v, j) { tr.appendChild(el('td', { 'class': j === 0 ? 'l' : '' }, v)); });
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); c.appendChild(wrap); main.appendChild(c);
  }
})();
</script>
