<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成績總表</title>
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="analysis-common.css?v=20261111">
  <style>
    .app { max-width: none; }
    .gbTitle { text-align: center; font-size: 22px; margin: 4px 0 10px; }

    /* 詳表 */
    .gbWrap { overflow: auto; max-height: 76vh; border: 2px solid var(--ink); border-radius: 14px; background: #fff; }
    table.gb { border-collapse: separate; border-spacing: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
    table.gb th, table.gb td { border-right: 1px solid #D9CFBD; border-bottom: 1px solid #D9CFBD; padding: 4px 6px; text-align: center; white-space: nowrap; min-width: 40px; background: #fff; }
    table.gb thead th { position: sticky; background: var(--yellow-soft); font-weight: 400; z-index: 2; line-height: 1.25; }
    table.gb thead tr:nth-child(1) th { top: 0; }
    table.gb thead tr:nth-child(2) th { top: 29px; }
    table.gb .seat, table.gb .name { position: sticky; z-index: 1; background: var(--paper2); }
    table.gb .seat { left: 0; min-width: 38px; }
    table.gb .name { left: 38px; min-width: 72px; }
    table.gb thead .seat, table.gb thead .name { z-index: 3; background: var(--yellow-soft); }
    table.gb .pct { display: block; font-size: 11px; color: var(--muted); }
    table.gb td.cat { background: var(--aqua-soft); }
    table.gb td.grp { background: var(--coral-soft); }
    table.gb td.dly { background: #EFEAE0; }
    table.gb td.fin, table.gb td.rnk { background: #CFE6F2; }
    table.gb td.rnk { font-weight: 700; }
    table.gb .b-l { border-left: 2px solid var(--ink); }
    table.gb tfoot td { background: var(--green-soft); border-top: 2px solid var(--ink); position: sticky; bottom: 0; }
    table.gb tfoot .seat, table.gb tfoot .name { background: var(--green-soft); z-index: 3; }
    table.gb tbody tr:hover td { filter: brightness(.96); }
    .low { color: #D0301C; font-weight: 700; }
    table.gb td.att { background: #FFF6DC; padding: 2px 3px; }
    table.gb input.attIn { width: 56px; text-align: center; font: inherit; border: 1.5px dashed #C9A94B; border-radius: 8px; padding: 2px 3px; background: #fff; }
    table.gb .attSc { margin-left: 4px; font-size: 12px; color: #6B4E08; white-space: nowrap; }
    .gbCfg .scaleCell { white-space: nowrap; }
    .gbCfg .scaleCell input[type=number] { width: 64px; }
    .gbCfg .scaleCell .tiny { font-size: 12.5px; padding: 3px 10px; }
    table.gb input.attIn:focus { outline: 2px solid var(--ink); border-style: solid; }
    .over { outline: 2px solid #E59A00; outline-offset: -2px; }
    table.gb td.bad, table.brief td.bad { background: #7B1E1E !important; color: #fff !important; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.gb td.bad .attSc { color: #fff; }
    .legend { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

    /* 簡表 */
    .sheet { background: #fff; padding: 6px; margin-bottom: 18px; }
    table.brief { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; border: 2px solid #222; }
    table.brief caption { caption-side: top; font-size: 23px; font-weight: 700; padding: 4px 0 8px; }
    table.brief th, table.brief td { border: 1px solid #333; text-align: center; padding: 5px 1px; font-weight: 400; font-size: 15px; }
    table.brief .side { width: 66px; font-size: 19px; font-weight: 700; line-height: 1.25; }
    table.brief .label { width: 156px; font-size: 14px; }
    table.brief .stuName { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 3px; font-size: 17px; height: 96px; vertical-align: middle; padding: 4px 0; }
    table.brief .head { background: #FBE6D8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief .diag { position: relative; background: #FBE6D8 linear-gradient(to top right, transparent calc(50% - 1px), #333 calc(50% - .5px), #333 calc(50% + .5px), transparent calc(50% + 1px)); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief .diag .a { position: absolute; top: 14px; right: 44px; font-size: 15px; letter-spacing: 6px; }
    table.brief .diag .b { position: absolute; bottom: 12px; left: 40px; font-size: 15px; letter-spacing: 6px; }
    table.brief tr.att td, table.brief tr.att th { background: #FFF6DC; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief tr.tot td, table.brief tr.tot th { background: #FBE6D8; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief tr.sum td, table.brief tr.sum th { background: #DEE7F1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief tr.avg td, table.brief tr.avg th { background: #EBF0DF; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.brief tr.rank td { font-size: 19px; font-weight: 700; }
    table.brief tr.line > * { border-top: 2px solid #222; }
    table.brief td.foot { text-align: left; padding: 6px 10px; font-size: 16px; border-top: 2px solid #222; }
    table.brief td.foot span { margin-right: 28px; }

    /* 設定 */
    .gbCfg summary { cursor: pointer; }
    .gbCfg table { border-collapse: collapse; margin: 8px 0; }
    .gbCfg th, .gbCfg td { padding: 4px 10px; border-bottom: 2px dotted var(--line); text-align: left; font-weight: 400; }
    .gbCfg input[type=number] { width: 70px; }

    .sheet .bt + .bt { margin-top: 22px; }
    .rowPick label { display: inline-block; margin: 3px 14px 3px 0; white-space: nowrap; }
    .rowPick .sec { margin: 6px 0 2px; font-weight: 700; }
    @media print {
      .rowPick { display: none !important; }
      .sheet .bt { break-inside: avoid; }
      .sheet .bt + .bt { margin-top: 7mm; }
      table.brief caption { font-size: 17px; padding: 0 0 4px; }
      table.brief th, table.brief td { font-size: 12.5px; padding: 3px 1px; }
      table.brief col.cSide { width: 50px !important; }
      table.brief col.cLab { width: 112px !important; }
      table.brief .side { width: 50px; font-size: 14px; }
      table.brief .label { width: 112px; font-size: 12px; }
      table.brief .stuName { font-size: 14px; height: 78px; letter-spacing: 1px; }
      table.brief .diag .a { top: 8px; right: 22px; font-size: 12px; letter-spacing: 3px; }
      table.brief .diag .b { bottom: 8px; left: 16px; font-size: 12px; letter-spacing: 3px; }
      table.brief tr.rank td { font-size: 15px; }
      table.brief td.foot { font-size: 12px; padding: 4px 6px; }
      table.brief td.foot span { margin-right: 14px; }
      .gbCfg, .legend { display: none !important; }
      table.gb input.attIn { border: none; background: transparent; width: 40px; font-size: 10.5px; padding: 0; -moz-appearance: textfield; appearance: textfield; }
      table.gb input.attIn::-webkit-inner-spin-button, table.gb input.attIn::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      .gbWrap { overflow: visible; max-height: none; border: 1.5px solid #222; border-radius: 0; }
      table.gb { font-size: 10.5px; }
      table.gb th, table.gb td { padding: 2px 3px; min-width: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      table.gb thead th, table.gb .seat, table.gb .name, table.gb tfoot td { position: static; }
      .sheet { padding: 0; margin: 0; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
  </style>
  <style id="pageStyle">@page { size: A4 landscape; margin: 8mm; }</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">📊 成績分析</span>
    <nav class="pages">
      <a href="Dashboard.html">全班概況</a>
      <a href="Personal.html">個人概況</a>
      <a class="on" href="Gradebook.html">成績總表</a>
      <a href="Progress.html">成績歷程</a>
      <a href="Report.html">家長報告</a>
      <a href="Attention.html">關注名單</a>
      <a href="Awards.html">獎狀名單</a>
      <a href="Missing.html">缺分紀錄</a>
    </nav>
    <span class="spacer"></span>
    <button id="connBtn">⚙️ 連線設定</button>
  </div>

  <div id="content" class="content">
    <div class="bar">
      <span class="grp"><span class="lbl">科目</span><span id="subjectBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">學期</span><span id="termBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">階段</span><span id="stageBtns" class="grp"></span></span>
      <span class="grp"><span class="lbl">表格</span><span id="viewBtns" class="grp"></span></span>
    </div>
    <div class="bar">
      <span class="grp"><span class="lbl">未達</span><input type="number" id="optLow" min="0" max="100" style="width:64px"><span class="lbl">分標紅色</span></span>
      <span class="grp"><span class="lbl">平均取小數</span><select id="optDec"><option value="2">2 位（跟 Excel 一樣）</option><option value="1">1 位（四捨五入）</option></select></span>
      <span class="grp"><span class="lbl">還沒輸入時先當作</span><input type="number" id="optBlank" min="0" max="100" style="width:64px"><span class="lbl">分（態度、還沒有成績的段考）</span></span>
      <span class="grp" id="perPageGrp"><span class="lbl">簡表每個表格</span><input type="number" id="optPerPage" min="4" max="20" style="width:64px"><span class="lbl">人（一張 A4 直式放兩個表格）</span></span>
      <span class="spacer"></span>
      <button id="xlsBtn" title="每個科目一個工作表，一次下載全部">⬇️ 下載 Excel（全部科目）</button>
      <button class="primary" id="printBtn">🖨️ 列印 / 存成 PDF</button>
      <button id="reloadBtn" title="在試算表修改成績後，按這裡重新讀取">🔄 重新讀取試算表</button>
    </div>
    <details class="card gbCfg rowPick noprint" id="rowBox" style="display:none">
      <summary><b>🧾 簡表要印哪些列</b></summary>
      <div id="rowBody"></div>
    </details>
    <div id="main"></div>
    <details class="card gbCfg noprint" id="cfgBox">
      <summary><b>⚙️ 計分設定（這個科目）</b></summary>
      <div id="cfgBody"></div>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="analysis-stats.js?v=20261111"></script>
<script src="analysis-demo.js?v=20261111"></script>
<script src="analysis-art.js?v=20261111"></script>
<script src="analysis-common.js?v=20261111"></script>
<script>
(function () {
  var S = AX.stats, el = AX.el;
  var STORE = 'AX_GRADEBOOK';
  var saved = {};
  try { saved = JSON.parse(AX.lsGet(STORE) || '{}') || {}; } catch (e) { saved = {}; }
  var st = {
    raw: null, subject: saved.subject || null, term: null, stage: null,
    blank: saved.blank >= 0 && saved.blank <= 100 && saved.blank !== null ? Number(saved.blank) : S.BLANK_DEFAULT,
    dec: saved.dec === 1 ? 1 : 2, view: saved.view === 'brief' ? 'brief' : 'detail', low: saved.low > 0 ? saved.low : 80, perPage: saved.perPage >= 4 ? saved.perPage : 16, G: null,
    rowOpt: saved.rowOpt && typeof saved.rowOpt === 'object' ? saved.rowOpt : {}   // 簡表要印哪些列：{科目: {列的代號: true/false}}
  };
  var KIND_OPTS = [['homework', '平時作業'], ['quiz', '平時測驗'], ['other', '態度（課堂表現）'], ['midterm', '期中考'], ['final', '期末考'], ['skip', '不列入']];
  var STAGE_NAME = { 1: '期中考', 2: '期末考' };

  AX.shell();
  function remember() { AX.lsSet(STORE, JSON.stringify({ subject: st.subject, view: st.view, low: st.low, perPage: st.perPage, dec: st.dec, blank: st.blank, rowOpt: st.rowOpt })); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n1(v) { return v == null ? '' : (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, ''); }
  function nd(v, dec) {
    if (v == null) return '';
    var f = Math.pow(10, dec), t = (Math.round(v * f + 1e-9) / f).toFixed(dec);
    if (t.indexOf('.') > -1) { while (t.charAt(t.length - 1) === '0') t = t.slice(0, -1); if (t.charAt(t.length - 1) === '.') t = t.slice(0, -1); }
    return t;
  }
  function n2(v) { return nd(v, st.dec); }
  function pct(v) { return Math.round(v * 10) / 10 + '%'; }
  function fullTerm(t) {
    var m = /^(\d+)\s*(上|下)$/.exec(t || '');
    return m ? m[1] + '學年度第' + (m[2] === '上' ? 1 : 2) + '學期' : (t || '');
  }
  function dataOf(subject) {
    return st.raw.subjects.filter(function (d) { return d.subject === subject; })[0] || null;
  }
  function termsOf(d) {
    var have = {};
    d.items.forEach(function (it) { have[it.term || ''] = true; });
    var list = (st.raw.terms || []).filter(function (t) { return have[t]; });
    Object.keys(have).forEach(function (t) { if (list.indexOf(t) === -1) list.push(t); });
    return list;
  }
  function weightsOf(subject) { return (st.raw.subjectWeights && st.raw.subjectWeights[subject]) || st.raw.weights; }
  function cfgOf(subject) {
    st.raw.gradebook = st.raw.gradebook || {};
    return st.raw.gradebook[subject] || (st.raw.gradebook[subject] = {});
  }
  function normName(n) { return String(n == null ? '' : n).replace(/\s+/g, ''); }
  // 這個科目、學期、階段的態度分數，依學生順序（沒輸入的是 null）
  function attOf(subject, stage) {
    var map = {};
    (st.raw.attitude || []).forEach(function (a) { if (a.subject === subject && a.term === st.term && Number(a.p) === stage) map[a.name] = a.score; });
    return dataOf(subject).students.map(function (s) { var k = normName(s.name); return map.hasOwnProperty(k) ? map[k] : null; });
  }
  function gbOf(subject, stage) { return S.gradebook(dataOf(subject), st.term, stage, st.raw.kinds, weightsOf(subject), cfgOf(subject), st.dec, attOf(subject, stage), st.blank); }
  function gbFor(stage) { return gbOf(st.subject, stage); }
  function hasGraded(G) {
    return G.examGraded || G.groups.some(function (g) { return g.cats.some(function (c) { return c.items.some(function (x) { return x.graded; }); }); });
  }

  function load() {
    AX.load().then(function (res) {
      st.raw = res.raw;
      buildPickers();
      render();
    }).catch(AX.showError);
  }

  function buildPickers() {
    var names = st.raw.subjects.map(function (d) { return d.subject; });
    if (names.indexOf(st.subject) === -1) st.subject = names[0] || null;
    if (!st.subject) return;
    var terms = termsOf(dataOf(st.subject));
    if (terms.indexOf(st.term) === -1) st.term = terms.indexOf(st.raw.currentTerm) > -1 ? st.raw.currentTerm : terms[terms.length - 1];
    if (st.stage == null) st.stage = hasGraded(gbFor(2)) ? 2 : 1;
    AX.btnGroup(AX.$('subjectBtns'), names.map(function (n) { return { label: n, value: n }; }), st.subject, function (v) { st.subject = v; remember(); buildPickers(); render(); });
    AX.btnGroup(AX.$('termBtns'), terms.map(function (t) { return { label: t, value: t }; }), st.term, function (v) { st.term = v; buildPickers(); render(); });
    AX.btnGroup(AX.$('stageBtns'), [{ label: '期中考', value: 1 }, { label: '期末考', value: 2 }], st.stage, function (v) { st.stage = Number(v); buildPickers(); render(); });
    AX.btnGroup(AX.$('viewBtns'), [{ label: '詳表', value: 'detail' }, { label: '簡表（列印）', value: 'brief' }], st.view, function (v) { st.view = v; remember(); buildPickers(); render(); });
    AX.$('perPageGrp').style.display = st.view === 'brief' ? '' : 'none';
  }

  function render() {
    var main = AX.$('main');
    AX.clear(main);
    if (!st.subject) { main.appendChild(el('div', { 'class': 'empty' }, '還沒有任何科目')); return; }
    var G = st.G = gbFor(st.stage);
    renderConfig();
    document.getElementById('pageStyle').textContent = '@page { size: A4 ' + (st.view === 'brief' ? 'portrait' : 'landscape') + '; margin: 8mm; }';
    renderRowPicker(G);
    if (G.empty || !G.students.length) {
      main.appendChild(el('div', { 'class': 'empty' }, G.students.length ? '這個階段還沒有登記項目' : '這個科目還沒有學生名單'));
      return;
    }
    if (st.view === 'detail') renderDetail(main, G); else renderBrief(main, G);
  }

  function isLow(v) { return v != null && v < st.low; }

  // ---- 詳表 --------------------------------------------------
  function detailColumns(G) {
    var cols = [], tops = [];
    G.groups.forEach(function (g) {
      var single = g.cats.length === 1 && g.cats[0].items.length === 1 && !g.cats[0].base && !g.cats[0].scale;
      var start = cols.length;
      if (g.cats.length === 1 && g.cats[0].input) {
        cols.push({ head: esc(g.label) + '<span class="pct">' + (g.used ? pct(g.share) : '輸入') + '</span>', cls: 'grp att', values: g.avg, input: true, raw: g.cats[0].raw, scaled: !!g.cats[0].scale, pctVal: true });
        cols[start].first = true;
        tops.push({ label: g.label, n: 1, single: true });
        return;
      }
      if (!single) {
        g.cats.forEach(function (c) {
          c.items.forEach(function (x) {
            cols.push({ head: esc(x.name), kind: 'item', item: x, values: x.scores, scaled: !!c.scale });
          });
          if (g.cats.length > 1 || c.base > 0 || c.scale) cols.push({ head: esc(c.category) + '<span class="pct">' + (c.used ? pct(c.share) : (c.input ? '輸入' : '不計分')) + '</span>', cls: c.input ? 'cat att' : 'cat', values: c.avg, raw: c.input ? c.raw : null, scaled: !!c.scale, input: !!c.input, pctVal: true });
        });
      }
      cols.push({ head: esc(g.label) + '<span class="pct">' + (g.used ? pct(g.share) : '不計分') + '</span>', cls: 'grp', values: g.avg, pctVal: true });
      cols[start].first = true;
      tops.push({ label: g.label, n: cols.length - start, single: cols.length - start === 1 });
    });
    return { cols: cols, tops: tops };
  }

  function tailColumns(G) {
    var tail = [];
    tail.push({ head: '平時成績<span class="pct">' + pct(G.dailyShare) + '</span>', cls: 'dly', values: G.daily, pctVal: true, first: true });
    if (G.examListed) tail.push({ head: STAGE_NAME[st.stage] + '<span class="pct">' + pct(G.examShare) + (G.examDefault ? '・未輸入暫' + G.blank : '') + '</span>', cls: 'dly', values: G.exam, pctVal: true });
    tail.push({ head: '平均', cls: 'fin', values: G.final, pctVal: true, d2: true });
    return tail;
  }

  function renderDetail(main, G) {
    var built = detailColumns(G), cols = built.cols;
    var tail = tailColumns(G);
    var all = cols.concat(tail);

    var h = '<table class="gb"><thead><tr><th class="seat" rowspan="2">座號</th><th class="name" rowspan="2">姓名</th>';
    built.tops.forEach(function (t) {
      if (t.single) h += '<th class="b-l" rowspan="2" data-solo="1"></th>';
      else h += '<th class="b-l" colspan="' + t.n + '">' + esc(t.label) + '</th>';
    });
    tail.forEach(function (c) { h += '<th rowspan="2"' + (c.first ? ' class="b-l"' : '') + '>' + c.head + '</th>'; });
    h += '<th rowspan="2">排名</th></tr><tr>';
    var pos = 0;
    built.tops.forEach(function (t) {
      if (!t.single) for (var j = 0; j < t.n; j++) h += '<th' + (j === 0 ? ' class="b-l"' : '') + '>' + cols[pos + j].head + '</th>';
      pos += t.n;
    });
    h += '</tr></thead><tbody>';
    G.students.forEach(function (s, i) {
      h += '<tr><td class="seat">' + esc(s.seat) + '</td><td class="name">' + esc(s.name) + '</td>';
      all.forEach(function (c) {
        var v = c.values[i], cls = [];
        if (c.cls) cls.push(c.cls);
        if (c.first) cls.push('b-l');
        var pctOfItem = c.kind === 'item' && v != null ? (c.scaled ? null : v / c.item.max * 100) : v;
        if (isLow(pctOfItem)) cls.push('low');
        var title = '';
        if (c.kind !== 'item' && !c.input && v != null && v > 100.0001) { cls.push('bad'); title = ' title="超過 100 分，請檢查原始分數有沒有打錯"'; }
        if (c.kind === 'item' && !c.scaled && v != null && v > c.item.max) { cls.push('over'); cls.push('bad'); title = ' title="超過滿分 ' + c.item.max + '，請確認有沒有打錯"'; }
        if (c.input) {
          var rv = c.raw ? c.raw[i] : null;
          h += '<td class="' + cls.join(' ') + '"><input type="number" class="attIn" min="0" max="100" step="any" data-i="' + i + '" value="' + (rv == null ? '' : rv) + '" placeholder="' + st.blank + '" title="態度分數，輸入後按 Enter 或 Tab 就會存到試算表；還沒輸入先當作 ' + st.blank + ' 分">' + (c.scaled && rv != null && v != null ? '<span class="attSc" title="換算後的分數">→' + n1(v) + '</span>' : '') + '</td>';
          return;
        }
        h += '<td' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + title + '>' + (c.d2 ? n2(v) : n1(v)) + '</td>';
      });
      var r = G.ranks[i];
      h += '<td class="rnk">' + (r == null ? '' : r) + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><td class="seat"></td><td class="name">平均</td>';
    all.forEach(function (c) {
      var vals = S.nonNull(c.values), cls = c.first ? ' class="b-l"' : '';
      h += '<td' + cls + '>' + (vals.length ? (c.d2 ? n2(S.mean(vals)) : n1(S.mean(vals))) : '') + '</td>';
    });
    h += '<td></td></tr></tfoot></table>';

    // 單欄大項（例如態度）的表頭：標題和比例放在同一格
    var card = el('div');
    card.appendChild(el('div', { 'class': 'gbTitle' }, fullTerm(st.term) + '　' + st.subject + '　' + STAGE_NAME[st.stage] + '成績'));
    var wrap = el('div', { 'class': 'gbWrap', id: 'gbPrint' });
    wrap.innerHTML = h;
    var solos = wrap.querySelectorAll('th[data-solo]'), si = 0, p = 0;
    built.tops.forEach(function (t) { if (t.single) solos[si++].innerHTML = cols[p].head; p += t.n; });
    card.appendChild(wrap);
    var over = wrap.querySelectorAll('.over').length;
    card.appendChild(el('p', { 'class': 'legend' }, '紅字＝未達 ' + st.low + ' 分。黃色格子的「態度」直接在表上輸入（Enter 到下一位）。比例可以在下方「計分設定」修改。空白：作業類以 0 分計（缺交），測驗、態度不計入平均；測驗缺考請登記 0 分。' +
      (shareNote(G) ? ' ' + shareNote(G) : '') +
      (wrap.querySelectorAll('td.bad').length ? ' ⚠️ 有 ' + wrap.querySelectorAll('td.bad').length + ' 格超過滿分或超過 100 分（深紅色底），請檢查原始分數有沒有打錯。' : '')));
    main.appendChild(card);
    wireAttitudeInputs(wrap, G);
  }

  // ---- 態度輸入：離開欄位或按 Enter 就存；存完重算整張表，游標留在原本的位置 ----
  var attChain = Promise.resolve();
  function wireAttitudeInputs(wrap, G) {
    var inputs = wrap.querySelectorAll('input.attIn');
    if (!inputs.length) return;
    Array.prototype.forEach.call(inputs, function (inp, k) {
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var nxt = inputs[e.shiftKey ? k - 1 : k + 1];
        if (nxt) { nxt.focus(); nxt.select(); } else inp.blur();
      });
      inp.addEventListener('focus', function () { inp.select(); });
      inp.addEventListener('change', function () { saveAttitude(G, Number(inp.dataset.i), inp.value, inp); });
    });
  }
  function saveAttitude(G, i, text, inp) {
    var stu = G.students[i], subject = st.subject, term = st.term, stage = st.stage;
    var v = String(text).trim() === '' ? '' : Number(text);
    if (v !== '' && (!isFinite(v) || v < 0 || v > 100)) { AX.toast('態度分數要在 0～100 之間', true); inp.value = ''; return; }
    // 先改畫面上的資料（立刻重算），再背景存到試算表
    var key = normName(stu.name);
    st.raw.attitude = (st.raw.attitude || []).filter(function (a) { return !(a.subject === subject && a.term === term && Number(a.p) === stage && a.name === key); });
    if (v !== '') st.raw.attitude.push({ subject: subject, term: term, p: stage, name: key, score: v });
    setTimeout(function () {
      var ae = document.activeElement, keep = ae && ae.classList && ae.classList.contains('attIn') ? ae.dataset.i : null;
      render();
      if (keep != null) { var again = document.querySelector('input.attIn[data-i="' + keep + '"]'); if (again) { again.focus(); again.select(); } }
    }, 0);
    attChain = attChain.then(function () { return AX.call('setAttitude', subject, term, stage, [{ name: stu.name, score: v }]); })
      .then(function () { setSaved('已儲存'); }, function (e) { AX.showError(e); });
  }
  function setSaved(msg) { AX.toast(msg); }

  // ---- 簡表（學生橫列，方便列印；A4 直式，一張放兩個表格） ------------------------------
  // all＝true：列出全部可選的列（給「要印哪些列」勾選用）；否則只留下有勾的列
  // 滑鼠移到列標題上顯示的說明：這一列包含哪些項目
  function itemsTip(c) {
    var done = c.items.filter(function (x) { return x.graded; }).map(function (x) { return x.name; });
    var wait = c.items.filter(function (x) { return !x.graded; }).map(function (x) { return x.name; });
    return '包含 ' + done.length + ' 項：' + done.join('、') + (wait.length ? '（尚未登記：' + wait.join('、') + '）' : '');
  }
  function groupTip(g) {
    if (g.kind === 'other') return '老師在詳表輸入的態度分數；還沒輸入的先當 ' + st.blank + ' 分';
    var used = g.cats.filter(function (c) { return c.used; });
    if (used.length > 1) return '由 ' + used.map(function (c) { return c.category + ' ' + pct(c.share); }).join('、') + ' 合成';
    return used.length ? itemsTip(used[0]) : '';
  }
  function briefRows(G, all) {
    var opt = st.rowOpt[st.subject] || {};
    function on(key, def) { return opt[key] == null ? def : !!opt[key]; }
    var rows = [];
    G.groups.forEach(function (g) {
      var group = [], multi = g.cats.length > 1;
      var side = { other: '上課態度', homework: '平時作業', quiz: '平時測驗' }[g.kind];
      var total = { other: '態度', homework: '作業平均', quiz: '紙筆測驗' }[g.kind];
      g.cats.forEach(function (c) {
        if (c.input) return;
        var key = 'c:' + c.category, def = multi;   // 只有一個類別時，類別那列跟總列一樣，預設不重複印
        // 這一大項只有一個類別時，類別那列和合計一模一樣，不重複列出
        if (multi) group.push({ key: key, label: c.category + '平均', pick: c.category + '平均（類別）', tip: itemsTip(c), values: c.avg, on: on(key, def) });
        // 類別底下的細項（例如作業類別裡的國習1、國習2、筆記1…，名稱前面相同的合成一組）
        (c.subs || []).forEach(function (sb) {
          var sk = 's:' + c.category + '|' + sb.label;
          group.push({ key: sk, label: sb.label + '平均', pick: sb.label + '平均（細項）', sub: true, tip: '包含 ' + sb.names.length + ' 項：' + sb.names.join('、'), values: sb.avg, on: on(sk, false) });
        });
      });
      var gk = 'g:' + g.kind;
      group.push({ key: gk, label: total + (g.used ? '（' + pct(g.share) + '）' : '（不計分）'), pick: total + '（合計）', tip: groupTip(g), values: g.avg, cls: g.kind === 'other' ? 'att' : 'tot', on: on(gk, true) });
      rows.push({ side: side, rows: group, cls: g.kind === 'other' ? 'att' : '' });
    });
    var fin = [{ key: 'daily', label: '平時成績（' + pct(G.dailyShare) + '）', tip: '由 ' + G.groups.filter(function (g) { return g.used; }).map(function (g) { return { other: '態度', homework: '平時作業', quiz: '平時測驗' }[g.kind] + ' ' + pct(g.share); }).join('、') + ' 合成', values: G.daily, cls: 'sum', on: on('daily', true) }];
    if (G.examListed) fin.push({ key: 'exam', label: STAGE_NAME[st.stage] + '（' + pct(G.examShare) + '）', tip: G.examDefault ? '還沒有成績，全班先當 ' + G.blank + ' 分' : '包含：' + G.examItems.filter(function (x) { return x.graded; }).map(function (x) { return x.name; }).join('、'), values: G.exam, cls: 'sum', on: on('exam', true) });
    fin.push({ key: 'final', label: '平均', values: G.final, d2: true, cls: 'avg', on: on('final', true) });
    fin.push({ key: 'rank', label: '排名', values: G.ranks, rank: true, cls: 'rank', on: on('rank', true) });
    rows.push({ side: (st.stage === 2 ? '期末' : '期中') + '總成績', rows: fin });
    if (all) return rows;
    return rows.map(function (s) { return { side: s.side, cls: s.cls, rows: s.rows.filter(function (r) { return r.on; }) }; })
      .filter(function (s) { return s.rows.length; });
  }

  // 勾選簡表要印哪些列（例如只印「作業平均」，不印底下各種簿本；不想印態度就取消）
  function renderRowPicker(G) {
    var box = AX.$('rowBox'), body = AX.$('rowBody');
    box.style.display = st.view === 'brief' && G && !G.empty ? '' : 'none';
    AX.clear(body);
    if (st.view !== 'brief' || !G || G.empty) return;
    body.appendChild(el('p', { 'class': 'muted small' }, '打勾的列才會出現在簡表和列印裡（這個設定每個科目各自記住）。每一大項（平時作業、平時測驗）可以選：只印合計，或再加印各類別的平均（例如國習、筆記；聽寫、考卷）。如果類別底下的項目名稱是「國習1、國習2、筆記1…」這種，也可以勾「細項」，把名稱前面相同的合成一列。'));
    briefRows(G, true).forEach(function (sec) {
      body.appendChild(el('div', { 'class': 'sec' }, sec.side));
      sec.rows.forEach(function (r) {
        var cb = el('input', { type: 'checkbox' });
        cb.checked = r.on;
        cb.onchange = function () {
          var o = st.rowOpt[st.subject] || (st.rowOpt[st.subject] = {});
          o[r.key] = cb.checked;
          remember(); render();
        };
        var lab = el('label');
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(' ' + (r.pick || r.label.replace(/（.*）$/, ''))));
        body.appendChild(lab);
      });
    });
  }

  // 態度還沒輸入（或某一項沒資料）時，那一項不計分，其餘項目的比例會自動換算成合計 100%，所以才會看到 46.7%、53.3% 這種數字
  function shareNote(G) {
    var parts = [];
    var attCat = null;
    G.groups.forEach(function (g) { g.cats.forEach(function (c) { if (c.input) attCat = c; }); });
    if (attCat && attCat.raw) {
      var miss = attCat.raw.filter(function (v) { return v == null; }).length;
      if (miss) parts.push('＊態度還沒輸入的 ' + miss + ' 位同學，先當作 ' + G.blank + ' 分計算（輸入後改用實際分數）。');
    }
    if (G.examDefault) parts.push('＊' + STAGE_NAME[st.stage] + '還沒有成績，全班先當作 ' + G.blank + ' 分計算。如果已經登記了卻沒出現，請到下方「計分設定」確認那個類別「算在哪一項」是「' + STAGE_NAME[st.stage] + '」。');
    var s2 = shareNote2(G);
    if (s2) parts.push(s2);
    return parts.join(' ');
  }
  function shareNote2(G) {
    var unused = G.groups.filter(function (g) { return !g.used && g.weight > 0; });
    if (!unused.length) return '';
    var used = G.groups.filter(function (g) { return g.used; });
    var set = G.groups.filter(function (g) { return g.weight > 0; });
    return '＊' + unused.map(function (g) { return g.label; }).join('、') + '還沒有成績，所以不計分；平時成績依其餘項目的設定比例（' +
      used.map(function (g) { return g.label + ' ' + g.weight; }).join('：') + '）換算成合計 100%（' +
      used.map(function (g) { return pct(g.share); }).join('、') + '）。輸入後會恢復成設定的 ' + set.map(function (g) { return g.weight; }).join('：') +
      '。如果這科不計' + unused[0].label + '，到「計分設定」把它的比例改成 0 即可。';
  }

  // 「平時作業」「平時測驗」在「平時」後面換行，「期中總成績」在「期中」後面換行，每行字數比較平均
  function sideHtml(s) { return esc(s).replace(/^(平時|期中|期末)(作業|測驗|總成績)$/, '$1<br>$2'); }

  function renderBrief(main, G) {
    var per = st.perPage, rows = briefRows(G, false), n = G.students.length;
    var below = G.final.filter(isLow).length;
    function blankCells(tag, k) { var s = ''; for (var b = 0; b < k; b++) s += '<' + tag + '></' + tag + '>'; return s; }
    var tables = [];
    for (var start = 0; start < n; start += per) {
      var idx = [];
      for (var i = start; i < Math.min(n, start + per); i++) idx.push(i);
      var blanks = per - idx.length;
      var cap = fullTerm(st.term) + '　' + st.subject + '　' + STAGE_NAME[st.stage] + '　成績紀錄（座號 ' + G.students[idx[0]].seat + '～' + G.students[idx[idx.length - 1]].seat + '）';
      var h = '<table class="brief"><caption>' + esc(cap) + '</caption><colgroup><col class="cSide" style="width:66px"><col class="cLab" style="width:156px"></colgroup>';
      h += '<tr class="head"><th class="head" colspan="2">座號</th>' + idx.map(function (i) { return '<th class="head">' + esc(G.students[i].seat) + '</th>'; }).join('') + blankCells('th', blanks) + '</tr>';
      h += '<tr><th class="diag" colspan="2"><span class="a">姓名</span><span class="b">項目</span></th>' +
        idx.map(function (i) { return '<th class="head stuName">' + esc(G.students[i].name) + '</th>'; }).join('') + blankCells('th', blanks) + '</tr>';
      rows.forEach(function (sec) {
        sec.rows.forEach(function (r, ri) {
          var trCls = [r.cls || ''];
          if (ri === 0) trCls.push('line');
          h += '<tr class="' + trCls.join(' ') + '">';
          if (ri === 0) h += '<th class="side"' + (sec.rows.length > 1 ? ' rowspan="' + sec.rows.length + '"' : ' style="font-size:13px"') + '>' + sideHtml(sec.side) + '</th>';
          h += '<th class="label"' + (r.tip ? ' title="' + esc(r.tip) + '"' : '') + '>' + esc(r.label) + '</th>';
          idx.forEach(function (i) {
            var v = r.values[i];
            var text = r.rank ? (v == null ? '' : v) : (r.d2 ? n2(v) : (v == null ? '' : (Math.round(v * 10) / 10).toString()));
            var isBad = !r.rank && v != null && v > 100.0001;
            h += '<td' + (isBad ? ' class="bad" title="超過 100 分，請檢查原始分數有沒有打錯"' : (!r.rank && isLow(v) ? ' class="low"' : '')) + '>' + text + '</td>';
          });
          h += blankCells('td', blanks) + '</tr>';
        });
      });
      h += '<tr><td class="foot" colspan="' + (2 + per) + '"><span>＊全班人數：' + n + ' 人</span><span>＊全班平均：' + (G.mean == null ? '—' : nd(G.mean, st.dec)) + '</span><span>＊未達 ' + st.low + ' 分者：' + below + ' 人</span></td></tr></table>';
      tables.push(h);
    }
    // 一張 A4 放兩個表格
    for (var t = 0; t < tables.length; t += 2) {
      var sheet = el('div', { 'class': 'sheet' });
      sheet.innerHTML = '<div class="bt">' + tables[t] + '</div>' + (tables[t + 1] ? '<div class="bt">' + tables[t + 1] + '</div>' : '');
      main.appendChild(sheet);
    }
    var note = shareNote(G);
    var badN = main.querySelectorAll('table.brief td.bad').length;
    if (badN) main.appendChild(el('p', { 'class': 'legend noprint' }, '⚠️ 有 ' + badN + ' 格超過 100 分（深紅色底），請檢查原始分數有沒有打錯（滑鼠移到格子上會有提示）。'));
    if (note) main.appendChild(el('p', { 'class': 'legend noprint' }, note));
  }

  // ---- 計分設定 ------------------------------------------------
  function renderConfig() {
    var body = AX.$('cfgBody'), d = dataOf(st.subject), cfg = cfgOf(st.subject), W = weightsOf(st.subject);
    AX.clear(body);
    body.appendChild(el('p', { 'class': 'muted small' }, '比例分三層，跟「科目設定 → 學期成績權重」是同一份設定，改這裡，全班概況、家長報告也會跟著改。每一層只看比例，不用剛好是 100。態度、期中／期末考還沒輸入時，先當作 ' + st.blank + ' 分計算，輸入後改用實際分數。'));
    [
      ['① 平時成績 ＝', [['homework', '平時作業'], ['quiz', '平時測驗'], ['other', '態度']]],
      ['② 定期考查總成績（期中、期末各一次）＝', [['daily', '平時成績'], ['exam', st.stage === 2 ? '期末考' : '期中考']]],
      ['③ 學期成績 ＝', [['p1', '期中定期考查'], ['p2', '期末定期考查']]]
    ].forEach(function (layer) {
      var wb = el('div', { 'class': 'bar' }), inputs = [], sumEl = el('span', { 'class': 'lbl' });
      wb.appendChild(el('span', { 'class': 'lbl', style: 'font-weight:700;min-width:15em' }, layer[0]));
      function refreshSum() {
        var t = 0; inputs.forEach(function (i) { t += Number(i.value) || 0; });
        sumEl.textContent = '合計 ' + Math.round(t * 100) / 100;
      }
      layer[1].forEach(function (x) {
        var inp = el('input', { type: 'number', min: '0', step: 'any', value: W[x[0]] == null ? 0 : W[x[0]] });
        inp.oninput = refreshSum;
        inp.onchange = function () { saveWeight(x[0], inp.value); };
        inputs.push(inp);
        var g = el('span', { 'class': 'grp' });
        g.appendChild(el('span', { 'class': 'lbl' }, x[1]));
        g.appendChild(inp);
        wb.appendChild(g);
      });
      refreshSum();
      wb.appendChild(sumEl);
      body.appendChild(wb);
    });

    var cats = [];
    d.items.forEach(function (it) { if ((it.term || '') === (st.term || '') && cats.indexOf(it.category) === -1) cats.push(it.category); });
    var tb = el('table'), head = el('tr');
    ['類別', '算在哪一項', '同一項裡的比例', '底分', '換算（總分不是 100 才需要）'].forEach(function (t) { head.appendChild(el('th', null, t)); });
    tb.appendChild(head);
    // 換算：一般類別都不需要，只有「筆記」（總分不是 100）和「態度」會用到，所以預設只在這兩種顯示開關；其他類別要用再按「設定換算」
    function scaleCell(c, cur, always) {
      var td = el('td', { 'class': 'scaleCell' }), on = Number(cur.hi) > (Number(cur.lo) || 0) && Number(cur.hi) > 0;
      function set(lo, hi) {
        var cc = cfg[c] || (cfg[c] = {});
        cc.lo = lo; cc.hi = hi;
        render();
        AX.call('setGradebookConfig', st.raw.gradebook).then(function () { AX.toast('已儲存'); }).catch(function (e) { AX.showError(e); });
      }
      if (!on && !always && !/筆記/.test(c)) {
        var more = el('button', { 'class': 'secondary tiny', type: 'button' }, '設定換算');
        more.onclick = function () { set(70, 100); };
        td.appendChild(more);
        return td;
      }
      var sel = el('select');
      sel.appendChild(el('option', { value: '0' }, '不換算'));
      sel.appendChild(el('option', { value: '1' }, '換算成'));
      sel.value = on ? '1' : '0';
      sel.onchange = function () { if (sel.value === '1') set(70, 100); else set(0, 0); };
      td.appendChild(sel);
      if (on) {
        var lo = el('input', { type: 'number', min: '0', max: '99', step: 'any', value: cur.lo || 0 });
        var hi = el('input', { type: 'number', min: '1', max: '100', step: 'any', value: cur.hi });
        lo.title = '全班最低分換成這個分數'; hi.title = '全班最高分換成這個分數';
        lo.onchange = hi.onchange = function () { set(Number(lo.value) || 0, Number(hi.value) || 0); };
        td.appendChild(document.createTextNode(' '));
        td.appendChild(lo);
        td.appendChild(document.createTextNode(' ～ '));
        td.appendChild(hi);
        td.appendChild(el('div', { 'class': 'muted small' }, c === '態度' ? '用全班輸入的態度分數：最低分→' + (cur.lo || 0) + '，最高分→' + cur.hi + '，其他照比例' : '用班上現有的分數：最低分→' + (cur.lo || 0) + '，最高分→' + cur.hi + '，沒交算 ' + (cur.lo || 0)));
      }
      return td;
    }
    if (cats.indexOf('態度') === -1) {
      var atr = el('tr'), acur = cfg['態度'] || {};
      atr.appendChild(el('td', null, '態度'));
      atr.appendChild(el('td', { 'class': 'muted' }, '態度（在詳表直接輸入）'));
      var aw = el('input', { type: 'number', min: '0', step: 'any', value: acur.weight == null ? 1 : acur.weight });
      aw.onchange = function () { saveCfg('態度', 'weight', aw.value); };
      var atd = el('td'); atd.appendChild(aw); atr.appendChild(atd);
      atr.appendChild(el('td', { 'class': 'muted' }, '—'));
      atr.appendChild(scaleCell('態度', acur, true));
      tb.appendChild(atr);
    }
    cats.forEach(function (c) {
      var tr = el('tr'), kind = st.raw.kinds[c] || S.defaultKind(c), cur = cfg[c] || {};
      tr.appendChild(el('td', null, c || '（未分類）'));
      var sel = el('select');
      KIND_OPTS.forEach(function (o) { sel.appendChild(el('option', { value: o[0] }, o[1])); });
      sel.value = kind;
      sel.onchange = function () { saveKind(c, sel.value); };
      var td1 = el('td'); td1.appendChild(sel); tr.appendChild(td1);
      var w = el('input', { type: 'number', min: '0', step: 'any', value: cur.weight == null ? 1 : cur.weight });
      w.title = '例如國習、筆記都填 1，就是各占一半；填 0＝列出來但不計分';
      w.onchange = function () { saveCfg(c, 'weight', w.value); };
      var td2 = el('td'); td2.appendChild(w); tr.appendChild(td2);
      var b = el('input', { type: 'number', min: '0', max: '99', step: 'any', value: cur.base || 0 });
      b.title = '例如筆記填 50：分數＝50＋得分÷2，空白就是 50 分，超過滿分不計入';
      b.onchange = function () { saveCfg(c, 'base', b.value); };
      var td3 = el('td'); td3.appendChild(b); tr.appendChild(td3);
      tr.appendChild(scaleCell(c, cur, false));
      tb.appendChild(tr);
    });
    body.appendChild(tb);
    body.appendChild(el('p', { 'class': 'muted small' }, '表格裡的分組就是「類別」：國習 1～6 的類別都設成「國習」，就會合成一欄「國習」平均。可以在登記面板「科目設定 → 項目管理」勾選多個項目一次改類別。'));
  }

  function saveWeight(key, value) {
    var w = {}, cur = weightsOf(st.subject);
    Object.keys(cur).forEach(function (k) { w[k] = cur[k]; });
    w[key] = value === '' ? 0 : Number(value);
    AX.call('setSubjectWeights', st.subject, w).then(function () {
      st.raw.subjectWeights = st.raw.subjectWeights || {};
      st.raw.subjectWeights[st.subject] = w;
      render();
      AX.toast('已儲存比例');
    }).catch(function (e) { AX.showError(e); render(); });
  }
  function saveKind(category, kind) {
    AX.call('setCategoryKind', category, kind).then(function () { AX.toast('已儲存'); load(); }).catch(function (e) { AX.showError(e); render(); });
  }
  function saveCfg(category, field, value) {
    var cfg = cfgOf(st.subject), c = cfg[category] || (cfg[category] = {});
    c[field] = value === '' ? 0 : Number(value);
    render();
    AX.call('setGradebookConfig', st.raw.gradebook).then(function () { AX.toast('已儲存'); }).catch(AX.showError);
  }

  // ---- 工具列 --------------------------------------------------
  AX.$('optLow').value = st.low;
  AX.$('optBlank').value = st.blank;
  AX.$('optBlank').onchange = function () { var v = Number(this.value); if (this.value !== '' && v >= 0 && v <= 100) { st.blank = v; remember(); render(); } else this.value = st.blank; };
  AX.$('optPerPage').value = st.perPage;
  AX.$('optDec').value = String(st.dec);
  AX.$('optDec').onchange = function () { st.dec = Number(this.value) === 1 ? 1 : 2; remember(); render(); };
  AX.$('optLow').onchange = function () { var v = Number(this.value); if (v >= 0 && v <= 100) { st.low = v; remember(); render(); } };
  AX.$('optPerPage').onchange = function () { var v = Math.floor(Number(this.value)); if (v >= 4 && v <= 20) { st.perPage = v; remember(); render(); } };

  // ---- 下載 Excel：每個科目一個工作表（詳表的內容），數字是真的數字，貼到自己的表就能直接算 ----
  function plainHead(head) {
    var d = document.createElement('div');
    d.innerHTML = String(head).split('<span class="pct">').join('（').split('</span>').join('）');
    return d.textContent;
  }
  function sheetName(name, used) {
    var base = String(name).split('').filter(function (c) { return '[]:*?/'.indexOf(c) < 0 && c.charCodeAt(0) !== 92; }).join('').slice(0, 31) || '科目';
    var out = base, k = 2;
    while (used[out]) out = base.slice(0, 28) + '(' + (k++) + ')';
    used[out] = true;
    return out;
  }
  function sheetOf(subject, G) {
    var built = detailColumns(G), tail = tailColumns(G), cols = built.cols, all = cols.concat(tail);
    var width = 2 + all.length + 1, merges = [];
    var titleRow = [fullTerm(st.term) + '　' + subject + '　' + STAGE_NAME[st.stage] + '成績'];
    var top = ['座號', '姓名'], sub = ['', ''], pos = 0, c;
    built.tops.forEach(function (t) {
      if (t.single) { top.push(plainHead(cols[pos].head)); sub.push(''); merges.push({ s: { r: 1, c: top.length - 1 }, e: { r: 2, c: top.length - 1 } }); }
      else {
        var from = top.length;
        for (c = 0; c < t.n; c++) { top.push(c === 0 ? t.label : ''); sub.push(plainHead(cols[pos + c].head)); }
        merges.push({ s: { r: 1, c: from }, e: { r: 1, c: top.length - 1 } });
      }
      pos += t.n;
    });
    tail.forEach(function (x) { top.push(plainHead(x.head)); sub.push(''); merges.push({ s: { r: 1, c: top.length - 1 }, e: { r: 2, c: top.length - 1 } }); });
    top.push('排名'); sub.push('');
    merges.push({ s: { r: 1, c: 0 }, e: { r: 2, c: 0 } }, { s: { r: 1, c: 1 }, e: { r: 2, c: 1 } }, { s: { r: 1, c: width - 1 }, e: { r: 2, c: width - 1 } }, { s: { r: 0, c: 0 }, e: { r: 0, c: width - 1 } });
    var aoa = [titleRow, top, sub];
    function num(col, v) {
      if (v == null) return '';
      if (col.kind === 'item') return v;
      return S.gbRound(v, col.d2 ? G.dec : 1);
    }
    G.students.forEach(function (s, i) {
      var row = [s.seat === '' || s.seat == null ? '' : s.seat, s.name];
      all.forEach(function (col) { row.push(num(col, col.values[i])); });
      row.push(G.ranks[i] == null ? '' : G.ranks[i]);
      aoa.push(row);
    });
    var avgRow = ['', '全班平均'];
    all.forEach(function (col) { var vals = S.nonNull(col.values); avgRow.push(vals.length ? S.gbRound(S.mean(vals), col.d2 ? G.dec : 1) : ''); });
    avgRow.push('');
    aoa.push(avgRow);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = merges;
    var ws0 = [{ wch: 6 }, { wch: 10 }];
    all.forEach(function (col) { ws0.push({ wch: col.kind === 'item' ? 8 : 11 }); });
    ws0.push({ wch: 6 });
    ws['!cols'] = ws0;
    all.forEach(function (col, ci) {
      if (col.kind === 'item') return;
      var fmt = col.d2 && G.dec === 2 ? '0.00' : '0.0';
      for (var r = 3; r < aoa.length; r++) {
        var cell = ws[XLSX.utils.encode_cell({ r: r, c: 2 + ci })];
        if (cell && cell.t === 'n') cell.z = fmt;
      }
    });
    return ws;
  }
  function downloadExcel() {
    if (typeof XLSX === 'undefined') return AX.toast('Excel 功能需要連網載入，請確認網路後重新整理頁面', true);
    var wb = XLSX.utils.book_new(), used = {}, done = [], skipped = [];
    st.raw.subjects.forEach(function (d) {
      var G = gbOf(d.subject, st.stage);
      if (G.empty || !G.students.length || !hasGraded(G)) { skipped.push(d.subject); return; }
      XLSX.utils.book_append_sheet(wb, sheetOf(d.subject, G), sheetName(d.subject, used));
      done.push(d.subject);
    });
    if (!done.length) return AX.toast('這個學期、這個階段還沒有任何科目有成績', true);
    XLSX.writeFile(wb, '成績總表_' + fullTerm(st.term) + '_' + STAGE_NAME[st.stage] + '.xlsx');
    AX.toast('已下載：' + done.join('、') + (skipped.length ? '（' + skipped.join('、') + ' 這個階段還沒有成績，沒有放進去）' : ''));
  }
  AX.$('xlsBtn').onclick = downloadExcel;
  AX.$('reloadBtn').onclick = load;
  // 存成 PDF 時，瀏覽器預設的檔名是網頁標題：列印前先改成「學期_科目_期中（期末）成績總表」，印完還原
  var baseTitle = document.title;
  function setPrintTitle() {
    if (!st.subject || !st.term) return;
    document.title = fullTerm(st.term) + '_' + st.subject + '_' + (st.stage === 2 ? '期末' : '期中') + '成績總表' + (st.view === 'brief' ? '（簡表）' : '');
  }
  AX.$('printBtn').onclick = function () { setPrintTitle(); window.print(); };

  // 詳表欄位很多：列印前依紙張寬度（A4 橫式約 1060px）自動縮放，整張印在同一頁寬度內
  window.addEventListener('beforeprint', function () {
    setPrintTitle();
    var t = document.querySelector('table.gb');
    if (!t) return;
    t.style.zoom = '';
    t.style.fontSize = '10.5px';
    var w = t.scrollWidth;
    t.style.zoom = w > 1060 ? String(1060 / w) : '';
  });
  window.addEventListener('afterprint', function () {
    document.title = baseTitle;
    var t = document.querySelector('table.gb');
    if (t) { t.style.zoom = ''; t.style.fontSize = ''; }
  });

  load();
})();
</script>
</body>
</html>
